plugins { id 'com.android.application' }

// 서명: CI 가 app/release.p12 를 내려놓으면 그 키로, 없으면 디버그 키로 (설치는 되지만 키가 달라 덮어쓰기 안 됨)
def ksFile = rootProject.file('app/release.p12')
def hasKs = ksFile.exists()
def buildNo = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')

android {
    namespace 'online.pineandco.happyhour'
    compileSdk 34
    defaultConfig {
        applicationId 'online.pineandco.happyhour'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1.${buildNo}"
    }
    if (hasKs) {
        signingConfigs {
            release {
                storeFile ksFile
                storeType 'PKCS12'
                storePassword(System.getenv('KS_PASS') ?: '')
                keyAlias(System.getenv('KEY_ALIAS') ?: 'pineandco')
                keyPassword(System.getenv('KEY_PASS') ?: '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
