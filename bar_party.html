<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PINE BAR PARTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{ --bg:#0d0f0c; --panel:#161a14; --pine:#3a7d4f; --pine-light:#6fcf8f; --amber:#e6b450; --red:#d9544d; --ink:#e8e6dd; --dim:#8a8d82; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family:'Press Start 2P', monospace; color:var(--ink); display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; background:radial-gradient(120% 90% at 50% -10%, #1a2016 0%, #0d0f0c 60%); }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:560px; max-height:100vh; margin:0 auto; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:56px 16px 22px; text-align:center; }
  .hidden{ display:none !important; }
  .kr{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; }
  h1{ font-size:clamp(20px,6.6vw,32px); color:var(--amber); line-height:1.3; text-shadow:3px 3px 0 #000; letter-spacing:1px; }
  h1 .sub{ display:block; font-size:.4em; color:var(--pine-light); margin-top:8px; letter-spacing:2px; }
  p.desc{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:clamp(12px,3.4vw,15px); color:var(--dim); line-height:1.6; max-width:420px; }
  .btn{ font-family:'Press Start 2P',monospace; font-size:clamp(11px,3vw,15px); color:#0d140a; background:var(--pine-light);
    border:3px solid #000; box-shadow:0 5px 0 #000; padding:14px 26px; cursor:pointer; letter-spacing:1px; transition:transform .06s,box-shadow .06s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .btn.amber{ background:var(--amber); } .btn.ghost{ background:var(--panel); color:var(--ink); border-color:var(--pine); }
  .pcount{ display:flex; gap:10px; }
  .pbtn{ font-family:'Press Start 2P',monospace; width:56px; height:56px; font-size:18px; color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; cursor:pointer; }
  .pbtn.sel{ color:#0d140a; background:var(--amber); border-color:#000; }
  .best{ font-size:11px; color:var(--dim); } .brand{ font-size:9px; letter-spacing:2px; color:var(--dim); }
  #hud{ position:absolute; top:0; left:0; right:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; z-index:5; pointer-events:none; }
  #hud .who{ color:var(--pine-light); font-size:12px; } #hud .rd{ color:var(--dim); font-size:10px; } #hud .sc{ color:var(--amber); font-size:15px; text-shadow:2px 2px 0 #000; }
  .mgtitle{ font-size:clamp(15px,4.6vw,22px); color:var(--amber); text-shadow:2px 2px 0 #000; }
  .mghint{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:13px; color:var(--dim); max-width:420px; line-height:1.5; }
  #stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; width:100%; }
  .bigbtn{ width:min(330px,86vw); height:74px; font-size:15px; }
  .bignum{ font-size:22px; color:var(--amber); text-shadow:2px 2px 0 #000; }
  /* 타이밍 */
  .tbar{ position:relative; width:min(360px,90vw); height:34px; background:#000; border:3px solid #333; overflow:hidden; }
  .tzone{ position:absolute; top:0; bottom:0; background:rgba(111,207,143,.5); border-left:2px solid var(--pine-light); border-right:2px solid var(--pine-light); }
  .tmark{ position:absolute; top:-4px; bottom:-4px; width:5px; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  /* 잔 */
  .glass{ position:relative; width:128px; height:190px; border:5px solid #d9e6dd; border-top:none; border-radius:0 0 26px 26px; background:rgba(255,255,255,.04); overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.4); }
  .gfill{ position:absolute; left:0; right:0; bottom:0; height:0%; } .gfill::after{ content:''; position:absolute; top:0; left:0; right:0; height:7px; background:rgba(255,255,255,.5); }
  .gline{ position:absolute; left:-8px; right:-8px; border-top:3px dashed var(--pine-light); } .gline .lbl{ position:absolute; right:0; top:-16px; font-size:9px; color:var(--pine-light); }
  .gband{ position:absolute; left:0; right:0; background:rgba(111,207,143,.16); }
  /* 연타 */
  .mashimg{ width:118px; height:150px; object-fit:contain; image-rendering:pixelated; transition:transform .05s; } .mashemoji{ font-size:96px; transition:transform .05s; }
  .meter{ width:min(320px,84vw); height:22px; background:#000; border:3px solid #333; overflow:hidden; } .meter i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--pine),var(--amber)); }
  /* 리듬 */
  .beatdot{ width:96px; height:96px; border-radius:50%; background:var(--panel); border:5px solid #2a3a2a; transition:transform .08s, background .08s, border-color .08s; }
  .beatdot.pulse{ transform:scale(1.35); background:var(--pine-light); border-color:#fff; }
  /* 타이머 */
  .timebar{ width:min(340px,86vw); height:12px; background:#000; border:2px solid #333; overflow:hidden; } .timebar i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--pine-light),var(--amber)); }
  /* 문제 */
  .qwrap{ width:150px; height:150px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:3px solid #2a3a2a; box-shadow:0 5px 0 #000; } .qwrap img{ width:78%; height:78%; object-fit:contain; image-rendering:pixelated; }
  .qicons{ display:flex; gap:10px; } .qicons img{ width:clamp(44px,13vw,58px); height:clamp(44px,13vw,58px); object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:4px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(400px,92vw); }
  .opt{ font-family:'Press Start 2P',monospace; font-size:clamp(8px,2.4vw,11px); color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:14px 6px; cursor:pointer; min-height:52px; line-height:1.35; }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .opt.right{ background:var(--pine-light); color:#0d140a; border-color:#000; } .opt.wrong{ background:var(--red); color:#fff; border-color:#000; }
  .igrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(360px,90vw); }
  .icell{ background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; aspect-ratio:1; }
  .icell:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .icell img{ width:80%; height:80%; object-fit:contain; image-rendering:pixelated; }
  .icell.right{ border-color:var(--pine-light); box-shadow:0 0 12px var(--pine-light),0 4px 0 #000; } .icell.wrong{ border-color:var(--red); }
  .seqrow{ display:flex; gap:12px; align-items:center; min-height:70px; } .seqrow img{ width:56px; height:56px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:5px; } .seqrow .num{ font-size:11px; color:var(--amber); }
  .padgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(340px,90vw); }
  .prog{ display:flex; gap:6px; } .prog b{ width:12px; height:12px; border:2px solid #333; background:#000; } .prog b.on{ background:var(--pine-light); }
  .rfield{ position:relative; width:min(360px,92vw); height:min(300px,44vh); background:var(--panel); border:3px solid #2a3a2a; overflow:hidden; }
  .rtarget{ position:absolute; width:56px; height:56px; object-fit:contain; image-rendering:pixelated; cursor:pointer; animation:pop .12s; } @keyframes pop{ from{ transform:scale(.4); } to{ transform:scale(1); } }
  .rate{ font-size:clamp(20px,6.4vw,36px); text-shadow:3px 3px 0 #000; } .rate.perfect{ color:var(--pine-light); } .rate.good{ color:var(--amber); } .rate.miss{ color:var(--red); }
  .addscore{ font-size:16px; color:var(--amber); }
  .rank{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; width:min(400px,92vw); }
  .rrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin:6px 0; border:2px solid #2a3a2a; background:var(--panel); }
  .rrow.win{ border-color:var(--amber); background:rgba(230,180,80,.14); box-shadow:0 0 12px rgba(230,180,80,.4); }
  .rrow .nm{ font-weight:700; } .rrow .pt{ color:var(--amber); font-variant-numeric:tabular-nums; font-weight:800; } .crown{ font-size:20px; }
  /* 샌드박스 */
  #sandbox{ justify-content:flex-start; }
  .sbwrap{ width:min(440px,94vw); max-height:72vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px; }
  .sbtn{ font-family:'Press Start 2P',monospace; font-size:9px; line-height:1.3; color:var(--ink); background:var(--panel); border:2px solid #333; box-shadow:0 3px 0 #000; padding:12px 6px; cursor:pointer; text-align:center; }
  .sbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #000; } .sbtn .cat{ display:block; font-size:7px; color:var(--pine-light); margin-bottom:5px; letter-spacing:1px; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden"><div><div class="who" id="hudWho">PLAYER 1</div><div class="rd" id="hudRd">ROUND 1/5</div></div><div class="sc" id="hudSc">0</div></div>
  <div class="flash" id="flash"></div>

  <div id="title" class="screen">
    <div class="brand">PINE &amp; CO · PARTY</div>
    <h1>BAR<br>PARTY<span class="sub" id="subCount">바텐더 미니게임</span></h1>
    <p class="desc">따르고 · 맞히고 · 흔들고 · 던져라.<br>번갈아 플레이하고 <b>최고 점수</b>를 가려라.</p>
    <div class="kr" style="font-size:11px;color:var(--dim)">인원 수</div>
    <div class="pcount" id="pcount"></div>
    <button class="btn amber" id="startBtn">START</button>
    <button class="btn ghost" id="sandboxBtn">🎮 SANDBOX 체험</button>
    <div class="best">BEST · <b id="bestVal">0</b></div>
  </div>

  <div id="sandbox" class="screen hidden">
    <div class="mgtitle">🎮 SANDBOX</div>
    <div class="mghint">해보고 싶은 미니게임을 골라라</div>
    <div class="sbwrap" id="sbwrap"></div>
    <button class="btn ghost" id="sbBack">← HOME</button>
  </div>

  <div id="turn" class="screen hidden">
    <div class="mgtitle" id="turnWho">PLAYER 1</div>
    <p class="desc" id="turnMsg">준비되면 눌러라</p>
    <button class="btn" id="turnBtn">READY!</button>
  </div>

  <div id="game" class="screen hidden"><div id="stage"></div></div>

  <div id="roundResult" class="screen hidden"><div class="rate" id="rrRate">GOOD</div><div class="addscore" id="rrAdd">+72</div></div>

  <div id="final" class="screen hidden">
    <h1 style="font-size:clamp(16px,5vw,26px)">RESULTS</h1>
    <div class="rank" id="rankList"></div>
    <button class="btn amber" id="againBtn">PLAY AGAIN</button>
    <button class="btn ghost" id="homeBtn">HOME</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage');
  function show(id){ ['title','sandbox','turn','game','roundResult','final'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }
  const rnd=n=>Math.floor(Math.random()*n);
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const sample=(arr,n)=>shuffle([...arr]).slice(0,n);
  const now=()=>performance.now();

  let AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function beep(f,d,t,v){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=t||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(v||0.14,a.currentTime+0.006); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.12));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }catch(e){} }
  const sGood=()=>{beep(660,0.09);setTimeout(()=>beep(990,0.12),70);};
  const sBad=()=>beep(150,0.22,'sawtooth');
  const sTap=()=>beep(300+Math.random()*140,0.04,'square',0.09);
  function flash(c){ const f=$('flash'); f.style.transition='none'; f.style.background=c||'#fff'; f.style.opacity='0.65'; requestAnimationFrame(()=>{ f.style.transition='opacity .3s'; f.style.opacity='0'; }); }

  // 데이터
  const COCKTAILS={ gintonic:'GIN TONIC', margarita:'MARGARITA', whiskysour:'WHISKY SOUR', bloodymary:'BLOODY MARY', negroni:'NEGRONI',
    espressomartini:'ESPRESSO MARTINI', mojito:'MOJITO', cosmopolitan:'COSMOPOLITAN', manhattan:'MANHATTAN', oldfashioned:'OLD FASHIONED',
    moscowmule:'MOSCOW MULE', vodkatonic:'VODKA TONIC', sidecar:'SIDECAR', southside:'SOUTHSIDE', drymartini:'DRY MARTINI',
    highball:'HIGHBALL', vodkacranberry:'VODKA CRANBERRY', corpsereviver:'CORPSE REVIVER', gimlet:'GIMLET', vodkamartini:'VODKA MARTINI' };
  const CK=Object.keys(COCKTAILS);
  const SPIRITS={ gin:'GIN', vodka:'VODKA', whiskey:'WHISKEY', rum:'RUM', tequila:'TEQUILA', brandy:'BRANDY' };
  const SP=Object.keys(SPIRITS);
  const ING={ lime:'LIME', lemon:'LEMON', mint:'MINT', olive:'OLIVE', orange:'ORANGE', tomato:'TOMATO', coffee:'COFFEE', sugar:'SUGAR',
    soda:'SODA', tonic:'TONIC', gingerbeer:'GINGER BEER', campari:'CAMPARI', angostura:'ANGOSTURA', cointreau:'COINTREAU', absinthe:'ABSINTHE',
    syrup:'SYRUP', dryver:'DRY VERMOUTH', sweetver:'SWEET VERMOUTH', agave:'AGAVE' };
  const IK=Object.keys(ING);
  const RECIPES={ mojito:['mint','lime','soda'], moscowmule:['gingerbeer','lime'], espressomartini:['coffee','sugar'], negroni:['campari','sweetver','orange'],
    gintonic:['tonic','lime'], bloodymary:['tomato','lemon'], oldfashioned:['angostura','sugar','orange'], drymartini:['olive','dryver'],
    corpsereviver:['absinthe','cointreau','lemon'], whiskysour:['lemon','sugar'], sidecar:['cointreau','lemon'], margarita:['agave','lime','cointreau'] };
  const RK=Object.keys(RECIPES);
  const GARNISH={ drymartini:'OLIVE', vodkamartini:'OLIVE', mojito:'MINT', southside:'MINT', moscowmule:'LIME', gintonic:'LIME', margarita:'LIME',
    gimlet:'LIME', cosmopolitan:'LIME', negroni:'ORANGE', oldfashioned:'ORANGE', manhattan:'CHERRY', whiskysour:'CHERRY', bloodymary:'CELERY', sidecar:'LEMON' };
  const GK=Object.keys(GARNISH); const GARNISH_SET=['OLIVE','MINT','LIME','LEMON','ORANGE','CHERRY','CELERY'];
  const POUR_COLORS=['#ffe08a','#e6a94a','#ff8a3c','#c96b5a','#8fe0a0','#ff6a5a','#bfe6ff','#ff8ab0','#d9a441'];
  const gr=c=>'linear-gradient('+c+',#a86a2a)';

  let players=[], cur=0, round=0, ROUNDS=5, best=parseInt(localStorage.getItem('pine_barparty_best')||'0')||0, lastGame=-1;
  $('bestVal').textContent=best.toLocaleString();

  let pn=2;
  (function(){ const box=$('pcount'); for(let i=1;i<=4;i++){ const b=document.createElement('button'); b.className='pbtn'+(i===2?' sel':''); b.textContent=i;
    b.onclick=()=>{ pn=i; ac(); beep(500,0.05); [...box.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); }; box.appendChild(b); } })();

  $('startBtn').onclick=()=>{ ac(); beep(700,0.1); players=[]; for(let i=0;i<pn;i++) players.push({name:'PLAYER '+(i+1),score:0}); cur=0; startTurn(); };
  function startTurn(){ round=0; const p=players[cur]; $('turnWho').textContent=p.name; $('turnMsg').textContent=(players.length>1?'폰을 넘겨받았으면 눌러라':'준비되면 눌러라'); show('turn'); $('hud').classList.add('hidden'); }
  $('turnBtn').onclick=()=>{ beep(700,0.1); nextRound(); };
  function hud(){ const p=players[cur]; $('hudWho').textContent=p.name; $('hudRd').textContent='ROUND '+(round+1)+'/'+ROUNDS; $('hudSc').textContent=p.score; $('hud').classList.remove('hidden'); }
  function nextRound(){ if(round>=ROUNDS){ endTurn(); return; } hud(); let g; do{ g=rnd(GAMES.length); }while(GAMES.length>1 && g===lastGame); lastGame=g;
    show('game'); stage.innerHTML=''; let done=false; GAMES[g].run(function(s,t,c){ if(done) return; done=true; award(Math.round(s),t,c); }); }
  function award(score, rateTxt, rateCls){ score=Math.max(0,Math.min(100,score)); players[cur].score+=score; $('hudSc').textContent=players[cur].score;
    $('rrRate').textContent=rateTxt; $('rrRate').className='rate '+rateCls; $('rrAdd').textContent='+'+score; show('roundResult');
    if(rateCls==='miss') sBad(); else sGood(); setTimeout(()=>{ round++; nextRound(); }, 1000); }
  function endTurn(){ $('hud').classList.add('hidden'); cur++; if(cur<players.length) startTurn(); else showFinal(); }
  function showFinal(){ const ranked=[...players].map(p=>({...p})).sort((a,b)=>b.score-a.score); const top=ranked[0].score;
    if(top>best){ best=top; localStorage.setItem('pine_barparty_best',String(best)); $('bestVal').textContent=best.toLocaleString(); }
    const list=$('rankList'); list.innerHTML=''; ranked.forEach((p,i)=>{ const row=document.createElement('div'); row.className='rrow'+(i===0?' win':'');
      row.innerHTML='<span class="nm">'+(i===0?'<span class="crown">👑</span> ':'#'+(i+1)+' ')+p.name+'</span><span class="pt">'+p.score.toLocaleString()+'</span>'; list.appendChild(row); });
    show('final'); sGood(); flash('#e6b450'); }
  $('againBtn').onclick=()=>{ beep(700,0.1); players.forEach(p=>p.score=0); cur=0; startTurn(); };
  $('homeBtn').onclick=()=>{ beep(500,0.08); show('title'); };

  // 샌드박스
  $('sandboxBtn').onclick=()=>{ ac(); beep(600,0.08); buildSandbox(); show('sandbox'); };
  $('sbBack').onclick=()=>{ beep(500,0.08); show('title'); };
  function buildSandbox(){ const w=$('sbwrap'); w.innerHTML=''; GAMES.forEach((g,i)=>{ const b=document.createElement('button'); b.className='sbtn'; b.innerHTML='<span class="cat">'+g.cat+'</span>'+g.name;
    b.onclick=()=>{ ac(); beep(660,0.08); playSandbox(i); }; w.appendChild(b); }); }
  function playSandbox(i){ $('hud').classList.add('hidden'); show('game'); stage.innerHTML=''; let done=false;
    GAMES[i].run(function(s,t,c){ if(done) return; done=true; $('rrRate').textContent=t; $('rrRate').className='rate '+c; $('rrAdd').textContent='SCORE '+Math.round(s); show('roundResult');
      if(c==='miss') sBad(); else sGood(); setTimeout(()=>{ buildSandbox(); show('sandbox'); }, 1200); }); }

  /* ====================== 엔진 ====================== */
  function engTiming(cfg, done){
    stage.innerHTML='<div class="mgtitle">'+cfg.title+'</div><div class="mghint">'+cfg.hint+'</div><div class="tbar" id="tbar"><div class="tzone" id="tz"></div><div class="tmark" id="tm"></div></div><button class="btn amber bigbtn" id="tstop">STOP!</button>';
    const bar=$('tbar'); const W=bar.clientWidth||330; const zw=Math.round(W*cfg.zone); const zx=Math.round(16+Math.random()*Math.max(1,(W-32-zw)));
    $('tz').style.left=zx+'px'; $('tz').style.width=zw+'px'; const tm=$('tm'); let x=0,dir=1,raf,settled=false; const spd=cfg.speed*(W/300);
    function loop(){ if(settled) return; x+=dir*spd; if(x<=0){x=0;dir=1;} if(x>=W-5){x=W-5;dir=-1;} tm.style.left=x+'px'; raf=requestAnimationFrame(loop); }
    function stop(e){ if(e)e.preventDefault(); if(settled) return; settled=true; cancelAnimationFrame(raf); const c=x+2.5, center=zx+zw/2, d=Math.abs(c-center);
      let sc,txt,cls; if(c>=zx && c<=zx+zw){ sc=Math.round(100-(d/(zw/2))*22); if(sc>=96){txt='PERFECT!';cls='perfect';flash('#6fcf8f');}else{txt='NICE';cls='good';} }
      else { sc=Math.max(0,Math.round(50-(d-zw/2)*0.5)); txt='MISS'; cls='miss'; } done(sc,txt,cls); }
    $('tstop').addEventListener('click',stop); loop();
  }
  function engHold(cfg, done){
    stage.innerHTML='<div class="mgtitle">'+cfg.title+'</div><div class="mghint">'+cfg.hint+'</div><div class="glass"><div class="gband" id="gb"></div><div class="gfill" id="gf"></div><div class="gline" id="gl"><span class="lbl">'+(cfg.showLine?'여기':'')+'</span></div></div><button class="btn amber bigbtn" id="hb">'+cfg.label+'</button>';

  function engRhythm(cfg, done){

    for(let c=3;c>=1;c--) setTimeout(()=>{ if(!done_) $('bn').textContent=c; beep(400,0.08); }, (start-1600)+ (3-c)*450 - (start-now()) + (start-now()) ); // countdown 3..1

    { name:'SPILL WIPE', cat:'반응', run:d=>engReaction({title:'SPILL WIPE',hint:'흘린 것을 빠르게 치워라!',img:()=>'assets/ing_'+['bubble','droplet','water','lime','lemon'][rnd(5)]+'.png',goal:12,dur:6000,gap:()=>320},d) },
    { name:'FLY SWAT', cat:'반응', run:d=>engReaction({title:'FLY SWAT',hint:'초파리를 잡아라!',emoji:['🪰','🦟'],goal:10,dur:6000,gap:()=>380,life:900},d) },
  ];
  document.getElementById('subCount').textContent='바텐더 미니게임 '+GAMES.length+'종';

  // 프리로드
  ['proj_shaker'].concat(CK.map(k=>'cocktail_'+k)).concat(SP.map(k=>'cocktail_'+k)).concat(IK.map(k=>'ing_'+k)).forEach(k=>{ const i=new Image(); i.src='assets/'+k+'.png'; });
  show('title');
})();
</script>
