<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PINE BAR PARTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{ --bg:#0d0f0c; --panel:#161a14; --pine:#3a7d4f; --pine-light:#6fcf8f; --amber:#e6b450; --red:#d9544d; --ink:#e8e6dd; --dim:#8a8d82; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family:'Press Start 2P', monospace; color:var(--ink); display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; background:radial-gradient(120% 90% at 50% -10%, #1a2016 0%, #0d0f0c 60%); }
  #wrap{ position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:56px 16px 22px; text-align:center; }
  .hidden{ display:none !important; }
  .kr{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; }
  h1{ font-size:clamp(20px,6.6vw,32px); color:var(--amber); line-height:1.3; text-shadow:3px 3px 0 #000; letter-spacing:1px; }
  h1 .sub{ display:block; font-size:.4em; color:var(--pine-light); margin-top:8px; letter-spacing:2px; }
  p.desc{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:clamp(12px,3.4vw,15px); color:var(--dim); line-height:1.6; max-width:420px; }
  .btn{ font-family:'Press Start 2P',monospace; font-size:clamp(11px,3vw,15px); color:#0d140a; background:var(--pine-light);
    border:3px solid #000; box-shadow:0 5px 0 #000; padding:14px 26px; cursor:pointer; letter-spacing:1px; transition:transform .06s,box-shadow .06s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .btn.amber{ background:var(--amber); } .btn.ghost{ background:var(--panel); color:var(--ink); border-color:var(--pine); }
  .pcount{ display:flex; gap:10px; }
  .pbtn{ font-family:'Press Start 2P',monospace; width:56px; height:56px; font-size:18px; color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; cursor:pointer; }
  .pbtn.sel{ color:#0d140a; background:var(--amber); border-color:#000; }
  .best{ font-size:11px; color:var(--dim); } .brand{ font-size:9px; letter-spacing:2px; color:var(--dim); }
  #hud{ position:absolute; top:0; left:0; right:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; z-index:5; pointer-events:none; }
  #hud .who{ color:var(--pine-light); font-size:12px; } #hud .rd{ color:var(--dim); font-size:10px; } #hud .sc{ color:var(--amber); font-size:15px; text-shadow:2px 2px 0 #000; }
  .mgtitle{ font-size:clamp(15px,4.6vw,22px); color:var(--amber); text-shadow:2px 2px 0 #000; }
  .mghint{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--dim); max-width:min(92vw,480px); line-height:1.8; }
  #stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; width:100%; }
  .bigbtn{ width:min(330px,86vw); height:74px; font-size:15px; }
  .bignum{ font-size:22px; color:var(--amber); text-shadow:2px 2px 0 #000; }
  /* 타이밍 */
  .tbar{ position:relative; width:min(360px,90vw); height:34px; background:#000; border:3px solid #333; overflow:hidden; }
  .tzone{ position:absolute; top:0; bottom:0; background:rgba(111,207,143,.5); border-left:2px solid var(--pine-light); border-right:2px solid var(--pine-light); }
  .tmark{ position:absolute; top:-4px; bottom:-4px; width:5px; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  /* 잔 */
  .glass{ position:relative; width:128px; height:190px; border:5px solid #d9e6dd; border-top:none; border-radius:0 0 26px 26px; background:rgba(255,255,255,.04); overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.4); }
  .gfill{ position:absolute; left:0; right:0; bottom:0; height:0%; } .gfill::after{ content:''; position:absolute; top:0; left:0; right:0; height:7px; background:rgba(255,255,255,.5); }
  .gline{ position:absolute; left:-8px; right:-8px; border-top:3px dashed var(--pine-light); } .gline .lbl{ position:absolute; right:0; top:-16px; font-size:9px; color:var(--pine-light); }
  .gband{ position:absolute; left:0; right:0; background:rgba(111,207,143,.16); }
  /* 연타 */
  .mashimg{ width:118px; height:150px; object-fit:contain; image-rendering:pixelated; transition:transform .05s; } .mashemoji{ font-size:96px; transition:transform .05s; }
  .meter{ width:min(320px,84vw); height:22px; background:#000; border:3px solid #333; overflow:hidden; } .meter i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--pine),var(--amber)); }
  /* 리듬 */
  .beatdot{ width:96px; height:96px; border-radius:50%; background:var(--panel); border:5px solid #2a3a2a; transition:transform .08s, background .08s, border-color .08s; }
  .beatdot.pulse{ transform:scale(1.35); background:var(--pine-light); border-color:#fff; }
  /* 타이머 */
  .timebar{ width:min(340px,86vw); height:12px; background:#000; border:2px solid #333; overflow:hidden; } .timebar i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--pine-light),var(--amber)); }
  /* 문제 */
  .qwrap{ width:150px; height:150px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:3px solid #2a3a2a; box-shadow:0 5px 0 #000; } .qwrap img{ width:78%; height:78%; object-fit:contain; image-rendering:pixelated; }
  .qicons{ display:flex; gap:10px; } .qicons img{ width:clamp(44px,13vw,58px); height:clamp(44px,13vw,58px); object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:4px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(400px,92vw); }
  .opt{ font-family:'Press Start 2P',monospace; font-size:clamp(8px,2.4vw,11px); color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:14px 6px; cursor:pointer; min-height:52px; line-height:1.35; }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .opt.right{ background:var(--pine-light); color:#0d140a; border-color:#000; } .opt.wrong{ background:var(--red); color:#fff; border-color:#000; }
  .igrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(360px,90vw); }
  .icell{ background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; aspect-ratio:1; }
  .icell:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .icell img{ width:80%; height:80%; object-fit:contain; image-rendering:pixelated; }
  .icell.right{ border-color:var(--pine-light); box-shadow:0 0 12px var(--pine-light),0 4px 0 #000; } .icell.wrong{ border-color:var(--red); }
  .seqrow{ display:flex; gap:12px; align-items:center; min-height:70px; } .seqrow img{ width:56px; height:56px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:5px; } .seqrow .num{ font-size:11px; color:var(--amber); }
  .padgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(340px,90vw); }
  .prog{ display:flex; gap:6px; } .prog b{ width:12px; height:12px; border:2px solid #333; background:#000; } .prog b.on{ background:var(--pine-light); }
  .rfield{ position:relative; width:min(360px,92vw); height:min(300px,44vh); background:var(--panel); border:3px solid #2a3a2a; overflow:hidden; }
  .rtarget{ position:absolute; width:56px; height:56px; object-fit:contain; image-rendering:pixelated; cursor:pointer; animation:pop .12s; } @keyframes pop{ from{ transform:scale(.4); } to{ transform:scale(1); } }
  .rate{ font-size:clamp(20px,6.4vw,36px); text-shadow:3px 3px 0 #000; } .rate.perfect{ color:var(--pine-light); } .rate.good{ color:var(--amber); } .rate.miss{ color:var(--red); }
  .addscore{ font-size:16px; color:var(--amber); }
  .rank{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; width:min(400px,92vw); }
  .rrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin:6px 0; border:2px solid #2a3a2a; background:var(--panel); }
  .rrow.win{ border-color:var(--amber); background:rgba(230,180,80,.14); box-shadow:0 0 12px rgba(230,180,80,.4); }
  .rrow .nm{ font-weight:700; } .rrow .pt{ color:var(--amber); font-variant-numeric:tabular-nums; font-weight:800; } .crown{ font-size:20px; }
  /* 샌드박스 */
  #sandbox{ justify-content:flex-start; }
  .sbwrap{ width:min(440px,94vw); max-height:72vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px; }
  .sbtn{ font-family:'Press Start 2P',monospace; font-size:9px; line-height:1.3; color:var(--ink); background:var(--panel); border:2px solid #333; box-shadow:0 3px 0 #000; padding:12px 6px; cursor:pointer; text-align:center; }
  .sbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #000; } .sbtn .cat{ display:block; font-size:7px; color:var(--pine-light); margin-bottom:5px; letter-spacing:1px; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
  /* 게임 캔버스 = 플레이 화면 전체. 배경은 캔버스 안에서만 그림 (겹침 없음) */
  #fpcv{ width:min(100vw,80vh); width:min(100vw,80dvh); flex:1 1 auto; min-height:0; align-self:center;
    border:none; background:#000; touch-action:none; image-rendering:pixelated; }
  #game{ padding:0 0 6px; gap:5px; justify-content:flex-start; }
  #game #stage{ flex:1 1 auto; min-height:0; width:100%; gap:6px; }
  #gameLogo{ max-height:60px; width:auto; max-width:80vw; margin-top:8px; image-rendering:pixelated; display:none; }
  /* 비시바시 타이틀 */
  /* 주의: position:relative를 주면 .screen의 absolute inset:0이 무효화되어 화면이 안 차게 됨 */
  /* 배경은 폰 비율(720x1560) 전용 제작본 — cover로 항상 꽉 참 */
  #title{ background:#1a0a06 url('assets/bp_title_bg.jpg') center/cover no-repeat;
    justify-content:space-evenly; gap:8px; padding:34px 16px 26px; }
  #decoCv{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  #title>*:not(#decoCv){ position:relative; z-index:1; }
  /* HOW TO PLAY 오버레이 */
  #howto{ position:absolute; inset:0; z-index:8; background:rgba(0,0,0,0.68); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; }
  .ht-bang{ font-family:'Press Start 2P',monospace; font-size:clamp(20px,6.4vw,30px); color:#ffd977;
    text-shadow:4px 4px 0 #000; transform:rotate(-4deg); animation:htpop .32s cubic-bezier(.2,2.2,.4,1); }
  @keyframes htpop{ from{ transform:scale(3.2) rotate(-12deg); opacity:0; } to{ transform:scale(1) rotate(-4deg); opacity:1; } }
  .ht-panel{ background:rgba(0,0,0,0.74); border:3px solid rgba(255,255,255,0.18); border-radius:10px; padding:18px 16px; max-width:340px; }
  .ht-name{ font-family:'Press Start 2P',monospace; font-size:12px; color:#e6b450; margin-bottom:12px; letter-spacing:1px; }
  .ht-desc{ font-family:'Press Start 2P',monospace; font-size:10px; color:#fff; line-height:1.9; }
  .ht-tap{ font-family:'Press Start 2P',monospace; font-size:10px; color:#6fcf8f; margin-top:14px; animation:htblink 1s step-end infinite; }
  @keyframes htblink{ 50%{ opacity:0.25; } }
  /* 랭킹 */
  .rkgame{ background:var(--panel); border:2px solid #2a3a2a; padding:10px 12px; text-align:left; }
  .rkgame h3{ font-size:10px; color:var(--amber); margin-bottom:7px; letter-spacing:1px; }
  .rkrow{ display:flex; justify-content:space-between; font-size:9px; color:var(--ink); padding:2.5px 0; }
  .rkrow .nm2{ color:#cde6d2; } .rkrow .sc2{ color:var(--amber); }
  .rkempty{ font-size:9px; color:var(--dim); }
  .imgbtn{ image-rendering:pixelated; cursor:pointer; display:none; transition:transform .06s, filter .06s; }
  .imgbtn:active{ transform:translateY(4px) scale(0.98); filter:brightness(1.15); }
  .sbtn2{ font-family:'Press Start 2P',monospace; font-size:clamp(9px,3.2vw,13px); border:none; width:100%;
    aspect-ratio:2.5/1; background:transparent center/100% 100% no-repeat; cursor:pointer; line-height:1.35;
    letter-spacing:.3px; image-rendering:pixelated; text-shadow:1px 1px 0 rgba(0,0,0,.5); transition:transform .06s; padding:0 12px; }
  .sbtn2:active{ transform:translateY(3px) scale(.98); }
  #sandbox{ background:#0d0f0c url('assets/pick_bg.jpg') center/cover no-repeat; gap:4px; padding:10px 10px 14px; }
  #sandbox .sbwrap{ width:min(640px,97vw); max-height:none; flex:1 1 auto; min-height:0; gap:10px; }
  #backBtn{ position:absolute; top:10px; right:10px; z-index:30; width:42px; height:42px;
    font-family:'Press Start 2P',monospace; font-size:15px; color:#e8e6dd; background:rgba(0,0,0,0.6);
    border:3px solid #444; box-shadow:0 3px 0 #000; cursor:pointer; }
  #backBtn:active{ transform:translateY(3px); box-shadow:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden"><div><div class="who" id="hudWho">PLAYER 1</div><div class="rd" id="hudRd">ROUND 1/5</div></div><div class="sc" id="hudSc">0</div></div>
  <div class="flash" id="flash"></div>

  <div id="title" class="screen">
    <canvas id="decoCv"></canvas>
    <img id="titleLogo" alt="PINE &amp; CO PARTY" style="width:min(360px,88vw);image-rendering:pixelated;display:none">
    <h1 id="titleH1">BAR<br>PARTY</h1>
    <div id="subCount" style="font-family:'Press Start 2P',monospace;font-size:9px;color:#eef6d8;letter-spacing:1px;text-shadow:2px 2px 0 #000">BARTENDER'S MINIGAMES</div>
    <button class="btn amber" id="startBtn">START</button>
    <button class="btn" id="rankBtn">🏆 RANKING</button>
    <button class="btn ghost" id="setBtn">⚙ SETTINGS</button>
    <img id="startImg" class="imgbtn" alt="START" style="width:min(250px,66vw)">
    <img id="rankImg" class="imgbtn" alt="RANKING" style="width:min(205px,54vw)">
    <img id="setImg" class="imgbtn" alt="SETTINGS" style="width:min(205px,54vw)">
  </div>

  <div id="rank" class="screen hidden" style="justify-content:flex-start">
    <div class="mgtitle">🏆 RANKING</div>
    <div class="mghint">Top 5 per game</div>
    <div class="sbwrap" id="rankWrap" style="grid-template-columns:1fr"></div>
    <button class="btn ghost" id="rankBack">← HOME</button>
  </div>

  <div id="setting" class="screen hidden">
    <div class="mgtitle">⚙ SETTINGS</div>
    <div class="kr" style="font-size:11px;color:var(--dim)">BGM VOLUME</div>
    <input type="range" id="setVol" min="0" max="100" style="width:220px">
    <button class="btn ghost" id="setBack">← HOME</button>
  </div>
  <button id="backBtn" class="hidden">✕</button>

  <div id="sandbox" class="screen hidden">
    <img id="pickTitle" alt="PICK A GAME!" style="width:min(480px,95vw);image-rendering:pixelated;display:none">
    <div class="mgtitle" id="pickTitleTxt">🍸 PICK A GAME!</div>
    <img id="pickSub" alt="SET YOUR RECORDS!" style="width:min(290px,72vw);image-rendering:pixelated;display:none;margin-top:-4px">
    <div class="mghint" id="pickSubTxt">Every game keeps its own TOP 5 — go set some records!</div>
    <div class="sbwrap" id="sbwrap"></div>
  </div>

  <div id="turn" class="screen hidden">
    <div class="mgtitle" id="turnWho">PLAYER 1</div>
    <p class="desc" id="turnMsg">Press when ready</p>
    <button class="btn" id="turnBtn">READY!</button>
  </div>

  <div id="game" class="screen hidden"><img id="gameLogo" alt=""><div id="stage"></div></div>

  <div id="howto" class="hidden">
    <div class="ht-bang">HOW TO PLAY!!</div>
    <div class="ht-panel"><div class="ht-name" id="htName"></div><div class="ht-desc" id="htDesc"></div><div class="ht-tap">TAP TO START!</div></div>
  </div>

  <div id="roundResult" class="screen hidden">
    <div class="rate" id="rrRate">GOOD</div><div class="addscore" id="rrAdd">+72</div>
    <div style="font-size:9px;color:var(--dim)">YOUR NAME</div>
    <input id="rrName" maxlength="8" style="font-family:'Press Start 2P',monospace;font-size:14px;text-transform:uppercase;width:170px;text-align:center;padding:10px;background:#000;color:var(--amber);border:3px solid #333">
    <button class="btn amber" id="rrSubmit">🏆 SUBMIT RANK</button>
    <div id="rrStatus" style="font-family:'Press Start 2P',monospace;font-size:9px;color:#6fcf8f;min-height:14px"></div>
    <button class="btn ghost" id="rrDone">OK</button>
  </div>

  <div id="final" class="screen hidden">
    <h1 style="font-size:clamp(16px,5vw,26px)">RESULTS</h1>
    <div class="rank" id="rankList"></div>
    <button class="btn amber" id="againBtn">PLAY AGAIN</button>
    <button class="btn ghost" id="homeBtn">HOME</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage');
  function show(id){ ['title','sandbox','turn','game','roundResult','final','rank','setting'].forEach(s=>$(s).classList.toggle('hidden', s!==id));
    const bb=$('backBtn'); if(bb) bb.classList.toggle('hidden', id==='title'||id==='roundResult');
    if(id!=='game'){ const gl=$('gameLogo'); if(gl) gl.style.display='none'; }
    if(id==='title') playTitleBgm(true); }
  let runToken=0;
  // ── BGM: 타이틀 1곡 루프 / 플레이 3곡 연속 루프 ──
  // iOS는 Audio.volume이 무시되므로 WebAudio GainNode로 볼륨을 제어 (설정 슬라이더 실동작)
  const BGM={ cur:null, name:'', vol:parseFloat(localStorage.getItem('bp_vol')||'0.6') };
  function bgmVol(){ return window.__mute?0:BGM.vol; }
  function mkTrack(url,loop){ const a=new Audio(url); a.loop=!!loop; let g=null;
    const c=ac(); if(c){ try{ const s=c.createMediaElementSource(a); g=c.createGain(); s.connect(g); g.connect(c.destination); }catch(e){ g=null; } }
    if(g){ a.volume=1; } return {a,g}; }
  function trkGet(t){ return t.g?t.g.gain.value:t.a.volume; }
  function trkSet(t,v){ v=Math.max(0,Math.min(1,v)); try{ if(t.g) t.g.gain.value=v; else t.a.volume=v; }catch(e){} }
  function bgmFade(t,to,ms,done){ if(!t){ if(done)done(); return; }
    const from=trkGet(t), t0=performance.now();
    (function st(){ const k=Math.min(1,(performance.now()-t0)/ms);
      trkSet(t,from+(to-from)*k);
      if(k<1) setTimeout(st,50); else if(done) done(); })(); }
  function stopBgm(fadeMs){ const old=BGM.cur; BGM.cur=null; BGM.name='';
    if(!old) return;
    if(fadeMs) bgmFade(old,0,fadeMs,()=>{ try{ old.a.pause(); }catch(e){} });
    else { try{ old.a.pause(); }catch(e){} } }
  function playTitleBgm(xf){ if(BGM.name==='title') return; stopBgm(xf?800:0);
    const t=mkTrack('assets/bgm_title.mp3',true); trkSet(t,xf?0:bgmVol());
    BGM.cur=t; BGM.name='title';
    t.a.play().then(()=>{ if(xf&&BGM.cur===t) bgmFade(t,bgmVol(),800); })
      .catch(()=>{ if(BGM.cur===t){ BGM.cur=null; BGM.name=''; } }); }
  let ptIdx=Math.floor(Math.random()*3);
  function playGameBgm(xf){ if(BGM.name==='play') return; stopBgm(xf?800:0); BGM.name='play';
    let first=!!xf;
    const step=()=>{ if(BGM.name!=='play') return;
      const t=mkTrack('assets/bgm_play'+(ptIdx+1)+'.mp3',false); trkSet(t,first?0:bgmVol());
      t.a.onended=()=>{ ptIdx=(ptIdx+1)%3; step(); };
      BGM.cur=t; t.a.play().then(()=>{ if(first&&BGM.cur===t){ first=false; bgmFade(t,bgmVol(),800); } })
        .catch(()=>{ if(BGM.cur===t){ BGM.cur=null; BGM.name=''; } }); };
    step(); }
  function bgmApplyVol(){ if(BGM.cur) trkSet(BGM.cur,bgmVol()); }
  const bgmKick=()=>{ if(!$('title').classList.contains('hidden')) playTitleBgm();
    document.removeEventListener('pointerdown',bgmKick); };
  document.addEventListener('pointerdown',bgmKick);
  const rnd=n=>Math.floor(Math.random()*n);
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

        ctx.font='7px "Press Start 2P"'; ctx.textAlign='center';
        for(let m=0;m<=maxM;m+=25){ const x3=wallMx+m*PXM*S;
          ctx.fillStyle=m===0?'#6fcf8f':'#555'; ctx.fillRect(x3,m===0?452:458,m===0?2:1,m===0?18:8);
          ctx.fillStyle=m===0?'#6fcf8f':'#8a8d82'; ctx.fillText(String(m),x3,450); }
        const mx=Math.max(mm0,Math.min(mm0+mmW,mm0+(ckX-mmStart)*S));
        const my=Math.max(440,462-Math.max(0,(GY-8-ckY))*0.028);
        ctx.fillStyle='#ffd977'; ctx.beginPath(); ctx.arc(mx,my,3.5,0,6.28); ctx.fill();
        if(state==='rest'){ ctx.fillStyle='#d9544d'; ctx.fillRect(mx-1,452,2,14); } }
      // 인트로 로고
      if(state==='intro'){ const al=it<ARM-300?1:1-(it-(ARM-300))/300;
        ctx.globalAlpha=Math.max(0,al); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,400,480);
        const lgi=CL.imgs.logo; if(lgi){ const k=0.55+eob2(Math.min(1,it/280))*0.45, lw=350*k, lh=lw*(lgi.height/lgi.width);
          ctx.drawImage(lgi,200-lw/2,215-lh/2,lw,lh); }
        ctx.globalAlpha=1; }
      // 스탬프
      if(stampObj){ const st2=(t-stampT)/1000;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,210); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-st2*6)*1.4; ctx.scale(k2,k2);
        ctx.font='22px "Press Start 2P"'; ctx.textAlign='center';
        const col=stampObj.cls==='perfect'?'#6fcf8f':(stampObj.cls==='good'?'#e6b450':'#d9544d');
        ctx.fillStyle='#000'; ctx.fillText(stampObj.txt,3,3); ctx.fillStyle=col; ctx.fillText(stampObj.txt,0,0); ctx.restore(); }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== FREE POUR MASTER ====================== */
  // 실사 픽셀아트 캔버스 프리푸어: 병을 완전히 뒤집고 ml 카운터를 보며 정확한 순간에 놓아라
  const FP={ imgs:{}, loading:false };
  function fpKey(img,maxW,thr,killAll){ // 흰 배경 플러드필 제거(+killAll: 갇힌 흰 구멍도 전역 제거 — 로고용)
    const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.drawImage(img,0,0); let d; try{ d=x.getImageData(0,0,w,h); }catch(e){ return c; }
    const p=d.data, seen=new Uint8Array(w*h), q=[];
    const TH=thr||224;
    const isW=i=>p[i*4]>TH&&p[i*4+1]>TH&&p[i*4+2]>TH;
    for(let i=0;i<w;i++){ q.push(i,(h-1)*w+i); } for(let j=1;j<h-1;j++){ q.push(j*w, j*w+w-1); }
    while(q.length){ const i=q.pop(); if(seen[i]) continue; seen[i]=1; if(!isW(i)) continue; p[i*4+3]=0;
      const cx=i%w; if(cx>0&&!seen[i-1]) q.push(i-1); if(cx<w-1&&!seen[i+1]) q.push(i+1);
      if(i>=w&&!seen[i-w]) q.push(i-w); if(i<w*(h-1)&&!seen[i+w]) q.push(i+w); }
    if(killAll){ for(let i=0;i<p.length;i+=4){ if(p[i+3]>0&&p[i]>243&&p[i+1]>243&&p[i+2]>243) p[i+3]=0; } }
    x.putImageData(d,0,0);
    if(maxW&&w>maxW){ const c2=document.createElement('canvas'); c2.width=maxW; c2.height=Math.round(h*maxW/w);
      const x2=c2.getContext('2d'); x2.imageSmoothingQuality='high'; x2.drawImage(c,0,0,c2.width,c2.height); return c2; }
    return c; }
  // 게임별 전용 배경 (50 베스트 바 스타일)
  const GB={ imgs:{}, loading:false };
  function gbLoad(){ if(GB.loading) return; GB.loading=true;
    ['freepour','stir','icecarving','champagne','shake','tipcatch','flyswat','orderup','whereshot','squeeze'].forEach(k=>{
      const im=new Image(); im.onload=()=>{ GB.imgs[k]=im; }; im.src='assets/bg_'+k+'.jpg'; }); }
  function fpKeyUI(img,maxW){ // UI 이미지용: 낮은 임계 키잉 + 가장자리 흰 잔재(halo) 2패스 제거
    const c=fpKey(img,maxW,205);
    try{ const g=c.getContext('2d'); const w=c.width,h=c.height;
      const dd=g.getImageData(0,0,w,h); const p=dd.data;
      for(let pass=0;pass<2;pass++){ const kill=[];
        for(let y=0;y<h;y++) for(let x2=0;x2<w;x2++){ const i=(y*w+x2)*4;
          if(p[i+3]===0) continue;
          if(p[i]>205&&p[i+1]>205&&p[i+2]>205){
            if((x2>0&&p[i-4+3]===0)||(x2<w-1&&p[i+4+3]===0)||(y>0&&p[i-w*4+3]===0)||(y<h-1&&p[i+w*4+3]===0)) kill.push(i); } }
        for(const i of kill) p[i+3]=0; }
      g.putImageData(dd,0,0); }catch(e){}
    return c; }
  function fpLoad(){ if(FP.loading) return; FP.loading=true; gbLoad();
    const srcs={ bg:['fp_bg',0], bottle:['fp_bottle',620], logo:['fp_logo',540,224,1], shot:['fp_shot',440], jigger:['fp_jigger',440], rocks:['fp_rocks',440] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ FP.imgs[k]=srcs[k][1]?fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]):im; }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  // 잔 스펙: cap/target = ml (1oz=30ml). in = 잔 내부 영역(그린 크기 대비 비율)
  const FP_GLASS=[
    { key:'shot',   name:'SHOT GLASS / 1oz',  cap:45, target:30, h:146, in:{top:.225,bot:.665,hwT:.245,hwB:.155} },
    { key:'jigger', name:'JIGGER / 1.5oz',    cap:60, target:45, h:164, in:{top:.095,bot:.495,hwT:.205,hwB:.04} },
    { key:'rocks',  name:'ROCKS GLASS / 2oz', cap:90, target:60, h:170, in:{top:.195,bot:.655,hwT:.285,hwB:.245} } ];
  const FP_RATE=10; // ml/초 — 3초=1oz(30ml), 실제 스피드푸어러 카운트 속도
  function fpNoise(){ const a=ac(); if(!a) return null; try{
    const len=Math.floor(a.sampleRate*0.4), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
    const gn=a.createGain(); gn.gain.value=0.0001; src.connect(bp); bp.connect(gn); gn.connect(a.destination); src.start();
    const ret={ set:(on,f)=>{ if(window.__mute) on=false; const t=a.currentTime; gn.gain.setTargetAtTime(on?0.09:0.0001,t,0.05); bp.frequency.setTargetAtTime(650+f*950,t,0.08); },
      kill:()=>{ try{ src.stop(); }catch(e){} } };
    (window.__noises=window.__noises||[]).push(ret); return ret; }catch(e){ return null; } }
  // 한 판 = 3연속 챌린지: 샷 30ml → 지거 45ml → 록스 60ml
  // cfg: { blind:카운터 숨김 } / done(평균점수, txt, cls, 오차합, 오차배열)
  function engFreePour(cfg, done){
    fpLoad();
    const blind=!!cfg.blind;
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="fpb">HOLD TO POUR</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('fpb');
    const GX=200, GBASE=444;
    const BH=280, BW=BH*0.75, GRIPX=0.47, GRIPY=0.31, TIPX=0.415, TIPY=0.05;
    const IDLE={x:312,y:176,a:0.14}, POUR={x:197,y:150,a:-Math.PI}, DUR=9500;
    const LOGO_T=1150, INTRO=1900; // 첫 인트로: 로고 크게(~1.15초) → 병/잔 등장 → 1.9초부터 입력
    const eob=x=>{ const c=1.70158, f=x-1; return 1+f*f*((c+1)*f+c); }; // easeOutBack
    let pourIdx=0, g, GH, GW, gx0, gy0, inTop, inBot, target;
    function setGlass(i){ g=FP_GLASS[i]; target=g.target; GH=g.h; GW=g.h; gx0=GX-GW/2; gy0=GBASE-GH;
      inTop=gy0+g.in.top*GH; inBot=gy0+g.in.bot*GH; }
    setGlass(0);
    const pourErrs=[], pourScores=[];
    let ml=0, hold=false, released=false, finished=false, flip=0, lastTick=0;
    let stampObj=null, stampT=0, shake=0, settleT=0, dribble=0, tailTau=0.2, t0=0, lastT=0, raf=0;
    let armT=INTRO, glassPopT=LOGO_T, bannerUntil=0; // armT: t0 기준 입력 허용 시각
    const parts=[], streamPts=[]; const noise=fpNoise();
    const lvlY=v=>inBot-(inBot-inTop)*Math.min(1,v/g.cap);
    const hwAt=y=>{ const f=(inBot-y)/Math.max(1,inBot-inTop); return (g.in.hwB+(g.in.hwT-g.in.hwB)*f)*GW; };
    function pose(){ const e=flip*flip*(3-2*flip);
      return { x:IDLE.x+(POUR.x-IDLE.x)*e, y:IDLE.y+(POUR.y-IDLE.y)*e, a:IDLE.a+(POUR.a-IDLE.a)*e }; }
    function tip(){ const p=pose(), lx=(TIPX-GRIPX)*BW, ly=(TIPY-GRIPY)*BH, c=Math.cos(p.a), s=Math.sin(p.a);
      return { x:p.x+lx*c-ly*s, y:p.y+lx*s+ly*c }; }
    function burst(x,y,n,cols,pw){ for(let i=0;i<n;i++){ const a2=Math.random()*Math.PI*2, v=(0.4+Math.random())*(pw||1);
      parts.push({x,y,vx:Math.cos(a2)*95*v,vy:Math.sin(a2)*95*v-130*v,gv:430,r:2+Math.random()*3,c:cols[rnd(cols.length)],life:0.5+Math.random()*0.45}); } }
    function judge(){
      const err=ml-target, ae=Math.abs(err); let sc,txt,cls,quip;
      if(ml>=g.cap-0.01){ sc=0; txt='SPILL!'; cls='miss'; quip=['THE BOSS SAW THAT!!','The floor drank more…'][rnd(2)]; burst(GX,inTop,36,['#ffd977','#c87f1e','#d9544d'],1.3); }
      else if(ae<=1.0){ sc=100; txt='PERFECT!'; cls='perfect'; quip=['Godlike wrist!!','A true pro count','Chilling accuracy'][rnd(3)]; }
      else if(ae<=3.0){ sc=Math.round(95-(ae-1)*8); txt='GOOD'; cls='good'; quip=err<0?'Half a beat early':'Half a beat late'; }
      else if(ae<=6.0){ sc=Math.round(72-(ae-3)*7); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?'The guest is glaring…':'Got greedy…'; }
      else { sc=Math.max(0,Math.round(50-(ae-6)*4)); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?"That's just a mist?":"That's a double!"; }
      stampObj={txt,cls,quip,err}; stampT=lastT;
      pourErrs.push(Math.min(ae,99.99)); pourScores.push(sc);
      if(cls==='perfect'){ flash('#6fcf8f'); sGood(); setTimeout(()=>beep(1320,0.14,'square',0.12),140); burst(GX,lvlY(ml),44,['#ffd977','#6fcf8f','#e6b450','#fff'],1.4); }
      else if(cls==='good') sGood();
      else { sBad(); shake=(txt==='SPILL!')?13:7; }
      setTimeout(()=>{ if(finished) return;
        if(pourIdx<2){ nextPour(); return; }
        finished=true; cleanup();
        const tot=pourErrs.reduce((a,b)=>a+b,0), avg=Math.round(pourScores.reduce((a,b)=>a+b,0)/3);
        let ftxt,fcls; if(tot<=3){ ftxt='POUR MASTER!'; fcls='perfect'; }
        else if(tot<=9){ ftxt='±'+tot.toFixed(1)+'ml'; fcls='good'; }
        else { ftxt='±'+tot.toFixed(1)+'ml'; fcls='miss'; }
        done(avg,ftxt,fcls,tot,pourErrs.slice()); },1350);
    }
    function nextPour(){ pourIdx++; setGlass(pourIdx); streamPts.length=0;
      ml=0; lastTick=0; hold=false; released=false; flip=0; stampObj=null; dribble=0;
      t0=lastT; armT=700; glassPopT=0; bannerUntil=lastT+1000; beep(700,0.08); }
    function release(force){ if(released||finished) return; if(!hold&&!force) return;
      // 병이 돌아오는 동안 물줄기가 가늘어지며 잔여분이 더 들어간다 (매번 조금씩 다름, 약 1.7~2.4ml)
      released=true; hold=false; dribble=(flip>0.92)?FP_RATE:flip*3; tailTau=0.17+Math.random()*0.07;
      if(noise) noise.set(false,0); settleT=lastT; }
    function dn(e){ e.preventDefault(); ac(); if(finished||released||stampObj||!t0||now()-t0<armT) return;
      if(!hold){ hold=true; beep(500,0.05,'square',0.08); } }
    function up(e){ if(e&&e.cancelable) e.preventDefault(); release(false); }
    cv.addEventListener('pointerdown',dn); btn.addEventListener('pointerdown',dn);
    ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,up));
    function cleanup(){ cancelAnimationFrame(raf); if(noise) noise.kill();
      ['pointerup','pointercancel'].forEach(ev=>window.removeEventListener(ev,up)); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      flip+=((hold&&!released)?1:-1)*dt/0.28; flip=Math.max(0,Math.min(1,flip));
      const pouring=hold&&!released&&flip>0.92;
      if(pouring){ ml+=FP_RATE*dt; if(noise) noise.set(true,Math.min(1,ml/g.cap));
        if(Math.floor(ml/10)>Math.floor(lastTick/10)) beep(880,0.04,'square',0.1);
        lastTick=ml; if(ml>=g.cap){ ml=g.cap; release(true); } }
      else if(noise&&hold) noise.set(false,0);
      if(released&&!stampObj&&dribble>0.03){ ml+=dribble*dt; dribble*=Math.exp(-dt/tailTau);
        if(ml>=g.cap){ ml=g.cap; dribble=0; } }
      if(released&&!stampObj&&t-settleT>620) judge();
      if(!released&&!stampObj&&t-t0>armT+DUR) release(true);
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.freepour||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height), bw2=bgi.width*s, bh2=bgi.height*s;
        ctx.drawImage(bgi,(400-bw2)/2,(480-bh2)/2,bw2,bh2); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,400,480);
      const it=t-t0;
      const gimg=FP.imgs[g.key];
      if(gimg&&it>glassPopT){ const gp=Math.min(1,(it-glassPopT)/350), s2=gp>=1?1:Math.max(0.01,eob(gp));
        ctx.save(); ctx.translate(GX,GBASE); ctx.scale(s2,s2); ctx.drawImage(gimg,-GW/2,-GH,GW,GH); ctx.restore(); }
      if(ml>0.05){ const wA=pouring?2.0:(released?Math.max(0.4,2-(t-settleT)/350):0.8);
        const sy2=Math.max(inTop-2,lvlY(ml))+Math.sin(t/60)*wA;
        const hwS=hwAt(sy2), hwB2=g.in.hwB*GW;
        ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.88;
        const lg=ctx.createLinearGradient(0,sy2,0,inBot); lg.addColorStop(0,'#f6c14a'); lg.addColorStop(1,'#b96f14');
        ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(GX-hwS,sy2); ctx.lineTo(GX+hwS,sy2);
        ctx.lineTo(GX+hwB2,inBot); ctx.lineTo(GX-hwB2,inBot); ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.globalAlpha=0.7; ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.ellipse(GX,sy2,hwS,3,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      if(!blind&&!stampObj&&it>glassPopT+340){ const ty2=lvlY(target); ctx.strokeStyle='#e6b450'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(gx0-8,ty2); ctx.lineTo(gx0+GW+8,ty2); ctx.stroke(); ctx.setLineDash([]);
        ctx.font='8px "Press Start 2P"'; ctx.textAlign='right'; ctx.fillStyle='#e6b450'; ctx.fillText(target+'ml',gx0-12,ty2+3); }
      // ── 물줄기: 팁에서 방출된 액체 조각이 각자 중력 낙하 (병이 움직여도 이미 나온 액체는 제자리에서 떨어진다) ──
      const flow=pouring?FP_RATE:((released&&!stampObj)?dribble:0);
      const spout=flip>0.55; // 주둥이가 아래를 향할 때만 액체가 나온다 (세워지면 방출 중단, 공중 기둥만 낙하)
      if(spout&&flow>0.35){ const tp=tip(); streamPts.push({x:tp.x,y:tp.y+3,vy:110,w:0.7+flow*0.38}); }
      else if(flip>0.35&&flow>0.08&&Math.random()<0.5){ const tp=tip(); // 기울어진 주둥이 끝의 마지막 방울들
        parts.push({x:tp.x+(Math.random()*3-1.5),y:tp.y+4,vx:(Math.random()*2-1)*8,vy:70+Math.random()*50,gv:1100,r:1.4+Math.random()*1.4,c:'#ffd977',life:0.8}); }
      const surfY=(ml>0.05?lvlY(ml):inBot)-1;
      for(let i=streamPts.length-1;i>=0;i--){ const sp=streamPts[i]; sp.vy+=1500*dt; sp.y+=sp.vy*dt;
        if(sp.y>=surfY){ streamPts.splice(i,1); // 수면 도착 → 스플래시
          if(Math.random()<0.45) parts.push({x:sp.x+(Math.random()*8-4),y:surfY,vx:(Math.random()*2-1)*55,vy:-30-Math.random()*60,gv:520,r:1.4+Math.random()*1.5,c:'#ffd977',life:0.3}); } }
      if(streamPts.length){ const pts=streamPts.slice().sort((a,b)=>a.y-b.y);
        if(spout&&flow>0.35){ const tp=tip(); pts.unshift({x:tp.x,y:tp.y+2,vy:110,w:pts[0].w}); } // 아직 팁에 붙어있음
        pts.push({x:pts[pts.length-1].x,y:Math.min(surfY,pts[pts.length-1].y+pts[pts.length-1].vy*0.03),vy:pts[pts.length-1].vy,w:pts[pts.length-1].w});
        ctx.lineCap='round';
        for(let i=0;i<pts.length-1;i++){ const a2=pts[i], b2=pts[i+1];
          const ww=Math.max(0.8,((a2.w+b2.w)/2)*Math.sqrt(110/Math.max(110,(a2.vy+b2.vy)/2))); // 가속할수록 가늘게 (질량 보존)
          ctx.strokeStyle='#c87f1e'; ctx.lineWidth=ww+1.6; ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke();
          ctx.strokeStyle='#ffd977'; ctx.lineWidth=ww; ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke(); } }
      const bimg=FP.imgs.bottle;
      if(bimg){ const p=pose(); let off=0;
        if(pourIdx===0){ const be=Math.max(0,Math.min(1,(it-LOGO_T)/500)); off=(1-be)*(1-be)*160; }
        ctx.save(); ctx.translate(p.x+off,p.y); ctx.rotate(p.a+(hold?0:Math.sin(t/320)*0.02));
        ctx.drawImage(bimg,-GRIPX*BW,-GRIPY*BH,BW,BH); ctx.restore(); }
      for(let i=parts.length-1;i>=0;i--){ const pp=parts[i]; pp.life-=dt; if(pp.life<=0){ parts.splice(i,1); continue; }
        pp.vy+=pp.gv*dt; pp.x+=pp.vx*dt; pp.y+=pp.vy*dt;
        ctx.globalAlpha=Math.min(1,pp.life*2.5); ctx.fillStyle=pp.c; ctx.fillRect(pp.x-pp.r/2,pp.y-pp.r/2,pp.r,pp.r); }
      ctx.globalAlpha=1;
      // ── 첫 인트로: 로고 크게 → 병/잔 등장 ──
      if(pourIdx===0&&it<INTRO&&!stampObj){
        const lgi=FP.imgs.logo;

  const IC={ imgs:{}, loading:false, stages:null };

  function icSegment(){ // 5단계 시트를 알파 열 스캔으로 자동 분리
    const c=IC.imgs.ice, w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data;
    const colHas=new Uint8Array(w);

  function engShakeMaster(done){

    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('smStart');
    const TOTAL=13000;
    // 상태: title → ice(3프레임) → cap(2프레임+탁) → hold(안내) → cnt(3,2,1) → go → play → end
    let state='title', stT=0, count=0, wob=0, lastShakeT=0, playT0=0, finished=false, ended=false;
    let t0=0, lastT=0, raf=0, shake=0, sloshPh=0;

      for(let j=0;j<3;j++) parts.push({x:200+(Math.random()*80-40),y:250+(Math.random()*100-50),
        vx:(Math.random()*2-1)*160,vy:(Math.random()*2-1)*160,gv:500,r:1.6+Math.random()*1.8,c:['#bfe6ff','#fff','#dff1ff'][rnd(3)],life:0.35}); }
    let gotMotion=false, permMsg='';

    function draw(t){

      else if(state==='cap'&&el2>=900){ state='hold'; stT=t; beep(320,0.12,'square',0.12); shake=5; }
      else if(state==='hold'&&el2>=1700){ state='cnt'; stT=t; }

        setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,count+' SHAKES!',cls); },1600); }
      wob=Math.max(0,wob-dt*3.2); shake=Math.max(0,shake-dt*26); sloshPh+=dt*(6+wob*30);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.shake||FP.imgs.bg;

      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.fillRect(0,0,400,480);
      // 본체 이미지 선택
      let img=null, sq=0;

      else if(state==='cap'){ img=el2<350?SM.imgs.cap1:(el2<700?SM.imgs.cap2:SM.imgs.closed); if(el2>=700) sq=Math.sin(Math.PI*Math.min(1,(el2-700)/200))*0.08; }
      else if(state!=='title'){ img=SM.imgs.closed; }
      if(img){ const ih=250, iw=ih*(img.width/img.height);
        const ox=(state==='play'&&wob>0.02)?Math.sin(t/26)*24*wob:0;
        const oy=(state==='play'&&wob>0.02)?Math.sin(t/19)*10*wob:0;
        const rot=(state==='play'&&wob>0.02)?Math.sin(t/23)*0.38*wob:(state==='play'?Math.sin(t/300)*0.02:0);
        ctx.save(); ctx.translate(200+ox,290+oy); ctx.rotate(rot); ctx.scale(1+sq,1-sq);

      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }

        ctx.fillStyle='#000'; ctx.fillText('PRESS START TO ALLOW',201,363); ctx.fillText('THE MOTION SENSOR',201,383);
        ctx.fillStyle='#e8e6dd'; ctx.fillText('PRESS START TO ALLOW',200,362); ctx.fillText('THE MOTION SENSOR',200,382);
        if(permMsg){ ctx.font='8px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText(permMsg,201,411); ctx.fillStyle='#ff7a6a'; ctx.fillText(permMsg,200,410); } }
      if(state==='play'&&!gotMotion&&t-playT0>2500){ ctx.font='8px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('NO MOTION? CHECK SENSOR PERMISSION',201,411);
        ctx.fillStyle='#ff7a6a'; ctx.fillText('NO MOTION? CHECK SENSOR PERMISSION',200,410); }
      if(state==='hold'){ ctx.font='16px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('HOLD YOUR PHONE',203,133); ctx.fillText('WITH BOTH HANDS!',203,163);
        ctx.fillStyle='#ffd977'; ctx.fillText('HOLD YOUR PHONE',200,130); ctx.fillText('WITH BOTH HANDS!',200,160); }
      if(state==='cnt'){ const n=3-Math.floor(el2/600);
        ctx.font='64px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(String(n),205,145); ctx.fillStyle='#e8e6dd'; ctx.fillText(String(n),200,140); }
      if(state==='go'||(state==='play'&&t-playT0<900)){ ctx.font='17px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('SHAKE IT',203,113); ctx.fillText('LIKE CRAZY!!',203,143);
        ctx.fillStyle='#6fcf8f'; ctx.fillText('SHAKE IT',200,110); ctx.fillText('LIKE CRAZY!!',200,140); }
      if(state==='play'){ const secs=(left/1000).toFixed(1);
        ctx.font='26px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(String(count),204,68); ctx.fillStyle='#ffd977'; ctx.fillText(String(count),200,64);
        ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#8a8d82'; ctx.fillText('SHAKES',200,84);
        ctx.font='14px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(secs+'s',202,455); ctx.fillStyle=left<3500?'#d9544d':'#e8e6dd'; ctx.fillText(secs+'s',200,453);
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,462,280,6);
        ctx.fillStyle=left<3500?'#d9544d':'#3a7d4f'; ctx.fillRect(60,462,280*(left/TOTAL),6);

  /* ====================== STIR STOP ====================== */
  // 원을 그리며 저어라 — 저을수록 온도가 영하로 떨어진다. 목표 온도에 맞춰 SERVE! (멈추면 서서히 데워짐)
  const ST={ imgs:{}, loading:false };
  function stLoad(){ if(ST.loading) return; ST.loading=true;
    const srcs={ glass:['st_glass',420], ice1:['st_ice1',420], ice2:['st_ice2',420],
      top:['st_top',560], spoon:['st_spoon',560], logo:['st_logo',560,224,1] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ ST.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function engStirStop(done){
    fpLoad(); stLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="stServe">SERVE!</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('stServe');
    const CX=200, CY=272, GR=272, ARM=1100, TOTAL=22000;
    const target=-(15+rnd(26))/10; // -1.5 ~ -4.0
    let state='intro', stT=0, temp=20.0, omega=0, spoonA=Math.random()*6.28, liquidA=0, lastPtrA=null, dragging=false;
    let stampObj=null, stampT=0, t0=0, lastT=0, raf=0, shake=0, ended=false;
    const parts=[]; const noise=fpNoise();
    function ptrAngle(e){ const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width)-CX, y=(e.clientY-r.top)*(480/r.height)-CY;
      return Math.atan2(y,x); }
    function pdn(e){ e.preventDefault(); ac(); if(state!=='play') return; dragging=true; lastPtrA=ptrAngle(e); }
    function pmv(e){ if(e.cancelable)e.preventDefault(); if(!dragging||state!=='play') return;
      const a2=ptrAngle(e); if(lastPtrA!=null){ let d2=a2-lastPtrA;
        while(d2>Math.PI)d2-=6.283; while(d2<-Math.PI)d2+=6.283;
        omega=Math.max(-14,Math.min(14,omega+d2*4)); spoonA=a2; } lastPtrA=a2; } // 반대로 저으면 소용돌이가 상쇄되어 빨리 멈춤
    function pup(){ dragging=false; lastPtrA=null; }

    window.addEventListener('pointerup',pup);
    function judge(){ if(state!=='play'||stampObj) return;
      const diff=Math.abs(temp-target), el3=(lastT-stT)/1000; let base,txt,cls,quip;
      if(diff<=0.3){ base=114; txt='PERFECT!'; cls='perfect'; quip='Diamond-clear and ice cold'; }
      else if(diff<=0.8){ base=100-diff*20; txt='GOOD'; cls='good'; quip=temp>target?'A touch warm':'A touch overchilled'; }
      else if(diff<=1.8){ base=76-diff*14; txt=temp>target?'TOO WARM':'OVER-CHILLED'; cls='miss'; quip=temp>target?'The guest wanted it colder…':'Watered it down…'; }
      else { base=46-diff*8; txt=temp>target?'TOO WARM':'OVER-DILUTED!'; cls='miss'; quip=temp>target?'That is room temp, chief':'That is meltwater now'; }
      const sc=Math.max(0,Math.min(100,Math.round(base-Math.max(0,el3-5)*3.5))); // 빠를수록 고득점 (5초 이후 초당 -3.5)
      stampObj={txt,cls,quip,el3}; stampT=lastT;
      if(cls==='perfect'){ flash('#6fcf8f'); sGood(); setTimeout(()=>beep(1320,0.14,'square',0.12),140);
        for(let j=0;j<30;j++) parts.push({x:CX+(Math.random()*160-80),y:CY+(Math.random()*160-80),vx:(Math.random()*2-1)*120,vy:-60-Math.random()*120,gv:400,r:1.6+Math.random()*2,c:['#bfe6ff','#fff','#6fcf8f'][rnd(3)],life:0.6}); }
      else if(cls==='good') sGood(); else { sBad(); shake=8; }
      setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,txt,cls); },1500); }
    btn.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); judge(); });
    function cleanup(){ cancelAnimationFrame(raf); if(noise) noise.kill();
      window.removeEventListener('pointerup',pup); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM){ state='ice'; stT=t; beep(500,0.06,'square',0.1); }
      else if(state==='ice'&&el2>=1100){ state='play'; stT=t; beep(700,0.08,'square',0.1); }
      if(state==='play'&&!stampObj){
        const fr2=dragging?5:11; // 손을 떼면 소용돌이가 빨리 죽는다

        ctx.globalAlpha=Math.min(1,pp2.life*2.2); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }

      // 온도계 HUD

        if(state==='play'&&!stampObj){ const tl2=Math.max(0,1-(t-stT)/TOTAL);
          ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,84,280,6);
          ctx.fillStyle=tl2<0.25?'#d9544d':'#3a7d4f'; ctx.fillRect(60,84,280*tl2,6);
          const el4=((t-stT)/1000).toFixed(1); ctx.font='11px "Press Start 2P"'; ctx.textAlign='right';
          ctx.fillStyle='#000'; ctx.fillText(el4+'s',392,106); ctx.fillStyle='#ffd977'; ctx.fillText(el4+'s',390,104); } }
      if(state==='play'&&!stampObj&&t-stT<2600){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='center';

      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,400,480);
        const lgi=ST.imgs.logo; if(lgi){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=340*k, lh=lw*(lgi.height/lgi.width);

  /* ====================== FLY SWAT ====================== */
  // 과일 바구니에 꼬이는 파리들을 탭 사격으로 잡아라 — 인트로: 큰 파리가 윙윙 돌다 바구니에 앉는 순간 펑!
  const FS={ imgs:{}, loading:false };

    const srcs={ logo:['fs_logo',600,224,1], bigfly:['fs_bigfly',420], fly1:['fs_fly1',260], fly2:['fs_fly2',260],

    g.gain.value=0.0001; o.connect(g); g.connect(a.destination); o.start();
    const ret={ set:(on,f)=>{ if(window.__mute) on=false; const t=a.currentTime; g.gain.setTargetAtTime(on?0.035:0.0001,t,0.06); o.frequency.setTargetAtTime(f,t,0.05); },
      kill:()=>{ try{ o.stop(); }catch(e){} } };

  function engFlySwat(done){

    const cv=$('fpcv'), ctx=cv.getContext('2d');

    let state='cine', stT=0, pts=0, nextSpawn=0, finished=false, ended=false;
    let t0=0, lastT=0, raf=0, shake=0, crossT=-1e9, crossX=0, crossY=0, popped=false, fruitHP=100, hpStage=0;
    const flies=[], parts=[], pops=[]; const buzz=fsBuzz();
    function spawnFly(elapsed){ // 전부 날파리 (로고 파리는 인트로 전용)
      const side=rnd(4); let x,y;
      if(side===0){ x=-20; y=100+Math.random()*250; } else if(side===1){ x=420; y=100+Math.random()*250; }
      else if(side===2){ x=Math.random()*400; y=80; } else { x=Math.random()*400; y=470; }
      flies.push({x,y,vx:0,vy:0,tx:BX+(Math.random()*160-80),ty:290+(Math.random()*70-30),
        sit:0,sp:90+Math.random()*55,ph:Math.random()*6.28}); }

        if(d2<32&&d2<bd){ bd=d2; best=i; } }
      if(best>=0){ const f=flies[best]; flies.splice(best,1);
        pts++; sGood();
        pops.push({txt:'+1',x:f.x,y:f.y,t:now()});
        for(let j=0;j<10;j++) parts.push({x:f.x,y:f.y,vx:(Math.random()*2-1)*180,vy:(Math.random()*2-1)*180,

      else { for(let j=0;j<4;j++) parts.push({x,y,vx:(Math.random()*2-1)*60,vy:-30-Math.random()*50,gv:400,r:1.4+Math.random()*1.4,c:'#8a8d82',life:0.25}); } }

          for(let j=0;j<12;j++) parts.push({x:BX+(Math.random()*160-80),y:280+Math.random()*60,
            vx:(Math.random()*2-1)*50,vy:-30-Math.random()*50,gv:0,r:2+Math.random()*2,c:'#7a9c3a',life:0.7}); }
        if(fruitHP<=0&&left>600){ finished=true; if(buzz) buzz.set(false,100); flash('#d9544d'); sBad(); shake=10; // 시간 종료 직전엔 RUINED 대신 정상 종료
          const sc=Math.min(40,pts);
          setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,'FRUIT RUINED!','miss'); },1500); }
        else if(left<=0){ finished=true; if(buzz) buzz.set(false,100);
          const sc=Math.min(100,Math.round(pts*1.5)), cls=pts>=55?'perfect':(pts>=32?'good':'miss'); // 25초 기준
          setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,pts+' FLIES!',cls); },1500); } }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.flyswat||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.34)'; ctx.fillRect(0,0,400,480);
      // 바 상판 (바구니가 올려진 카운터)

      ctx.fillStyle=ct2; ctx.fillRect(0,376,400,20);
      ctx.fillStyle='#8a6a40'; ctx.fillRect(0,376,400,3);
      const cf3=ctx.createLinearGradient(0,396,0,480); cf3.addColorStop(0,'#3a2817'); cf3.addColorStop(1,'#1d1206');
      ctx.fillStyle=cf3; ctx.fillRect(0,396,400,84);

        ctx.moveTo(crossX,crossY-22); ctx.lineTo(crossX,crossY-8); ctx.moveTo(crossX,crossY+8); ctx.lineTo(crossX,crossY+22); ctx.stroke();

  /* ====================== ORDER UP! ====================== */
  // 손님들이 말풍선으로 부르는 칵테일 주문을 순서대로 기억해 포스기에 입력 — 4잔부터 시작, 틀릴 때까지 무한
  const OU={ imgs:{}, loading:false };
  const OU_MENU=['OLD FASHIONED','MARTINI','MARGARITA','MOJITO','HIGHBALL','NEGRONI','ESP. MARTINI','PINA COLADA','BLOODY MARY','WHISKY SOUR'];
  function ouLoad(){ if(OU.loading) return; OU.loading=true;
    const srcs={ pos:['ou_pos',560], logo:['ou_logo',560,224,1] };
    for(let i=0;i<10;i++) srcs['ck'+i]=['ou_ck'+i,240];
    for(let i=1;i<=8;i++) srcs['cu'+i]=['ou_cu'+i,340,198]; // 손님은 임계값 낮춰 흰 배경 잔재 제거
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ OU.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function engOrderUp(done){
    fpLoad(); ouLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const ARM=1400;
    // 포스 화면 영역 (ou_pos 이미지 비율)
    const PW=396, PX=2, PY=62, SFX0=0.118, SFX1=0.772, SFY0=0.262, SFY1=0.832;
    let state='intro', stT=0, round=1, seq=[], showIdx=0, input=[], cleared=0;
    let stampObj=null, stampT=0, wrongCk=-1, t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false;
    let best=parseInt(localStorage.getItem('pine_orderup_best')||'0')||0;
    const parts=[];
    function newRound(){ const n=3+round; seq=[]; for(let i=0;i<n;i++) seq.push(rnd(10));
      showIdx=0; input=[]; state='order'; stT=lastT;
      window.__ouSeq=seq.slice(); window.__ouRound=round; }
    function itemDur(){ return Math.max(650,1200-round*60); }
    function btnRect(i){ const sx0=PX+PW*SFX0+8, sx1=PX+PW*SFX1-8, sy0=PY+PW*SFY0+46, sy1=PY+PW*SFY1-8;
      const cw=(sx1-sx0)/5, chh=(sy1-sy0)/2;
      return { x:sx0+(i%5)*cw+3, y:sy0+Math.floor(i/5)*chh+3, w:cw-6, h:chh-6 }; }
    function tap(e){ e.preventDefault(); ac(); if(state!=='input'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      for(let i=0;i<10;i++){ const b=btnRect(i);
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          if(i===seq[input.length]){ input.push(i); sTap(); beep(880+input.length*40,0.05,'square',0.08);
            if(input.length>=seq.length){ cleared=round; state='clear'; stT=lastT; sGood(); flash('#6fcf8f');
              for(let j=0;j<20;j++) parts.push({x:200+(Math.random()*200-100),y:240+(Math.random()*160-80),vx:(Math.random()*2-1)*140,vy:-80-Math.random()*140,gv:500,r:2+Math.random()*2.5,c:['#6fcf8f','#ffd977','#fff'][rnd(3)],life:0.55}); } }
          else { wrongCk=seq[input.length]; state='fail'; stT=lastT; finished=true; sBad(); flash('#d9544d'); shake=10;
            if(cleared>best){ best=cleared; localStorage.setItem('pine_orderup_best',String(best)); }
            const sc=Math.min(100,cleared*25), cls=cleared>=4?'perfect':(cleared>=2?'good':'miss');
            setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,'ROUND '+round+' KO',cls); },3400); }
          return; } } }
    cv.addEventListener('pointerdown',tap);
    function cleanup(){ cancelAnimationFrame(raf); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM){ newRound(); }
      if(state==='order'){ const idx=Math.floor(el2/itemDur());
        if(idx!==showIdx&&idx<=seq.length){ showIdx=idx; if(idx<seq.length) beep(600+seq[idx]*30,0.06,'square',0.09); }
        if(el2>=itemDur()*seq.length+350){ state='input'; stT=t; beep(900,0.1,'square',0.1); } }
      if(state==='clear'&&el2>=1300){ round++; newRound(); }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.orderup||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.36)'; ctx.fillRect(0,0,400,480);
      // ── 주문 단계: 손님 + 말풍선 ──
      if(state==='order'&&showIdx<seq.length){
        const cust=OU.imgs['cu'+(1+(showIdx+round)%8)];
        const p2=Math.min(1,(el2-showIdx*itemDur())/240);
        if(cust){ const chh2=215, cw2=chh2*(cust.width/cust.height);

        // 말풍선
        const bx=22, by=180, bw2=215, bh2=140;
        ctx.save(); ctx.globalAlpha=Math.min(1,p2*1.4);
        ctx.fillStyle='#22262e'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.roundRect(bx,by,bw2,bh2,14); ctx.fill(); ctx.stroke();
