        const cg2=ctx.createLinearGradient(0,336,0,354); cg2.addColorStop(0,'#7a5a34'); cg2.addColorStop(1,'#4e3620');
        ctx.fillStyle=cg2; ctx.fillRect(0,336,400,18);
        ctx.fillStyle='#8a6a40'; ctx.fillRect(0,336,400,3);
        const cf2=ctx.createLinearGradient(0,354,0,444); cf2.addColorStop(0,'#3a2817'); cf2.addColorStop(1,'#221507');
        ctx.fillStyle=cf2; ctx.fillRect(0,354,400,90);
        ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
        for(let px=22;px<400;px+=72){ ctx.beginPath(); ctx.moveTo(px,358); ctx.lineTo(px,440); ctx.stroke(); } }
      if(state==='order'&&showIdx>=seq.length){ ctx.font='13px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('GOT ALL THAT?',202,232); ctx.fillStyle='#ffd977'; ctx.fillText('GOT ALL THAT?',200,230); }
      // ── 입력 단계: 포스기 ──
      if(state==='input'||state==='clear'||state==='fail'){
        const ps=OU.imgs.pos;
        const rise=state==='input'?eob2(Math.min(1,el2/350)):1;
        const py2=PY+(1-rise)*440;
        if(ps) ctx.drawImage(ps,PX,py2,PW,PW);
        if(rise>=0.99){
          // 진행 스트립 (입력한 잔들)
          const sx0=PX+PW*SFX0+8, sy0=PY+PW*SFY0+6;
          ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(sx0,sy0,PW*(SFX1-SFX0)-16,34);
          for(let i=0;i<seq.length;i++){ const ix=sx0+4+i*26;
            if(i<input.length){ const ck=OU.imgs['ck'+input[i]]; if(ck) ctx.drawImage(ck,ix,sy0+3,24,24); }
            else { ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(ix+7,sy0+13,10,4); } }
          // 칵테일 버튼 10개
          for(let i=0;i<10;i++){ const b=btnRect(i);
            ctx.fillStyle='#20242b'; ctx.fillRect(b.x,b.y,b.w,b.h);
            ctx.strokeStyle='#3a4150'; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,b.w,b.h);
            const ck=OU.imgs['ck'+i]; if(ck){ const cs=Math.min(b.w,b.h)-8;
              ctx.drawImage(ck,b.x+b.w/2-cs/2,b.y+b.h/2-cs/2,cs,cs); } } }
        ctx.font='10px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('PUNCH THE ORDER!',202,56); ctx.fillStyle='#e8e6dd'; ctx.fillText('PUNCH THE ORDER!',200,54); }
      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD
      if(state!=='intro'){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='left';
        ctx.fillStyle='#000'; ctx.fillText('ROUND '+round,14,30); ctx.fillStyle='#ffd977'; ctx.fillText('ROUND '+round,12,28);
        ctx.textAlign='right';
        ctx.fillStyle='#000'; ctx.fillText('BEST '+best,390,30); ctx.fillStyle='#8a8d82'; ctx.fillText('BEST '+best,388,28); }
      // 인트로
      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        const lg2=OU.imgs.logo; if(lg2){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=330*k, lh=lw*(lg2.height/lg2.width);
          ctx.drawImage(lg2,200-lw/2,210-lh/2,lw,lh); } }
      // 클리어/실패 스탬프
      if(state==='clear'){ ctx.save(); ctx.translate(200,120); ctx.rotate(-0.05);
        const k2=1+Math.max(0,1-el2/160)*1.3; ctx.scale(k2,k2);
        ctx.font='20px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('ROUND CLEAR!',3,3); ctx.fillStyle='#6fcf8f'; ctx.fillText('ROUND CLEAR!',0,0); ctx.restore(); }
      if(state==='fail'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,150); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-el2/180)*1.4; ctx.scale(k2,k2);
        ctx.font='19px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('WRONG ORDER!',3,3); ctx.fillStyle='#d9544d'; ctx.fillText('WRONG ORDER!',0,0); ctx.restore();
        // 전체 정답 시퀀스 공개: 맞춘 잔=초록, 틀린 지점=빨강, 나머지=회색
        ctx.font='9px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('THE FULL ORDER WAS:',202,197); ctx.fillStyle='#fff'; ctx.fillText('THE FULL ORDER WAS:',200,195);
        const nI=seq.length, cols=Math.min(5,nI), iS=46, gap=8;
        for(let i=0;i<nI;i++){ const cx2=200-(cols*(iS+gap)-gap)/2+(i%5)*(iS+gap);
          const cy2=208+Math.floor(i/5)*(iS+gap+6);
          const okd=i<input.length, missIdx=i===input.length;
          ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(cx2,cy2,iS,iS);
          ctx.strokeStyle=okd?'#6fcf8f':(missIdx?'#d9544d':'#555');
          ctx.lineWidth=missIdx?4:2; ctx.strokeRect(cx2,cy2,iS,iS);
          const ck2=OU.imgs['ck'+seq[i]]; if(ck2) ctx.drawImage(ck2,cx2+3,cy2+3,iS-6,iS-6); }
        const myY=208+Math.ceil(nI/5)*(iS+gap+6)+22;
        ctx.font='9px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('MISSED: '+OU_MENU[wrongCk],202,myY+2); ctx.fillStyle='#d9544d'; ctx.fillText('MISSED: '+OU_MENU[wrongCk],200,myY);
        ctx.font='12px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('ROUNDS CLEARED: '+cleared,202,myY+28); ctx.fillStyle='#ffd977'; ctx.fillText('ROUNDS CLEARED: '+cleared,200,myY+26); }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== WHERE IS MY SHOT? ====================== */
  // 야바위: 샷잔이 뚜껑에 숨고 섞인다 — 맞히면 다음 라운드(뚜껑 2→5개, 점점 빠름), 틀리면 끝
  const WS={ imgs:{}, loading:false };
  function wsLoad(){ if(WS.loading) return; WS.loading=true;
    const srcs={ cover:['ws_cover',420,185], shot:['ws_shot',260,185], logo:['ws_logo',560,224,1] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ WS.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function engWhereShot(done){
    fpLoad(); wsLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const CY=318, ARM=1300;
    let state='intro', stT=0, round=1, nCups=2, shotAt=0, picked=-1, cleared=0;
    let cups=[], swaps=[], swapI=0, swapT=0, swapDur=420, lift=0;
    let t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false;
    let best=parseInt(localStorage.getItem('pine_wis_best')||'0')||0;
    const parts=[];
    function cupX(slot,n){ const sp=Math.min(96,340/Math.max(1,n-1)); return 200+(slot-(n-1)/2)*sp; }
    function cupW(n){ return Math.min(96,340/Math.max(1,n-1))-6<74?68:88; }
    function newRound(){ nCups=Math.min(5,1+round); shotAt=rnd(nCups); picked=-1;
      cups=[]; for(let i=0;i<nCups;i++) cups.push({slot:i});
      const nSw=2+round*2; swaps=[]; swapDur=Math.max(170,460-round*55);
      for(let i=0;i<nSw;i++){ let a=rnd(nCups),b; do{ b=rnd(nCups); }while(b===a); swaps.push([a,b]); }
      swapI=0; state='place'; stT=lastT; lift=1; beep(520,0.08,'square',0.1); }
    function tap(e){ e.preventDefault(); ac(); if(state!=='pick'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      const cw2=cupW(nCups);
      for(let s=0;s<nCups;s++){ const cx2=cupX(s,nCups);
        if(Math.abs(x-cx2)<cw2/2+8&&y>CY-90&&y<CY+30){ picked=s; state='reveal'; stT=lastT;
          if(s===shotAt){ cleared=round; sGood(); flash('#6fcf8f');
            for(let j=0;j<16;j++) parts.push({x:cx2,y:CY-40,vx:(Math.random()*2-1)*130,vy:-70-Math.random()*130,gv:500,r:2+Math.random()*2.4,c:['#ffd977','#6fcf8f','#fff'][rnd(3)],life:0.5}); }
          else { finished=true; sBad(); flash('#d9544d'); shake=9;
            if(cleared>best){ best=cleared; localStorage.setItem('pine_wis_best',String(best)); }
            const sc=Math.min(100,cleared*22), cls=cleared>=4?'perfect':(cleared>=2?'good':'miss');
            setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,'ROUND '+round+' KO',cls); },2300); }
          return; } } }
    cv.addEventListener('pointerdown',tap);
    function cleanup(){ cancelAnimationFrame(raf); }
    function slotNow(i){ // 셔플 애니메이션 중 커버 i의 현재 x (슬롯 교환 보간)
      return cupX(cups[i].slot,nCups); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM) newRound();
      if(state==='place'&&el2>=2100){ state='shuffle'; stT=t; swapT=t; }
      if(state==='shuffle'){
        if(t-swapT>=swapDur){ const [a,b]=swaps[swapI]; // 슬롯 교환 확정
          for(const c of cups){ if(c.slot===a) c.slot=b; else if(c.slot===b) c.slot=a; }
          if(shotAt===a) shotAt=b; else if(shotAt===b) shotAt=a;
          swapI++; swapT=t; beep(280+rnd(60),0.04,'square',0.07);
          if(swapI>=swaps.length){ state='pick'; stT=t; beep(900,0.1,'square',0.1); } } }
      if(state==='reveal'&&picked===shotAt&&el2>=1400){ round++; newRound(); }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.whereshot||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.34)'; ctx.fillRect(0,0,400,480);
      // 카운터 상판
      const ct3=ctx.createLinearGradient(0,CY+8,0,CY+30); ct3.addColorStop(0,'#7a5a34'); ct3.addColorStop(1,'#4e3620');
      ctx.fillStyle=ct3; ctx.fillRect(0,CY+8,400,22);
      ctx.fillStyle='#8a6a40'; ctx.fillRect(0,CY+8,400,3);
      const cf4=ctx.createLinearGradient(0,CY+30,0,480); cf4.addColorStop(0,'#3a2817'); cf4.addColorStop(1,'#1a1005');
      ctx.fillStyle=cf4; ctx.fillRect(0,CY+30,400,480-CY-30);
      if(state!=='intro'){
        const cw2=cupW(nCups), sh2=WS.imgs.shot, cvr=WS.imgs.cover;
        // 샷잔 (배치/공개 때 보임)
        const showShot=state==='place'||(state==='reveal');
        if(sh2&&showShot){ const sx2=cupX(shotAt,nCups), ssz=cw2*0.62;
          ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#000';
          ctx.beginPath(); ctx.ellipse(sx2,CY+12,ssz*0.42,7,0,0,6.283); ctx.fill(); ctx.restore();
          ctx.drawImage(sh2,sx2-ssz/2,CY-ssz+12,ssz,ssz*(sh2.height/sh2.width)); }
        // 뚜껑들
        if(cvr){ for(let i=0;i<cups.length;i++){ const c=cups[i]; let cx2=cupX(c.slot,nCups), lY=0, sc3=1;
          // 셔플 이동 보간
          if(state==='shuffle'&&swapI<swaps.length){ const [a,b]=swaps[swapI]; const p2=Math.min(1,(t-swapT)/swapDur);
            const e2=0.5-0.5*Math.cos(p2*Math.PI);
            if(c.slot===a){ cx2=cupX(a,nCups)+(cupX(b,nCups)-cupX(a,nCups))*e2; lY=-Math.sin(p2*Math.PI)*13; }
            else if(c.slot===b){ cx2=cupX(b,nCups)+(cupX(a,nCups)-cupX(b,nCups))*e2; lY=Math.sin(p2*Math.PI)*10; } }
          // 배치 단계: 뚜껑이 내려와 덮음 / 공개: 선택 뚜껑(+정답 뚜껑) 들림
          if(state==='place'){ const p2=Math.min(1,Math.max(0,(el2-600)/500)); lY=-(1-eob2(p2))*140; } // 샷 먼저 보여주고 뚜껑이 내려와 덮음
          if(state==='reveal'){ const p2=Math.min(1,el2/300);
            if(c.slot===picked) lY=-eob2(p2)*95;
            if(finished&&c.slot===shotAt) lY=-eob2(Math.max(0,Math.min(1,(el2-350)/300)))*95; }
          if(state==='pick'){ lY=Math.sin(t/300+i)*2; }
          const ch2=cw2*(cvr.height/cvr.width);
          ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
          ctx.beginPath(); ctx.ellipse(cx2,CY+14,cw2*0.46,8,0,0,6.283); ctx.fill(); ctx.restore();
          ctx.drawImage(cvr,cx2-cw2/2,CY-ch2+16+lY,cw2,ch2); } } }
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD
      if(state!=='intro'){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='left';
        ctx.fillStyle='#000'; ctx.fillText('ROUND '+round,14,30); ctx.fillStyle='#ffd977'; ctx.fillText('ROUND '+round,12,28);
        ctx.textAlign='right';
        ctx.fillStyle='#000'; ctx.fillText('BEST '+best,390,30); ctx.fillStyle='#8a8d82'; ctx.fillText('BEST '+best,388,28);
        ctx.textAlign='center'; ctx.font='11px "Press Start 2P"';
        const msg=(state==='place'&&el2<1100)?'WATCH THE SHOT!':(state==='shuffle'?'FOLLOW IT!':(state==='pick'?'WHERE IS IT? TAP!':''));
        if(msg){ ctx.fillStyle='#000'; ctx.fillText(msg,202,142); ctx.fillStyle='#ffd977'; ctx.fillText(msg,200,140); }
        if(state==='place'&&el2>=1150){ const k2=1+Math.max(0,1-(el2-1150)/180)*1.4; // 뚜껑이 덮이면 FIND IT! 팝
          ctx.save(); ctx.translate(200,150); ctx.rotate(-0.05); ctx.scale(k2,k2);
          ctx.font='24px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText('FIND IT!',3,3); ctx.fillStyle='#ffd977'; ctx.fillText('FIND IT!',0,0); ctx.restore(); } }
      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        const lg2=WS.imgs.logo; if(lg2){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=330*k, lh=lw*(lg2.height/lg2.width);
          ctx.drawImage(lg2,200-lw/2,215-lh/2,lw,lh); } }
      if(state==='reveal'){ ctx.font='18px "Press Start 2P"'; ctx.textAlign='center';
        if(picked===shotAt){ ctx.save(); ctx.translate(200,180); ctx.rotate(-0.05);
          const k2=1+Math.max(0,1-el2/160)*1.3; ctx.scale(k2,k2);
          ctx.fillStyle='#000'; ctx.fillText('FOUND IT!',3,3); ctx.fillStyle='#6fcf8f'; ctx.fillText('FOUND IT!',0,0); ctx.restore(); }
        else { ctx.save(); ctx.translate(200,180); ctx.rotate(-0.06);
          const k2=1+Math.max(0,1-el2/180)*1.4; ctx.scale(k2,k2);
          ctx.fillStyle='#000'; ctx.fillText('NOT THERE!',3,3); ctx.fillStyle='#d9544d'; ctx.fillText('NOT THERE!',0,0); ctx.restore();
          ctx.font='12px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText('ROUNDS CLEARED: '+cleared,202,432); ctx.fillStyle='#ffd977'; ctx.fillText('ROUNDS CLEARED: '+cleared,200,430); } }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== FRESH SQUEEZE ====================== */
  // 라임을 가져와 썰고, 반쪽을 스퀴저에 넣고 눌러 짜서 계량컵을 채워라 — 30초, 라임 1개=50ml
  const SQ={ imgs:{}, loading:false };
  function sqLoad(){ if(SQ.loading) return; SQ.loading=true;
    const names=['basket','board','closed','cup','half','lime','logo','open','spent','trash'];
    names.forEach(k=>{ const im=new Image(); im.onload=()=>{ SQ.imgs[k]=fpKey(im,k==='logo'?560:400,185,k==='logo'); }; im.src='assets/sq_'+k+'.png'; }); }
  function engSqueeze(done){
    fpLoad(); sqLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const ARM=1300, TOTAL=30000;
    // 스테이션 좌표
    const BK={x:58,y:300}, BD={x:175,y:398}, SZ={x:292,y:186}, CUP={x:319,y:306}, TR={x:334,y:492}; // 도마=하단 식탁 위, 바구니=도마 왼쪽, 휴지통=하단에 머리 크게
    let state='intro', stT=0, phase='grab', halves=0, ml=0, shownMl=0, pressT=-1e9, cutT=-1e9;
    let flyObj=null; // {img,from,to,t,cb}
    let t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false, ptr=null;
    const parts=[];
    function fly(img,from,to,cb){ flyObj={img,fx:from.x,fy:from.y,tx:to.x,ty:to.y,t:now(),cb}; beep(500,0.05,'square',0.08); }
    let drag=null; // 드래그 중인 오브젝트 {kind,x,y}
    function dn(e){ e.preventDefault(); ac(); if(state!=='play'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      const near=(p,rad)=>Math.hypot(x-p.x,y-p.y)<rad;
      if(phase==='grab'&&near(BK,80)){ drag={kind:'lime',x,y}; beep(500,0.04,'square',0.07); return; }
      if(phase==='load'&&near(BD,90)){ drag={kind:'half',x,y}; beep(500,0.04,'square',0.07); return; }
      if(phase==='trash'&&near(SZ,100)){ drag={kind:'spent',x,y}; beep(400,0.04,'square',0.07); return; }
      ptr={x,y}; }
    function mv(e){ if(!drag) return; if(e.cancelable) e.preventDefault();
      const r=cv.getBoundingClientRect();
      drag.x=(e.clientX-r.left)*(400/r.width); drag.y=(e.clientY-r.top)*(480/r.height); }
    function up(e){ if(e&&e.cancelable) e.preventDefault();
      if(drag){ const d0=drag; drag=null;
        const near=(p,rad)=>Math.hypot(d0.x-p.x,d0.y-p.y)<rad;
        if(d0.kind==='lime'&&near(BD,90)){ phase='cut'; beep(720,0.06,'square',0.1); }
        else if(d0.kind==='half'&&near(SZ,105)){ phase='press'; beep(720,0.06,'square',0.1); }
        else if(d0.kind==='spent'&&near(TR,85)){ beep(220,0.06,'square',0.1);
          for(let j=0;j<6;j++) parts.push({x:TR.x,y:TR.y-30,vx:(Math.random()*2-1)*60,vy:-40-Math.random()*60,gv:500,r:1.6+Math.random()*1.6,c:'#8a8d82',life:0.35});
          halves--; phase=halves>0?'load':'grab'; }
        return; }
      if(!ptr||state!=='play'||finished){ ptr=null; return; }
      const r=cv.getBoundingClientRect();
      const ex=(e.clientX-r.left)*(400/r.width), ey=(e.clientY-r.top)*(480/r.height);
      const dx=ex-ptr.x, dy=ey-ptr.y, sx=ptr.x, sy=ptr.y; ptr=null;
      const near=(p,rad)=>Math.hypot(sx-p.x,sy-p.y)<rad||Math.hypot(ex-p.x,ey-p.y)<rad;
      if(phase==='cut'&&Math.abs(dx)>36&&near(BD,100)){ cutT=now(); halves=2; phase='load';
        beep(1200,0.05,'square',0.1); setTimeout(()=>beep(700,0.05,'square',0.08),60); shake=Math.max(shake,2.5);
        for(let j=0;j<8;j++) parts.push({x:BD.x,y:BD.y-20,vx:(Math.random()*2-1)*120,vy:-60-Math.random()*100,gv:600,r:1.5+Math.random()*1.8,c:['#cbe36a','#eef6d8'][rnd(2)],life:0.4}); }
      else if(phase==='press'&&dy>36&&near(SZ,115)){ pressT=now(); phase='pressing';
        beep(300,0.1,'sawtooth',0.1); shake=Math.max(shake,3);
        setTimeout(()=>{ if(finished) return; ml+=25; phase='trash'; sGood();
          for(let j=0;j<10;j++) parts.push({x:CUP.x+(Math.random()*24-12),y:CUP.y-46,vx:(Math.random()*2-1)*50,vy:-30-Math.random()*50,gv:400,r:1.5+Math.random()*1.5,c:'#cbe36a',life:0.4}); },420); } }
    cv.addEventListener('pointerdown',dn); cv.addEventListener('pointermove',mv);
    ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,up));
    function cleanup(){ cancelAnimationFrame(raf);
      ['pointerup','pointercancel'].forEach(ev=>window.removeEventListener(ev,up)); }
    function station(img,p,w,shadow){ const im=SQ.imgs[img]; if(!im) return;
      const h2=w*(im.height/im.width);
      if(shadow){ ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(p.x,p.y+h2*0.42,w*0.42,7,0,0,6.283); ctx.fill(); ctx.restore(); }
      ctx.drawImage(im,p.x-w/2,p.y-h2/2,w,h2); }
    function hintAt(p,txt,t){ const bl=Math.floor(t/300)%2===0;
      ctx.save(); ctx.strokeStyle=bl?'#ffd977':'rgba(255,217,119,0.4)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y-8,52+Math.sin(t/200)*4,0,6.283); ctx.stroke();
      ctx.font='9px "Press Start 2P"'; ctx.textAlign='center';
      const tx3=Math.max(84,Math.min(316,p.x)); // 화면 밖 잘림 방지
      ctx.fillStyle='#000'; ctx.fillText(txt,tx3+2,p.y-70); ctx.fillStyle='#ffd977'; ctx.fillText(txt,tx3,p.y-72); ctx.restore(); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM){ state='play'; stT=t; }
      const left=state==='play'?Math.max(0,TOTAL-(t-stT)):TOTAL;
      if(state==='play'&&left<=0&&!finished){ finished=true;
        const sc=Math.min(100,Math.round(ml/2)), cls=ml>=175?'perfect':(ml>=100?'good':'miss');
        setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,ml+'ml!',cls); },1500); }
      shownMl+=(ml-shownMl)*Math.min(1,dt*8);
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.squeeze||GB.imgs.tipcatch||FP.imgs.bg; // bg_squeeze.png 넣으면 자동 적용
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,400,480);
      if(state!=='intro'){
        // 스테이션
        station('basket',BK,110,true);
        station('board',BD,230,true); // 배경 아일랜드 식탁 위에 크게
        station(phase==='pressing'&&now()-pressT<420?'closed':'open',SZ,204,true);
        station('cup',CUP,96,true);
        station('trash',TR,190,false); // 하단에 뚜껑 머리만 보이게
        // 계량컵 즙 채움 (내부 영역)
        const cim=SQ.imgs.cup;
        if(cim){ const cw3=96, chh3=cw3*(cim.height/cim.width);
          const ix0=CUP.x-cw3/2+cw3*0.20, ix1=CUP.x-cw3/2+cw3*0.72;
          const iy1=CUP.y-chh3/2+chh3*0.86, iy0=CUP.y-chh3/2+chh3*0.28;
          const f=Math.min(1,shownMl/250), fy=iy1-(iy1-iy0)*f;
          ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.85;
          ctx.fillStyle='#b8d84e'; ctx.fillRect(ix0,fy,ix1-ix0,iy1-fy); ctx.restore();
          if(shownMl>2){ ctx.globalAlpha=0.7; ctx.fillStyle='#dcef8a';
            ctx.beginPath(); ctx.ellipse((ix0+ix1)/2,fy,(ix1-ix0)/2,2.5,0,0,6.283); ctx.fill(); ctx.globalAlpha=1; } }
        // 도마 위 라임/반쪽 (드래그 중인 것은 제외)
        if(phase==='cut') station('lime',{x:BD.x,y:BD.y-56},58,false);
        let bh3=0;
        if(phase==='load') bh3=halves-((drag&&drag.kind==='half')?1:0);
        else if(phase==='press'||phase==='pressing'||phase==='trash') bh3=halves-1;
        if(bh3>=1) station('half',{x:BD.x-24,y:BD.y-56},52,false);
        if(bh3>=2) station('half',{x:BD.x+26,y:BD.y-52},52,false);
        // 스퀴저 볼 안의 반쪽/찌꺼기 (볼은 이미지 오른쪽)
        if(phase==='press') station('half',{x:SZ.x+27,y:SZ.y+14},58,false);
        if(phase==='trash'&&!(drag&&drag.kind==='spent')) station('spent',{x:SZ.x+27,y:SZ.y+14},58,false);
        // 압착 즙: 스퀴저 볼 바로 아래 계량컵으로 수직 낙하
        if(phase==='pressing'&&now()-pressT<420){ ctx.strokeStyle='#cbe36a'; ctx.lineWidth=5; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(SZ.x+27,SZ.y+54); ctx.lineTo(SZ.x+27,CUP.y-36); ctx.stroke();
          if(Math.random()<0.8) parts.push({x:SZ.x+27+(Math.random()*8-4),y:SZ.y+58,vx:(Math.random()*2-1)*10,vy:120+Math.random()*60,gv:600,r:1.5+Math.random()*1.6,c:'#cbe36a',life:0.4}); }
        // 칼질 플래시
        if(now()-cutT<160){ ctx.strokeStyle='#fff'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.moveTo(BD.x-70,BD.y-82); ctx.lineTo(BD.x+70,BD.y-34); ctx.stroke(); }
        // 드래그 중인 오브젝트
        if(drag) station(drag.kind,{x:drag.x,y:drag.y-10},58,false);
        // 힌트
        if(state==='play'&&!finished&&!drag){
          if(phase==='grab') hintAt(BK,'DRAG TO BOARD!',t);
          else if(phase==='cut') hintAt(BD,'SLIDE = SLICE!',t);
          else if(phase==='load') hintAt(BD,'DRAG TO SQUEEZER!',t);
          else if(phase==='press') hintAt(SZ,'SLIDE DOWN!',t);
          else if(phase==='trash') hintAt({x:300,y:446},'DRAG TO TRASH!',t); }
      }
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD: ml 카운터 + 타이머
      if(state==='play'||finished){
        const cw4=200,chh4=54,cx4=200-cw4/2,cy4=10;
        ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(cx4,cy4,cw4,chh4);
        ctx.strokeStyle='#3a4150'; ctx.lineWidth=3; ctx.strokeRect(cx4,cy4,cw4,chh4);
        ctx.textAlign='center'; ctx.font='18px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(Math.round(shownMl)+'ml',202,cy4+30);
        ctx.fillStyle='#cbe36a'; ctx.fillText(Math.round(shownMl)+'ml',200,cy4+28);
        ctx.font='8px "Press Start 2P"'; ctx.fillStyle='#8a8d82'; ctx.fillText('FRESH LIME JUICE',200,cy4+44);
        const secs=(left/1000).toFixed(1);
        ctx.font='12px "Press Start 2P"'; ctx.textAlign='right';
        ctx.fillStyle='#000'; ctx.fillText(secs+'s',392,32); ctx.fillStyle=left<6000?'#d9544d':'#e8e6dd'; ctx.fillText(secs+'s',390,30);
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,72,280,6);
        ctx.fillStyle=left<6000?'#d9544d':'#3a7d4f'; ctx.fillRect(60,72,280*(left/TOTAL),6); }
      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        const lg2=SQ.imgs.logo; if(lg2){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=330*k, lh=lw*(lg2.height/lg2.width);
          ctx.drawImage(lg2,200-lw/2,215-lh/2,lw,lh); } }
      if(finished){ ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,400,480);
        ctx.font='20px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('TIME UP!',203,203); ctx.fillStyle='#e6b450'; ctx.fillText('TIME UP!',200,200);
        ctx.font='15px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(ml+'ml SQUEEZED!',202,243); ctx.fillStyle='#cbe36a'; ctx.fillText(ml+'ml SQUEEZED!',200,240); }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== 미니게임 목록 ====================== */
  const GAMES=[
    { name:'FREE POUR MASTER', cat:'HOLD', run:d=>engFreePour({},d) },
    { name:'BLIND POUR', cat:'HOLD', run:d=>engFreePour({blind:true},d) },
    { name:'STIR STOP', cat:'TIMING', run:d=>engStirStop(d) },
    { name:'ICE CARVING', cat:'MASH', run:d=>engIceCarve(d) },
    { name:'CHAMPAGNE LAUNCH', cat:'SPECIAL', run:d=>engChampagne(d) },
    { name:'SHAKE MASTER', cat:'SPECIAL', run:d=>engShakeMaster(d) },
    { name:'QUICK TAB', cat:'QUIZ', run:d=>engQuickTab(d) },
    { name:'ORDER UP!', cat:'MEMORY', run:d=>engOrderUp(d) },
    { name:'WHERE IS MY SHOT?', cat:'MEMORY', run:d=>engWhereShot(d) },
    { name:'FRESH SQUEEZE', cat:'MASH', run:d=>engSqueeze(d) },
    { name:'TIP CATCH', cat:'REFLEX', run:d=>engTipCatch(d) },
    { name:'FLY SWAT', cat:'REFLEX', run:d=>engFlySwat(d) },
  ];
  document.getElementById('subCount').textContent="BARTENDER'S MINIGAMES × "+GAMES.length;

  // 모바일 주소창 변동에도 화면이 항상 실제 보이는 높이에 꽉 차게 (인앱 브라우저는 늦게 안정화되므로 재측정)
  function fitVH(){ try{ $('wrap').style.height=window.innerHeight+'px'; }catch(e){} }
  window.addEventListener('resize',fitVH); window.addEventListener('orientationchange',fitVH);
  fitVH(); setTimeout(fitVH,400); setTimeout(fitVH,1500);
  // 프리로드: 타이틀/리스트 필수분만 즉시, 게임 에셋은 지연 워밍 (각 게임은 진입 시 자기 로더 호출)
  frLoad();
  setTimeout(()=>{ [...new Set(Object.values(GLOGO_PFX))].forEach(p=>loadLogo(p)); },1800); // 게임 로고 선로딩 (start 탭 즉시 표시)
  setTimeout(()=>{ fpLoad(); icLoad(); tcLoad(); },2500);
  setTimeout(()=>{ qtLoad(); clLoad(); smLoad(); },6500);
  setTimeout(()=>{ stLoad(); fsLoad(); ouLoad(); wsLoad(); sqLoad(); },11000);
  // 타이틀 로고: 키잉 + 글자 안 갇힌 흰 구멍(C 내부, R-T 사이 등)까지 전역 제거
  (function(){ const L=new Image(); L.onload=()=>{ try{ const c=fpKeyUI(L,720);
      const g2=c.getContext('2d'); const dd=g2.getImageData(0,0,c.width,c.height); const p2=dd.data;
      for(let i=0;i<p2.length;i+=4){ if(p2[i+3]>0&&p2[i]>243&&p2[i+1]>243&&p2[i+2]>243) p2[i+3]=0; }
      g2.putImageData(dd,0,0);
      const el=$('titleLogo'); el.src=c.toDataURL(); el.style.display='block';
      const h=$('titleH1'); if(h) h.style.display='none'; }catch(e){} }; L.src='assets/bp_title_logo.png';
    // 게임 선택 화면 타이틀(투명 재작업본 그대로) / 리본(흰 배경이라 키잉)
    { const T=new Image(); T.onload=()=>{ const el=$('pickTitle'); el.src='assets/pick_title.png';
        el.style.display='block'; $('pickTitleTxt').style.display='none'; }; T.src='assets/pick_title.png'; }
    { const P2=new Image(); P2.onload=()=>{ try{ const c=fpKeyUI(P2,640);
        const el=$('pickSub'); el.src=c.toDataURL(); el.style.display='block';
        $('pickSubTxt').style.display='none'; }catch(e){} }; P2.src='assets/pick_sub.png'; }
    // 버튼 이미지 (키잉 후 텍스트 버튼과 교체)
    [['bp_btn_start','startImg','startBtn'],['bp_btn_rank','rankImg','rankBtn'],['bp_btn_set','setImg','setBtn']].forEach(([src,imgId,btnId])=>{
      const B=new Image(); B.onload=()=>{ try{ const c=fpKeyUI(B,560);
        const el=$(imgId); el.src=c.toDataURL(); el.style.display='block';
        $(btnId).style.display='none';
        el.addEventListener('pointerdown',e=>{ e.preventDefault(); $(btnId).onclick(); }); }catch(e){} };
      B.src='assets/'+src+'.png'; });
    // 장식 스트립: 아이템별로 쪼개서 타이틀에서 통통 튀는 물리 데코
    const D=new Image(); D.onload=()=>{ try{
      const key=fpKeyUI(D,900); const w=key.width,h=key.height;
      const d=key.getContext('2d').getImageData(0,0,w,h).data;
      const colHas=new Uint8Array(w);
      for(let cx=0;cx<w;cx++){ for(let cy=0;cy<h;cy++){ if(d[(cy*w+cx)*4+3]>30){ colHas[cx]=1; break; } } }
      const runs=[]; let s=-1;
      for(let cx=0;cx<=w;cx++){ const on=cx<w&&colHas[cx]; if(on&&s<0)s=cx; else if(!on&&s>=0){ if(cx-s>10) runs.push([s,cx]); s=-1; } }
      const sprites=runs.map(rr=>{ let top=h-1,bot=0;
        for(let cy=0;cy<h;cy++){ for(let cx=rr[0];cx<rr[1];cx++){ if(d[(cy*w+cx)*4+3]>30){ if(cy<top)top=cy; if(cy>bot)bot=cy; break; } } }
        const c2=document.createElement('canvas'); c2.width=rr[1]-rr[0]; c2.height=Math.max(1,bot-top+1);
        c2.getContext('2d').drawImage(key,rr[0],top,c2.width,c2.height,0,0,c2.width,c2.height); return c2; });
      startDeco(sprites); }catch(e){} }; D.src='assets/bp_title_deco.png'; })();
  function startDeco(sprites){ const dcv=$('decoCv'); if(!dcv||!sprites.length) return;
    const ctx2=dcv.getContext('2d');
    function fit(){ dcv.width=dcv.clientWidth||360; dcv.height=dcv.clientHeight||600; } fit();
    window.addEventListener('resize',fit);
    const items=sprites.map((sp,i)=>({sp, x:40+Math.random()*(dcv.width-80), y:-80-i*110,
      vx:(Math.random()*2-1)*70, vy:0, rot:(Math.random()*2-1)*0.4, rv:(Math.random()*2-1)*2.5}));
    let last=performance.now();
    (function loop(t){ requestAnimationFrame(loop);
      if($('title').classList.contains('hidden')){ last=t; return; }
      const dt=Math.min(0.05,(t-last)/1000); last=t;
      const W=dcv.width,H=dcv.height; ctx2.clearRect(0,0,W,H);
      const cap=Math.max(26,Math.min(W,H)*0.10); // 데코 크기: 화면 짧은 변의 10% 이내 (폰 비율 유지)
      for(const o of items){ const kk=Math.min(cap/o.sp.height,cap/o.sp.width), hw=o.sp.width*kk/2, hh=o.sp.height*kk/2;
        o.vy+=760*dt; o.x+=o.vx*dt; o.y+=o.vy*dt; o.rot+=o.rv*dt;
        if(o.y>H-hh){ o.y=H-hh; o.vy=-Math.abs(o.vy)*0.82-60-Math.random()*90; o.vx+=(Math.random()*2-1)*70; o.rv=(Math.random()*2-1)*3; }
        if(o.x<hw){ o.x=hw; o.vx=Math.abs(o.vx); } if(o.x>W-hw){ o.x=W-hw; o.vx=-Math.abs(o.vx); }
        ctx2.save(); ctx2.translate(o.x,o.y); ctx2.rotate(o.rot);
        ctx2.drawImage(o.sp,-hw,-hh,hw*2,46); ctx2.restore(); } })(performance.now()); }
  show('title');
})();
