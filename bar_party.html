<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PINE BAR PARTY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{ --bg:#0d0f0c; --panel:#161a14; --pine:#3a7d4f; --pine-light:#6fcf8f; --amber:#e6b450; --red:#d9544d; --ink:#e8e6dd; --dim:#8a8d82; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family:'Press Start 2P', monospace; color:var(--ink); display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; background:radial-gradient(120% 90% at 50% -10%, #1a2016 0%, #0d0f0c 60%); }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:560px; max-height:100vh; margin:0 auto; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:56px 16px 22px; text-align:center; }
  .hidden{ display:none !important; }
  .kr{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; }
  h1{ font-size:clamp(20px,6.6vw,32px); color:var(--amber); line-height:1.3; text-shadow:3px 3px 0 #000; letter-spacing:1px; }
  h1 .sub{ display:block; font-size:.4em; color:var(--pine-light); margin-top:8px; letter-spacing:2px; }
  p.desc{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:clamp(12px,3.4vw,15px); color:var(--dim); line-height:1.6; max-width:420px; }
  .btn{ font-family:'Press Start 2P',monospace; font-size:clamp(11px,3vw,15px); color:#0d140a; background:var(--pine-light);
    border:3px solid #000; box-shadow:0 5px 0 #000; padding:14px 26px; cursor:pointer; letter-spacing:1px; transition:transform .06s,box-shadow .06s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .btn.amber{ background:var(--amber); } .btn.ghost{ background:var(--panel); color:var(--ink); border-color:var(--pine); }
  .pcount{ display:flex; gap:10px; }
  .pbtn{ font-family:'Press Start 2P',monospace; width:56px; height:56px; font-size:18px; color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; cursor:pointer; }
  .pbtn.sel{ color:#0d140a; background:var(--amber); border-color:#000; }
  .best{ font-size:11px; color:var(--dim); } .brand{ font-size:9px; letter-spacing:2px; color:var(--dim); }
  #hud{ position:absolute; top:0; left:0; right:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; z-index:5; pointer-events:none; }
  #hud .who{ color:var(--pine-light); font-size:12px; } #hud .rd{ color:var(--dim); font-size:10px; } #hud .sc{ color:var(--amber); font-size:15px; text-shadow:2px 2px 0 #000; }
  .mgtitle{ font-size:clamp(15px,4.6vw,22px); color:var(--amber); text-shadow:2px 2px 0 #000; }
  .mghint{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:13px; color:var(--dim); max-width:420px; line-height:1.5; }
  #stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; width:100%; }
  .bigbtn{ width:min(330px,86vw); height:74px; font-size:15px; }
  .bignum{ font-size:22px; color:var(--amber); text-shadow:2px 2px 0 #000; }
  /* 타이밍 */
  .tbar{ position:relative; width:min(360px,90vw); height:34px; background:#000; border:3px solid #333; overflow:hidden; }
  .tzone{ position:absolute; top:0; bottom:0; background:rgba(111,207,143,.5); border-left:2px solid var(--pine-light); border-right:2px solid var(--pine-light); }
  .tmark{ position:absolute; top:-4px; bottom:-4px; width:5px; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  /* 잔 */
  .glass{ position:relative; width:128px; height:190px; border:5px solid #d9e6dd; border-top:none; border-radius:0 0 26px 26px; background:rgba(255,255,255,.04); overflow:hidden; box-shadow:0 6px 0 rgba(0,0,0,.4); }
  .gfill{ position:absolute; left:0; right:0; bottom:0; height:0%; } .gfill::after{ content:''; position:absolute; top:0; left:0; right:0; height:7px; background:rgba(255,255,255,.5); }
  .gline{ position:absolute; left:-8px; right:-8px; border-top:3px dashed var(--pine-light); } .gline .lbl{ position:absolute; right:0; top:-16px; font-size:9px; color:var(--pine-light); }
  .gband{ position:absolute; left:0; right:0; background:rgba(111,207,143,.16); }
  /* 연타 */
  .mashimg{ width:118px; height:150px; object-fit:contain; image-rendering:pixelated; transition:transform .05s; } .mashemoji{ font-size:96px; transition:transform .05s; }
  .meter{ width:min(320px,84vw); height:22px; background:#000; border:3px solid #333; overflow:hidden; } .meter i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--pine),var(--amber)); }
  /* 리듬 */
  .beatdot{ width:96px; height:96px; border-radius:50%; background:var(--panel); border:5px solid #2a3a2a; transition:transform .08s, background .08s, border-color .08s; }
  .beatdot.pulse{ transform:scale(1.35); background:var(--pine-light); border-color:#fff; }
  /* 타이머 */
  .timebar{ width:min(340px,86vw); height:12px; background:#000; border:2px solid #333; overflow:hidden; } .timebar i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--pine-light),var(--amber)); }
  /* 문제 */
  .qwrap{ width:150px; height:150px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:3px solid #2a3a2a; box-shadow:0 5px 0 #000; } .qwrap img{ width:78%; height:78%; object-fit:contain; image-rendering:pixelated; }
  .qicons{ display:flex; gap:10px; } .qicons img{ width:clamp(44px,13vw,58px); height:clamp(44px,13vw,58px); object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:4px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(400px,92vw); }
  .opt{ font-family:'Press Start 2P',monospace; font-size:clamp(8px,2.4vw,11px); color:var(--ink); background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:14px 6px; cursor:pointer; min-height:52px; line-height:1.35; }
  .opt:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .opt.right{ background:var(--pine-light); color:#0d140a; border-color:#000; } .opt.wrong{ background:var(--red); color:#fff; border-color:#000; }
  .igrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(360px,90vw); }
  .icell{ background:var(--panel); border:3px solid #333; box-shadow:0 4px 0 #000; padding:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; aspect-ratio:1; }
  .icell:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; } .icell img{ width:80%; height:80%; object-fit:contain; image-rendering:pixelated; }
  .icell.right{ border-color:var(--pine-light); box-shadow:0 0 12px var(--pine-light),0 4px 0 #000; } .icell.wrong{ border-color:var(--red); }
  .seqrow{ display:flex; gap:12px; align-items:center; min-height:70px; } .seqrow img{ width:56px; height:56px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border:2px solid #2a3a2a; padding:5px; } .seqrow .num{ font-size:11px; color:var(--amber); }
  .padgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(340px,90vw); }
  .prog{ display:flex; gap:6px; } .prog b{ width:12px; height:12px; border:2px solid #333; background:#000; } .prog b.on{ background:var(--pine-light); }
  .rfield{ position:relative; width:min(360px,92vw); height:min(300px,44vh); background:var(--panel); border:3px solid #2a3a2a; overflow:hidden; }
  .rtarget{ position:absolute; width:56px; height:56px; object-fit:contain; image-rendering:pixelated; cursor:pointer; animation:pop .12s; } @keyframes pop{ from{ transform:scale(.4); } to{ transform:scale(1); } }
  .rate{ font-size:clamp(20px,6.4vw,36px); text-shadow:3px 3px 0 #000; } .rate.perfect{ color:var(--pine-light); } .rate.good{ color:var(--amber); } .rate.miss{ color:var(--red); }
  .addscore{ font-size:16px; color:var(--amber); }
  .rank{ font-family:-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif; width:min(400px,92vw); }
  .rrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin:6px 0; border:2px solid #2a3a2a; background:var(--panel); }
  .rrow.win{ border-color:var(--amber); background:rgba(230,180,80,.14); box-shadow:0 0 12px rgba(230,180,80,.4); }
  .rrow .nm{ font-weight:700; } .rrow .pt{ color:var(--amber); font-variant-numeric:tabular-nums; font-weight:800; } .crown{ font-size:20px; }
  /* 샌드박스 */
  #sandbox{ justify-content:flex-start; }
  .sbwrap{ width:min(440px,94vw); max-height:72vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px; }
  .sbtn{ font-family:'Press Start 2P',monospace; font-size:9px; line-height:1.3; color:var(--ink); background:var(--panel); border:2px solid #333; box-shadow:0 3px 0 #000; padding:12px 6px; cursor:pointer; text-align:center; }
  .sbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #000; } .sbtn .cat{ display:block; font-size:7px; color:var(--pine-light); margin-bottom:5px; letter-spacing:1px; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9; }
  /* 프리푸어 마스터 */
  #fpcv{ height:min(46vh,460px); max-width:92vw; border:3px solid #000; box-shadow:0 6px 0 rgba(0,0,0,.45); background:#000; touch-action:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden"><div><div class="who" id="hudWho">PLAYER 1</div><div class="rd" id="hudRd">ROUND 1/5</div></div><div class="sc" id="hudSc">0</div></div>
  <div class="flash" id="flash"></div>

  <div id="title" class="screen">
    <div class="brand">PINE &amp; CO · PARTY</div>
    <h1>BAR<br>PARTY<span class="sub" id="subCount">바텐더 미니게임</span></h1>
    <p class="desc">따르고 · 맞히고 · 흔들고 · 던져라.<br>번갈아 플레이하고 <b>최고 점수</b>를 가려라.</p>
    <div class="kr" style="font-size:11px;color:var(--dim)">인원 수</div>
    <div class="pcount" id="pcount"></div>
    <button class="btn amber" id="startBtn">START</button>
    <button class="btn" id="fpChalBtn">🥃 POUR CHALLENGE</button>
    <button class="btn ghost" id="sandboxBtn">🎮 SANDBOX 체험</button>
    <div class="best">BEST · <b id="bestVal">0</b> &nbsp;·&nbsp; POUR · <b id="fpBestVal">—</b></div>
  </div>

  <div id="sandbox" class="screen hidden">
    <div class="mgtitle">🎮 SANDBOX</div>
    <div class="mghint">해보고 싶은 미니게임을 골라라</div>
    <div class="sbwrap" id="sbwrap"></div>
    <button class="btn ghost" id="sbBack">← HOME</button>
  </div>

  <div id="turn" class="screen hidden">
    <div class="mgtitle" id="turnWho">PLAYER 1</div>
    <p class="desc" id="turnMsg">준비되면 눌러라</p>
    <button class="btn" id="turnBtn">READY!</button>
  </div>

  <div id="game" class="screen hidden"><div id="stage"></div></div>

  <div id="roundResult" class="screen hidden"><div class="rate" id="rrRate">GOOD</div><div class="addscore" id="rrAdd">+72</div></div>

  <div id="final" class="screen hidden">
    <h1 style="font-size:clamp(16px,5vw,26px)">RESULTS</h1>
    <div class="rank" id="rankList"></div>
    <button class="btn amber" id="againBtn">PLAY AGAIN</button>
    <button class="btn ghost" id="homeBtn">HOME</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage');
  function show(id){ ['title','sandbox','turn','game','roundResult','final'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }
  const rnd=n=>Math.floor(Math.random()*n);
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const sample=(arr,n)=>shuffle([...arr]).slice(0,n);
  const now=()=>performance.now();

  let AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function beep(f,d,t,v){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=t||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(v||0.14,a.currentTime+0.006); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.12));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }catch(e){} }
  const sGood=()=>{beep(660,0.09);setTimeout(()=>beep(990,0.12),70);};
  const sBad=()=>beep(150,0.22,'sawtooth');
  const sTap=()=>beep(300+Math.random()*140,0.04,'square',0.09);
  function flash(c){ const f=$('flash'); f.style.transition='none'; f.style.background=c||'#fff'; f.style.opacity='0.65'; requestAnimationFrame(()=>{ f.style.transition='opacity .3s'; f.style.opacity='0'; }); }

  // 데이터
  const COCKTAILS={ gintonic:'GIN TONIC', margarita:'MARGARITA', whiskysour:'WHISKY SOUR', bloodymary:'BLOODY MARY', negroni:'NEGRONI',
    espressomartini:'ESPRESSO MARTINI', mojito:'MOJITO', cosmopolitan:'COSMOPOLITAN', manhattan:'MANHATTAN', oldfashioned:'OLD FASHIONED',
    moscowmule:'MOSCOW MULE', vodkatonic:'VODKA TONIC', sidecar:'SIDECAR', southside:'SOUTHSIDE', drymartini:'DRY MARTINI',
    highball:'HIGHBALL', vodkacranberry:'VODKA CRANBERRY', corpsereviver:'CORPSE REVIVER', gimlet:'GIMLET', vodkamartini:'VODKA MARTINI' };
  const CK=Object.keys(COCKTAILS);
  const SPIRITS={ gin:'GIN', vodka:'VODKA', whiskey:'WHISKEY', rum:'RUM', tequila:'TEQUILA', brandy:'BRANDY' };
  const SP=Object.keys(SPIRITS);
  const ING={ lime:'LIME', lemon:'LEMON', mint:'MINT', olive:'OLIVE', orange:'ORANGE', tomato:'TOMATO', coffee:'COFFEE', sugar:'SUGAR',
    soda:'SODA', tonic:'TONIC', gingerbeer:'GINGER BEER', campari:'CAMPARI', angostura:'ANGOSTURA', cointreau:'COINTREAU', absinthe:'ABSINTHE',
    syrup:'SYRUP', dryver:'DRY VERMOUTH', sweetver:'SWEET VERMOUTH', agave:'AGAVE' };
  const IK=Object.keys(ING);
  const RECIPES={ mojito:['mint','lime','soda'], moscowmule:['gingerbeer','lime'], espressomartini:['coffee','sugar'], negroni:['campari','sweetver','orange'],
    gintonic:['tonic','lime'], bloodymary:['tomato','lemon'], oldfashioned:['angostura','sugar','orange'], drymartini:['olive','dryver'],
    corpsereviver:['absinthe','cointreau','lemon'], whiskysour:['lemon','sugar'], sidecar:['cointreau','lemon'], margarita:['agave','lime','cointreau'] };
  const RK=Object.keys(RECIPES);
  const GARNISH={ drymartini:'OLIVE', vodkamartini:'OLIVE', mojito:'MINT', southside:'MINT', moscowmule:'LIME', gintonic:'LIME', margarita:'LIME',
    gimlet:'LIME', cosmopolitan:'LIME', negroni:'ORANGE', oldfashioned:'ORANGE', manhattan:'CHERRY', whiskysour:'CHERRY', bloodymary:'CELERY', sidecar:'LEMON' };
  const GK=Object.keys(GARNISH); const GARNISH_SET=['OLIVE','MINT','LIME','LEMON','ORANGE','CHERRY','CELERY'];
  const POUR_COLORS=['#ffe08a','#e6a94a','#ff8a3c','#c96b5a','#8fe0a0','#ff6a5a','#bfe6ff','#ff8ab0','#d9a441'];
  const gr=c=>'linear-gradient('+c+',#a86a2a)';

  let players=[], cur=0, round=0, ROUNDS=5, best=parseInt(localStorage.getItem('pine_barparty_best')||'0')||0, lastGame=-1, mode='party';
  $('bestVal').textContent=best.toLocaleString();

  let pn=2;
  (function(){ const box=$('pcount'); for(let i=1;i<=4;i++){ const b=document.createElement('button'); b.className='pbtn'+(i===2?' sel':''); b.textContent=i;
    b.onclick=()=>{ pn=i; ac(); beep(500,0.05); [...box.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); }; box.appendChild(b); } })();

  $('startBtn').onclick=()=>{ ac(); beep(700,0.1); mode='party'; players=[]; for(let i=0;i<pn;i++) players.push({name:'PLAYER '+(i+1),score:0}); cur=0; startTurn(); };
  function startTurn(){ round=0; const p=players[cur]; $('turnWho').textContent=p.name; $('turnMsg').textContent=(players.length>1?'폰을 넘겨받았으면 눌러라':'준비되면 눌러라'); show('turn'); $('hud').classList.add('hidden'); }
  $('turnBtn').onclick=()=>{ beep(700,0.1); if(mode==='fp') fpNext(); else nextRound(); };
  function hud(){ const p=players[cur]; $('hudWho').textContent=p.name; $('hudRd').textContent='ROUND '+(round+1)+'/'+ROUNDS; $('hudSc').textContent=p.score; $('hud').classList.remove('hidden'); }
  function nextRound(){ if(round>=ROUNDS){ endTurn(); return; } hud(); let g; do{ g=rnd(GAMES.length); }while(GAMES.length>1 && g===lastGame); lastGame=g;
    show('game'); stage.innerHTML=''; let done=false; GAMES[g].run(function(s,t,c){ if(done) return; done=true; award(Math.round(s),t,c); }); }
  function award(score, rateTxt, rateCls){ score=Math.max(0,Math.min(100,score)); players[cur].score+=score; $('hudSc').textContent=players[cur].score;
    $('rrRate').textContent=rateTxt; $('rrRate').className='rate '+rateCls; $('rrAdd').textContent='+'+score; show('roundResult');
    if(rateCls==='miss') sBad(); else sGood(); setTimeout(()=>{ round++; nextRound(); }, 1000); }
  function endTurn(){ $('hud').classList.add('hidden'); cur++; if(cur<players.length) startTurn(); else showFinal(); }
  function showFinal(){ const ranked=[...players].map(p=>({...p})).sort((a,b)=>b.score-a.score); const top=ranked[0].score;
    if(top>best){ best=top; localStorage.setItem('pine_barparty_best',String(best)); $('bestVal').textContent=best.toLocaleString(); }
    const list=$('rankList'); list.innerHTML=''; ranked.forEach((p,i)=>{ const row=document.createElement('div'); row.className='rrow'+(i===0?' win':'');
      row.innerHTML='<span class="nm">'+(i===0?'<span class="crown">👑</span> ':'#'+(i+1)+' ')+p.name+'</span><span class="pt">'+p.score.toLocaleString()+'</span>'; list.appendChild(row); });
    show('final'); sGood(); flash('#e6b450'); }
  $('againBtn').onclick=()=>{ beep(700,0.1); if(mode==='fp'){ startFpChallenge(); return; } players.forEach(p=>p.score=0); cur=0; startTurn(); };
  $('homeBtn').onclick=()=>{ beep(500,0.08); show('title'); };

  // 샌드박스
  $('sandboxBtn').onclick=()=>{ ac(); beep(600,0.08); buildSandbox(); show('sandbox'); };
  $('sbBack').onclick=()=>{ beep(500,0.08); show('title'); };
  function buildSandbox(){ const w=$('sbwrap'); w.innerHTML=''; GAMES.forEach((g,i)=>{ const b=document.createElement('button'); b.className='sbtn'; b.innerHTML='<span class="cat">'+g.cat+'</span>'+g.name;
    b.onclick=()=>{ ac(); beep(660,0.08); playSandbox(i); }; w.appendChild(b); }); }
  function playSandbox(i){ $('hud').classList.add('hidden'); show('game'); stage.innerHTML=''; let done=false;
    GAMES[i].run(function(s,t,c){ if(done) return; done=true; $('rrRate').textContent=t; $('rrRate').className='rate '+c; $('rrAdd').textContent='SCORE '+Math.round(s); show('roundResult');
      if(c==='miss') sBad(); else sGood(); setTimeout(()=>{ buildSandbox(); show('sandbox'); }, 1200); }); }

  /* ====================== 엔진 ====================== */
  function engTiming(cfg, done){
    stage.innerHTML='<div class="mgtitle">'+cfg.title+'</div><div class="mghint">'+cfg.hint+'</div><div class="tbar" id="tbar"><div class="tzone" id="tz"></div><div class="tmark" id="tm"></div></div><button class="btn amber bigbtn" id="tstop">STOP!</button>';
    const bar=$('tbar'); const W=bar.clientWidth||330; const zw=Math.round(W*cfg.zone); const zx=Math.round(16+Math.random()*Math.max(1,(W-32-zw)));
    $('tz').style.left=zx+'px'; $('tz').style.width=zw+'px'; const tm=$('tm'); let x=0,dir=1,raf,settled=false; const spd=cfg.speed*(W/300);
    function loop(){ if(settled) return; x+=dir*spd; if(x<=0){x=0;dir=1;} if(x>=W-5){x=W-5;dir=-1;} tm.style.left=x+'px'; raf=requestAnimationFrame(loop); }
    function stop(e){ if(e)e.preventDefault(); if(settled) return; settled=true; cancelAnimationFrame(raf); const c=x+2.5, center=zx+zw/2, d=Math.abs(c-center);
      let sc,txt,cls; if(c>=zx && c<=zx+zw){ sc=Math.round(100-(d/(zw/2))*22); if(sc>=96){txt='PERFECT!';cls='perfect';flash('#6fcf8f');}else{txt='NICE';cls='good';} }
      else { sc=Math.max(0,Math.round(50-(d-zw/2)*0.5)); txt='MISS'; cls='miss'; } done(sc,txt,cls); }

          if(sk){ const rw2=RH*(sk.width/sk.height); ctx.drawImage(sk,runnerX-rw2/2,GY-RH,rw2,RH); } } }
      // 코르크 (실제 포물선 + 카메라 추적)
      if(state==='fly'||state==='rest'){ const ck=CL.imgs.cork;
        const sx2=RX+(ckX-cam), sy2=GY-(GY-ckY)*VSQ;
        // 원근: 발사 직후 살짝 커졌다가 멀어질수록 작아진다

        const csz=28*(p3<0.15?1+(p3/0.15)*0.45:1.45-((p3-0.15)/0.85)*0.9);
        if(sy2<-6){ ctx.fillStyle='#ffd977'; ctx.beginPath(); // 화면 위로 넘어가면 상단 마커

          ctx.drawImage(ck,-csz/2,-csz/2,csz,csz); ctx.restore(); }
        if(state==='fly'&&Math.random()<0.7) parts.push({x:sx2-8,y:Math.max(8,sy2),vx:-70-Math.random()*60,vy:(Math.random()*2-1)*30,gv:120,r:1.5+Math.random()*1.6,c:['#fff','#eef6d8'][rnd(2)],life:0.4});
        const shownM=Math.round((ckX-TRACK)/PXM); // 벽 기준 (벽 전이면 마이너스)
        ctx.font='19px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText(shownM+'m',202,92);
        ctx.fillStyle=shownM<0?'#d9544d':'#ffd977'; ctx.fillText(shownM+'m',200,90); }
      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; const px2=pp2.sx!=null?(pp2.sx+=pp2.vx*dt):(pp2.x+=pp2.vx*dt); const py2=pp2.sy!=null?(pp2.sy+=pp2.vy*dt):(pp2.y+=pp2.vy*dt);
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(px2-pp2.r/2,py2-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD: 진행 바 + 파워 + 각도
      if(state!=='intro'){ const prog=Math.min(1,worldX/TRACK);
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(30,18,340,10);
        ctx.fillStyle=prog>0.85?'#d9544d':'#3a7d4f'; ctx.fillRect(30,18,340*prog,10);
        ctx.fillStyle='#e6b450'; ctx.fillRect(30+340*prog-2,14,4,18);
        // 파워 바 (무제한 누적, 안 누르면 감소)
        const pw2=Math.min(1,power/60);
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(12,40,160,12);
        ctx.fillStyle=power>40?'#e6b450':'#3a7d4f'; ctx.fillRect(12,40,160*pw2,12);
        ctx.font='9px "Press Start 2P"'; ctx.textAlign='left';
        ctx.fillStyle='#000'; ctx.fillText('PWR '+Math.round(power),15,64); ctx.fillStyle='#ffd977'; ctx.fillText('PWR '+Math.round(power),13,62);
        ctx.textAlign='right'; ctx.font='12px "Press Start 2P"';
        const angCol=Math.abs(angle-45)<7?'#6fcf8f':'#e8e6dd';
        ctx.fillStyle='#000'; ctx.fillText(Math.round(angle)+'°',390,52); ctx.fillStyle=angCol; ctx.fillText(Math.round(angle)+'°',388,50);
        // 각도 화살표 (홀드 중에만 상승)
        if(state==='run'){ ctx.save(); ctx.translate(runnerX+62,GY-121); ctx.rotate(-angle*Math.PI/180);
          ctx.strokeStyle=holdA?'rgba(111,207,143,0.95)':'rgba(255,217,119,0.7)'; ctx.lineWidth=3; ctx.setLineDash([4,4]);
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(52,0); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle=holdA?'#6fcf8f':'#ffd977'; ctx.beginPath(); ctx.moveTo(60,0); ctx.lineTo(48,-5); ctx.lineTo(48,5); ctx.closePath(); ctx.fill(); ctx.restore(); } }
      // 미니맵 (발사 후: 어디까지 날아갔는지)
      if(state==='fly'||state==='rest'){ ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(20,434,360,40);
        ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.strokeRect(20,434,360,40);
        const mm0=36, mmW=330, mmStart=Math.min(launchX,TRACK);
        const S=mmW/((TRACK-mmStart)+maxM*PXM);
        const wallMx=mm0+(TRACK-mmStart)*S;

        ctx.fillStyle='#8a8d82'; ctx.fillRect(wallMx,462,mm0+mmW-wallMx,2);
        ctx.font='7px "Press Start 2P"'; ctx.textAlign='center';
        for(let m=0;m<=maxM;m+=25){ const x3=wallMx+m*PXM*S;

          ctx.fillStyle=m===0?'#6fcf8f':'#8a8d82'; ctx.fillText(String(m),x3,450); }
        const mx=Math.max(mm0,Math.min(mm0+mmW,mm0+(ckX-mmStart)*S));
        const my=Math.max(440,462-Math.max(0,(GY-8-ckY))*0.028);

        if(state==='rest'){ ctx.fillStyle='#d9544d'; ctx.fillRect(mx-1,452,2,14); } }
      // 인트로 로고
      if(state==='intro'){ const al=it<ARM-300?1:1-(it-(ARM-300))/300;
        ctx.globalAlpha=Math.max(0,al); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,400,480);
        const lgi=CL.imgs.logo; if(lgi){ const k=0.55+eob2(Math.min(1,it/280))*0.45, lw=350*k, lh=lw*(lgi.height/lgi.width);
          ctx.drawImage(lgi,200-lw/2,215-lh/2,lw,lh); }
        ctx.globalAlpha=1; }
      // 스탬프
      if(stampObj){ const st2=(t-stampT)/1000;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,210); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-st2*6)*1.4; ctx.scale(k2,k2);
        ctx.font='22px "Press Start 2P"'; ctx.textAlign='center';
        const col=stampObj.cls==='perfect'?'#6fcf8f':(stampObj.cls==='good'?'#e6b450':'#d9544d');
        ctx.fillStyle='#000'; ctx.fillText(stampObj.txt,3,3); ctx.fillStyle=col; ctx.fillText(stampObj.txt,0,0); ctx.restore(); }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== FREE POUR MASTER ====================== */
  // 실사 픽셀아트 캔버스 프리푸어: 병을 완전히 뒤집고 ml 카운터를 보며 정확한 순간에 놓아라
  const FP={ imgs:{}, loading:false };
  function fpKey(img,maxW){ // 흰 배경을 테두리 플러드필로만 제거(내부 흰 하이라이트 보존) 후 프리스케일
    const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.drawImage(img,0,0); let d; try{ d=x.getImageData(0,0,w,h); }catch(e){ return c; }
    const p=d.data, seen=new Uint8Array(w*h), q=[];
    const isW=i=>p[i*4]>224&&p[i*4+1]>224&&p[i*4+2]>224;
    for(let i=0;i<w;i++){ q.push(i,(h-1)*w+i); } for(let j=1;j<h-1;j++){ q.push(j*w, j*w+w-1); }
    while(q.length){ const i=q.pop(); if(seen[i]) continue; seen[i]=1; if(!isW(i)) continue; p[i*4+3]=0;
      const cx=i%w; if(cx>0&&!seen[i-1]) q.push(i-1); if(cx<w-1&&!seen[i+1]) q.push(i+1);
      if(i>=w&&!seen[i-w]) q.push(i-w); if(i<w*(h-1)&&!seen[i+w]) q.push(i+w); }
    x.putImageData(d,0,0);
    if(maxW&&w>maxW){ const c2=document.createElement('canvas'); c2.width=maxW; c2.height=Math.round(h*maxW/w);
      const x2=c2.getContext('2d'); x2.imageSmoothingQuality='high'; x2.drawImage(c,0,0,c2.width,c2.height); return c2; }
    return c; }
  function fpLoad(){ if(FP.loading) return; FP.loading=true;
    const srcs={ bg:['fp_bg',0], bottle:['fp_bottle',620], logo:['fp_logo',540], shot:['fp_shot',440], jigger:['fp_jigger',440], rocks:['fp_rocks',440] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ FP.imgs[k]=srcs[k][1]?fpKey(im,srcs[k][1]):im; }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  // 잔 스펙: cap/target = ml (1oz=30ml). in = 잔 내부 영역(그린 크기 대비 비율)
  const FP_GLASS=[
    { key:'shot',   name:'SHOT GLASS / 1oz',  cap:45, target:30, h:146, in:{top:.225,bot:.665,hwT:.245,hwB:.155} },
    { key:'jigger', name:'JIGGER / 1.5oz',    cap:60, target:45, h:164, in:{top:.095,bot:.495,hwT:.205,hwB:.04} },
    { key:'rocks',  name:'ROCKS GLASS / 2oz', cap:90, target:60, h:170, in:{top:.195,bot:.655,hwT:.285,hwB:.245} } ];
  const FP_RATE=10; // ml/초 — 3초=1oz(30ml), 실제 스피드푸어러 카운트 속도
  function fpNoise(){ const a=ac(); if(!a) return null; try{
    const len=Math.floor(a.sampleRate*0.4), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
    const gn=a.createGain(); gn.gain.value=0.0001; src.connect(bp); bp.connect(gn); gn.connect(a.destination); src.start();
    return { set:(on,f)=>{ const t=a.currentTime; gn.gain.setTargetAtTime(on?0.09:0.0001,t,0.05); bp.frequency.setTargetAtTime(650+f*950,t,0.08); },
      kill:()=>{ try{ src.stop(); }catch(e){} } }; }catch(e){ return null; } }
  // 한 판 = 3연속 챌린지: 샷 30ml → 지거 45ml → 록스 60ml
  // cfg: { blind:카운터 숨김 } / done(평균점수, txt, cls, 오차합, 오차배열)
  function engFreePour(cfg, done){
    fpLoad();
    const blind=!!cfg.blind;
    stage.innerHTML='<div class="mgtitle">'+(blind?'BLIND POUR':'FREE POUR MASTER')+'</div>'
      +'<div class="mghint">30ml → 45ml → 60ml 3연속! 꾹 누르면 병이 완전히 뒤집힌다. '
      +(blind?'카운터 없이 감으로!':'카운터를 보고 정확한 순간에 놓아라!')+'</div>'
      +'<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="fpb">HOLD TO POUR</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('fpb');
    const GX=200, GBASE=444;
    const BH=280, BW=BH*0.75, GRIPX=0.47, GRIPY=0.31, TIPX=0.415, TIPY=0.05;
    const IDLE={x:312,y:176,a:0.14}, POUR={x:197,y:150,a:-Math.PI}, DUR=9500;
    const LOGO_T=1150, INTRO=1900; // 첫 인트로: 로고 크게(~1.15초) → 병/잔 등장 → 1.9초부터 입력
    const eob=x=>{ const c=1.70158, f=x-1; return 1+f*f*((c+1)*f+c); }; // easeOutBack
    let pourIdx=0, g, GH, GW, gx0, gy0, inTop, inBot, target;
    function setGlass(i){ g=FP_GLASS[i]; target=g.target; GH=g.h; GW=g.h; gx0=GX-GW/2; gy0=GBASE-GH;
      inTop=gy0+g.in.top*GH; inBot=gy0+g.in.bot*GH; }
    setGlass(0);
    const pourErrs=[], pourScores=[];
    let ml=0, hold=false, released=false, finished=false, flip=0, lastTick=0;
    let stampObj=null, stampT=0, shake=0, settleT=0, dribble=0, tailTau=0.2, t0=0, lastT=0, raf=0;
    let armT=INTRO, glassPopT=LOGO_T, bannerUntil=0; // armT: t0 기준 입력 허용 시각
    const parts=[], streamPts=[]; const noise=fpNoise();
    const lvlY=v=>inBot-(inBot-inTop)*Math.min(1,v/g.cap);
    const hwAt=y=>{ const f=(inBot-y)/Math.max(1,inBot-inTop); return (g.in.hwB+(g.in.hwT-g.in.hwB)*f)*GW; };
    function pose(){ const e=flip*flip*(3-2*flip);
      return { x:IDLE.x+(POUR.x-IDLE.x)*e, y:IDLE.y+(POUR.y-IDLE.y)*e, a:IDLE.a+(POUR.a-IDLE.a)*e }; }
    function tip(){ const p=pose(), lx=(TIPX-GRIPX)*BW, ly=(TIPY-GRIPY)*BH, c=Math.cos(p.a), s=Math.sin(p.a);
      return { x:p.x+lx*c-ly*s, y:p.y+lx*s+ly*c }; }
    function burst(x,y,n,cols,pw){ for(let i=0;i<n;i++){ const a2=Math.random()*Math.PI*2, v=(0.4+Math.random())*(pw||1);
      parts.push({x,y,vx:Math.cos(a2)*95*v,vy:Math.sin(a2)*95*v-130*v,gv:430,r:2+Math.random()*3,c:cols[rnd(cols.length)],life:0.5+Math.random()*0.45}); } }
    function judge(){
      const err=ml-target, ae=Math.abs(err); let sc,txt,cls,quip;
      if(ml>=g.cap-0.01){ sc=0; txt='SPILL!'; cls='miss'; quip=['사장님 등장!!','바닥이 더 마셨다…'][rnd(2)]; burst(GX,inTop,36,['#ffd977','#c87f1e','#d9544d'],1.3); }
      else if(ae<=1.0){ sc=100; txt='PERFECT!'; cls='perfect'; quip=['손목에 신이 들렸다!!','이게 프로의 카운트다','소름 돋는 정확도'][rnd(3)]; }
      else if(ae<=3.0){ sc=Math.round(95-(ae-1)*8); txt='GOOD'; cls='good'; quip=err<0?'반 박자 빨랐다':'반 박자 늦었다'; }
      else if(ae<=6.0){ sc=Math.round(72-(ae-3)*7); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?'손님이 째려본다…':'욕심이 과했다…'; }
      else { sc=Math.max(0,Math.round(50-(ae-6)*4)); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?'그건 향만 나는데?':'그건 더블인데?'; }
      stampObj={txt,cls,quip,err}; stampT=lastT;
      pourErrs.push(Math.min(ae,99.99)); pourScores.push(sc);
      if(cls==='perfect'){ flash('#6fcf8f'); sGood(); setTimeout(()=>beep(1320,0.14,'square',0.12),140); burst(GX,lvlY(ml),44,['#ffd977','#6fcf8f','#e6b450','#fff'],1.4); }
      else if(cls==='good') sGood();
      else { sBad(); shake=(txt==='SPILL!')?13:7; }
      setTimeout(()=>{ if(finished) return;
        if(pourIdx<2){ nextPour(); return; }
        finished=true; cleanup();
        const tot=pourErrs.reduce((a,b)=>a+b,0), avg=Math.round(pourScores.reduce((a,b)=>a+b,0)/3);
        let ftxt,fcls; if(tot<=3){ ftxt='POUR MASTER!'; fcls='perfect'; }
        else if(tot<=9){ ftxt='±'+tot.toFixed(1)+'ml'; fcls='good'; }
        else { ftxt='±'+tot.toFixed(1)+'ml'; fcls='miss'; }
        done(avg,ftxt,fcls,tot,pourErrs.slice()); },1350);
    }
    function nextPour(){ pourIdx++; setGlass(pourIdx); streamPts.length=0;
      ml=0; lastTick=0; hold=false; released=false; flip=0; stampObj=null; dribble=0;
      t0=lastT; armT=700; glassPopT=0; bannerUntil=lastT+1000; beep(700,0.08); }
    function release(force){ if(released||finished) return; if(!hold&&!force) return;
      // 병이 돌아오는 동안 물줄기가 가늘어지며 잔여분이 더 들어간다 (매번 조금씩 다름, 약 1.7~2.4ml)
      released=true; hold=false; dribble=(flip>0.92)?FP_RATE:flip*3; tailTau=0.17+Math.random()*0.07;
      if(noise) noise.set(false,0); settleT=lastT; }
    function dn(e){ e.preventDefault(); ac(); if(finished||released||stampObj||!t0||now()-t0<armT) return;
      if(!hold){ hold=true; beep(500,0.05,'square',0.08); } }
    function up(e){ if(e&&e.cancelable) e.preventDefault(); release(false); }
    cv.addEventListener('pointerdown',dn); btn.addEventListener('pointerdown',dn);
    ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,up));
    function cleanup(){ cancelAnimationFrame(raf); if(noise) noise.kill();
      ['pointerup','pointercancel'].forEach(ev=>window.removeEventListener(ev,up)); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      flip+=((hold&&!released)?1:-1)*dt/0.28; flip=Math.max(0,Math.min(1,flip));
      const pouring=hold&&!released&&flip>0.92;
      if(pouring){ ml+=FP_RATE*dt; if(noise) noise.set(true,Math.min(1,ml/g.cap));
        if(Math.floor(ml/10)>Math.floor(lastTick/10)) beep(880,0.04,'square',0.1);
        lastTick=ml; if(ml>=g.cap){ ml=g.cap; release(true); } }
      else if(noise&&hold) noise.set(false,0);
      if(released&&!stampObj&&dribble>0.03){ ml+=dribble*dt; dribble*=Math.exp(-dt/tailTau);
        if(ml>=g.cap){ ml=g.cap; dribble=0; } }
      if(released&&!stampObj&&t-settleT>620) judge();
      if(!released&&!stampObj&&t-t0>armT+DUR) release(true);
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height), bw2=bgi.width*s, bh2=bgi.height*s;
        ctx.drawImage(bgi,(400-bw2)/2,(480-bh2)/2,bw2,bh2); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,400,480);
      const it=t-t0;
      const gimg=FP.imgs[g.key];
      if(gimg&&it>glassPopT){ const gp=Math.min(1,(it-glassPopT)/350), s2=gp>=1?1:Math.max(0.01,eob(gp));
        ctx.save(); ctx.translate(GX,GBASE); ctx.scale(s2,s2); ctx.drawImage(gimg,-GW/2,-GH,GW,GH); ctx.restore(); }
      if(ml>0.05){ const wA=pouring?2.0:(released?Math.max(0.4,2-(t-settleT)/350):0.8);
        const sy2=Math.max(inTop-2,lvlY(ml))+Math.sin(t/60)*wA;
        const hwS=hwAt(sy2), hwB2=g.in.hwB*GW;
        ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.88;
        const lg=ctx.createLinearGradient(0,sy2,0,inBot); lg.addColorStop(0,'#f6c14a'); lg.addColorStop(1,'#b96f14');
        ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(GX-hwS,sy2); ctx.lineTo(GX+hwS,sy2);
        ctx.lineTo(GX+hwB2,inBot); ctx.lineTo(GX-hwB2,inBot); ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.globalAlpha=0.7; ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.ellipse(GX,sy2,hwS,3,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      if(!blind&&!stampObj&&it>glassPopT+340){ const ty2=lvlY(target); ctx.strokeStyle='#e6b450'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(gx0-8,ty2); ctx.lineTo(gx0+GW+8,ty2); ctx.stroke(); ctx.setLineDash([]);
        ctx.font='8px "Press Start 2P"'; ctx.textAlign='right'; ctx.fillStyle='#e6b450'; ctx.fillText(target+'ml',gx0-12,ty2+3); }
      // ── 물줄기: 팁에서 방출된 액체 조각이 각자 중력 낙하 (병이 움직여도 이미 나온 액체는 제자리에서 떨어진다) ──

  /* ====================== ICE CARVING ====================== */
  // 연타로 게이지를 올려 얼음을 구로 깎고(안 누르면 빠르게 감소) 완성 존에서 완성! — 15초 동안 최대 개수
  const IC={ imgs:{}, loading:false, stages:null };
  function icLoad(){ if(IC.loading) return; IC.loading=true;
    const srcs={ ice:['ic_ice',900], pick:['ic_pick',520], broke:['ic_broke',420], logo:['ic_logo',560] };
    Object.keys(srcs).forEach(k=>{ const im=new Image();
      im.onload=()=>{ IC.imgs[k]=fpKey(im,srcs[k][1]); if(k==='ice') icSegment(); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function icSegment(){ // 5단계 시트를 알파 열 스캔으로 자동 분리
    const c=IC.imgs.ice, w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data;
    const colHas=new Uint8Array(w);
    for(let cx=0;cx<w;cx++){ for(let cy=0;cy<h;cy++){ if(d[(cy*w+cx)*4+3]>30){ colHas[cx]=1; break; } } }
    const runs=[]; let s=-1;
    for(let cx=0;cx<=w;cx++){ const on=cx<w&&colHas[cx]; if(on&&s<0) s=cx; else if(!on&&s>=0){ if(cx-s>12) runs.push([s,cx]); s=-1; } }
    const rects=(runs.length===5)?runs:[0,1,2,3,4].map(i=>[Math.round(w*i/5),Math.round(w*(i+1)/5)]);
    IC.stages=rects.map(r=>{ let top=h-1,bot=0;
      for(let cy=0;cy<h;cy++){ for(let cx=r[0];cx<r[1];cx++){ if(d[(cy*w+cx)*4+3]>30){ if(cy<top)top=cy; if(cy>bot)bot=cy; break; } } }
      return {sx:r[0],sy:top,sw:r[1]-r[0],sh:Math.max(1,bot-top+1)}; }); }
  function engIceCarve(done){
    fpLoad(); icLoad();

      +'<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<button class="btn amber" id="icTap" style="width:min(200px,46vw);height:70px;font-size:16px">TAP!</button>'
      +'<button class="btn" id="icDone" style="width:min(140px,32vw);height:70px;font-size:13px">완성!</button></div>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const ICEX=185, ICEY=392, ZONE=88, TOTAL=15000, ARM=1200, DECAY=38, TAPUP=9;
    let gauge=0, count=0, stunUntil=0, strikeT=-1e9, brokeT=-1e9, popT=0, finished=false, ended=false;

    const parts=[], flyBalls=[], msgs=[];
    const armed=()=>t0&&now()-t0>=ARM;
    function chip(n,px,py){ for(let i=0;i<n;i++) parts.push({x:px+(Math.random()*30-15),y:py+(Math.random()*20-10),
      vx:(Math.random()*2-1)*160,vy:-120-Math.random()*160,gv:900,r:2+Math.random()*2.5,c:['#dff1ff','#9fd2f5','#fff'][rnd(3)],life:0.45+Math.random()*0.3}); }
    function tap(e){ if(e)e.preventDefault(); ac(); if(!armed()||finished||now()<stunUntil||now()-t0-ARM>=TOTAL) return;
      gauge=Math.min(100,gauge+TAPUP); strikeT=now(); sTap(); beep(1450,0.03,'square',0.06);
      shake=Math.max(shake,2.2); chip(5,contactX,contactY); }
    function fin(e){ if(e)e.preventDefault(); ac(); if(!armed()||finished||now()<stunUntil||now()-t0-ARM>=TOTAL) return;
      if(gauge>=ZONE){ count++; gauge=0; popT=now(); sGood(); setTimeout(()=>beep(1400,0.1,'square',0.1),90);
        flyBalls.push({x:ICEX,y:ICEY-60,tx:22+((count-1)%12)*30,ty:66,t:now()});
        msgs.push({txt:'볼 아이스 +1!',t:now()}); flash('#6fcf8f'); }

            for(let j=0;j<14;j++) parts.push({x:ICEX+(Math.random()*iw-iw/2),y:ICEY-ih*Math.random(),
              vx:(Math.random()*2-1)*220,vy:-140-Math.random()*200,gv:900,r:2.5+Math.random()*3.5,
              c:['#dff1ff','#9fd2f5','#fff','#bfe6ff'][rnd(4)],life:0.5+Math.random()*0.4}); }
          if(stIdx!==prevStage) prevStage=stIdx;

          if(t-strikeT<70) sc2*=1-0.07*Math.sin(Math.PI*(t-strikeT)/70); // 타격 스쿼시
          ctx.save(); ctx.translate(ICEX,ICEY); ctx.scale(sc2,sc2);
          ctx.drawImage(IC.imgs.ice,r.sx,r.sy,r.sw,r.sh,-iw/2,-ih,iw,ih); ctx.restore();
          if(stIdx===4&&Math.random()<0.25) parts.push({x:ICEX+(Math.random()*70-35),y:ICEY-30-Math.random()*80,
            vx:0,vy:-20,gv:0,r:1.5+Math.random()*1.5,c:'#fff',life:0.35}); } }
      // 아이스픽: 수직 스탭 — 얼음 바로 위에 수직으로 들고 있다가 뾰족한 끝이 곧장 내리꽂힌다

          ctx.drawImage(rg,200-rw/2,330-rh/2,rw,rh); }
        if(lgi){ const k=0.55+eob2(Math.min(1,it/280))*0.45, lw=340*k, lh=lw*(lgi.height/lgi.width);
          ctx.drawImage(lgi,200-lw/2,130-lh/2,lw,lh); }
        return; }
      // 손님 (오른쪽에서 쑥 올라옴)
      const cust=QT.imgs[CUSTS[round]];
      if(cust){ const k=eob2(Math.min(1,(t-custIn)/380)); const ch=210, cw2=ch*(cust.width/cust.height);
        let bob=Math.sin(t/260)*3; if(state==='win') bob=-Math.abs(Math.sin(t/90))*10;
        ctx.drawImage(cust,398-cw2,90+(1-k)*220+bob,cw2,ch); }
      // 영수증 (왼쪽, 프린트되며 내려옴) — 종이 실제 영역(bbox)에 맞춰 텍스트 배치
      const rc=QT.imgs.receipt;
      if(rc&&state!=='intro'){ const rw2=302, rh3=404, rx=-6;
        const pk2=Math.min(1,(t-(printT-500))/350);
        const ry=50+(1-eob2(pk2))*(-460);
        ctx.drawImage(rc,rx,ry,rw2,rh3);
        const rb=QT.rb||{fx0:0.12,fy0:0.04,fx1:0.88,fy1:0.96};
        const tx0=rx+rw2*rb.fx0+41, tx1=rx+rw2*rb.fx1-18;
        const shown=state==='print'?Math.max(0,Math.floor((t-printT)/90)):lines.length;
        let y=ry+rh3*rb.fy0+42;
        ctx.textAlign='left'; ctx.fillStyle='#2a2a2a'; ctx.font='8px "Press Start 2P"';
        ctx.fillText('PINE & CO - TAB',tx0,y); y+=9;
        ctx.fillStyle='#9a9a92'; ctx.fillText('---------------',tx0,y); y+=16;
        const lh=lines.length>7?15:21;
        for(let i=0;i<Math.min(shown,lines.length);i++){ let nm=lines[i][0];
          let f=8; ctx.font=f+'px "Press Start 2P"';
          while(f>6&&ctx.measureText(nm).width>tx1-tx0-40){ f--; ctx.font=f+'px "Press Start 2P"'; }
          while(nm.length>4&&ctx.measureText(nm).width>tx1-tx0-40) nm=nm.slice(0,-1);
          ctx.fillStyle='#2a2a2a'; ctx.fillText(nm,tx0,y);
          ctx.textAlign='right'; ctx.font='9px "Press Start 2P"'; ctx.fillText('$'+lines[i][1],tx1,y);
          ctx.textAlign='left'; y+=lh; }
        if(shown>=lines.length){ y+=2; ctx.fillStyle='#9a9a92'; ctx.font='8px "Press Start 2P"'; ctx.fillText('---------------',tx0,y); y+=19;
          ctx.font='11px "Press Start 2P"';
          const cur=(state==='answer'&&Math.floor(t/300)%2===0)?'_':'';
          ctx.fillStyle=state==='win'?'#3a7d4f':'#1a1a1a';
          ctx.fillText('TOTAL',tx0,y);
          ctx.textAlign='right'; ctx.fillText('$'+(state==='win'?total:(input||'?'))+(state==='answer'?cur:''),tx1,y); ctx.textAlign='left'; }
        if(state==='print'&&shown<lines.length&&Math.floor(t/90)%2===0) beep(660,0.015,'square',0.03); }
      // 정답 연출: CORRECT! 스탬프 + 확장 링
      if(state==='win'){ const wk=(t-winT)/1000;
        const rr2=Math.min(1,wk/0.35);
        ctx.globalAlpha=Math.max(0,1-rr2*0.95); ctx.strokeStyle='#6fcf8f'; ctx.lineWidth=5;
        ctx.beginPath(); ctx.arc(200,238,22+rr2*72,0,6.28); ctx.stroke();
        ctx.beginPath(); ctx.arc(200,238,10+rr2*46,0,6.28); ctx.stroke(); ctx.globalAlpha=1;
        ctx.save(); ctx.translate(200,234); ctx.rotate(-0.07);
        const k2=1+Math.max(0,1-wk*6)*1.3; ctx.scale(k2,k2);
        ctx.font='22px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('CORRECT!',3,3); ctx.fillStyle='#6fcf8f'; ctx.fillText('CORRECT!',0,0); ctx.restore();
        ctx.font='13px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('+$'+total,202,282); ctx.fillStyle='#ffd977'; ctx.fillText('+$'+total,200,280); }
      if(t-badT<220){ ctx.fillStyle='rgba(217,84,77,0.25)'; ctx.fillRect(0,0,400,480); }
      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD
      ctx.font='10px "Press Start 2P"'; ctx.textAlign='left';
      ctx.fillStyle='#000'; ctx.fillText('BILL '+(round+1)+'/7',14,32); ctx.fillStyle='#e8e6dd'; ctx.fillText('BILL '+(round+1)+'/7',12,30);
      if(state==='answer'){ const el=((t-solveT)/1000).toFixed(1); ctx.textAlign='right';
        ctx.fillStyle='#000'; ctx.fillText(el+'s',390,32); ctx.fillStyle=parseFloat(el)>12?'#d9544d':'#e8e6dd'; ctx.fillText(el+'s',388,30); }
      if(state==='end'){ ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,400,480);
        ctx.font='20px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('LAST CALL!',203,213); ctx.fillStyle='#e6b450'; ctx.fillText('LAST CALL!',200,210);
        ctx.font='700 16px -apple-system,"Malgun Gothic",sans-serif';
        ctx.fillStyle='#000'; ctx.fillText('7명 정산 완료',201,249); ctx.fillStyle='#fff'; ctx.fillText('7명 정산 완료',200,248); }
    }
    raf=requestAnimationFrame(draw);
  }

    { name:'ICE SMASH', cat:'연타', run:d=>engMash({title:'ICE SMASH',hint:'얼음을 마구 깨부숴라',emoji:'🧊',goal:40,dur:3600,label:'SMASH!'},d) },

    { name:'CORK POP', cat:'연타', run:d=>engMash({title:'CORK POP',hint:'코르크를 마구 비틀어 뽑아라',emoji:'🍾',goal:36,dur:3400,label:'TWIST!'},d) },
    { name:'BLEND', cat:'연타', run:d=>engMash({title:'BLEND',hint:'블렌더를 최고속으로 돌려라',emoji:'🌀',goal:44,dur:3600,label:'BLEND!'},d) },
    // 리듬
    { name:'SHAKE RHYTHM', cat:'리듬', run:d=>engRhythm({title:'SHAKE RHYTHM',hint:'박자에 맞춰 셰이킹!',beats:8,interval:600},d) },
    { name:'STIR RHYTHM', cat:'리듬', run:d=>engRhythm({title:'STIR RHYTHM',hint:'느린 박자에 맞춰 스터',beats:6,interval:760},d) },
    // 다단계
    { name:'CHAMPAGNE LAUNCH', cat:'스페셜', run:d=>engChampagne(d) },
    // 퀴즈
    { name:'GUESS COCKTAIL', cat:'퀴즈', run:d=>{ const ans=CK[rnd(CK.length)]; const opts=shuffle([ans,...sample(CK.filter(k=>k!==ans),3)]).map(k=>({label:COCKTAILS[k],correct:k===ans}));

    { name:'NAME SPIRIT', cat:'퀴즈', run:d=>{ const ans=SP[rnd(SP.length)]; const opts=shuffle([ans,...sample(SP.filter(k=>k!==ans),3)]).map(k=>({label:SPIRITS[k],correct:k===ans}));

    { name:'RECIPE MATCH', cat:'퀴즈', run:d=>{ const ans=RK[rnd(RK.length)]; const icons=RECIPES[ans].map(k=>'<img src="assets/ing_'+k+'.png">').join(''); const opts=shuffle([ans,...sample(CK.filter(k=>k!==ans),3)]).map(k=>({label:COCKTAILS[k],correct:k===ans}));
        engChoiceText({title:'RECIPE MATCH',hint:'이 재료들의 칵테일은?',promptHTML:'<div class="qicons">'+icons+'</div>',options:opts},d); } },
    { name:'GARNISH MATCH', cat:'퀴즈', run:d=>{ const ans=GK[rnd(GK.length)]; const g=GARNISH[ans]; const opts=shuffle([g,...sample(GARNISH_SET.filter(x=>x!==g),3)]).map(x=>({label:x,correct:x===g}));
