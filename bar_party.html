  const SFX={ glass:null, shakerBuf:null, shakerSegs:null };

  function loadShaker(){ const a=ac(); if(!a||SFX.shakerBuf||SFX.__loading) return; SFX.__loading=true;
    fetch('assets/sfx_shaker_ice.mp3').then(r=>r.arrayBuffer()).then(b=>a.decodeAudioData(b)).then(buf=>{
      SFX.shakerBuf=buf;
      // 무음 구간으로 3개 소리 분리 (RMS 임계)
      const d=buf.getChannelData(0), sr=buf.sampleRate, win=Math.floor(sr*0.02);
      const loud=[]; for(let i=0;i+win<d.length;i+=win){ let sum=0;
        for(let k=0;k<win;k+=4){ const v=d[i+k]; sum+=v*v; }
        loud.push(Math.sqrt(sum/(win/4))); }
      const peak=Math.max.apply(null,loud), thr=peak*0.12;
      const segs=[]; let st=-1;
      for(let i=0;i<loud.length;i++){
        if(loud[i]>thr){ if(st<0) st=i; }
        else if(st>=0){ if((i-st)*win/sr>0.05) segs.push([st*win/sr, Math.min(buf.duration,(i+3)*win/sr)]); st=-1; } }
      if(st>=0) segs.push([st*win/sr, buf.duration]);

      const merged=[]; segs.forEach(sg=>{ const last=merged[merged.length-1];

      segs.length=0; merged.forEach(x=>segs.push(x));

  function rankMetric(t){
    const s = String(t || '');
    const m = s.match(/-?\d+(?:\.\d+)?/);
    if (!m) return null;
    return { v: parseFloat(m[0]), low: s.indexOf('±') >= 0 };   // ±4.1ml 처럼 오차는 작을수록 좋다
  }
  function rankCmp(a, b){
    if ((b.s || 0) !== (a.s || 0)) return (b.s || 0) - (a.s || 0);
    const ma = rankMetric(a.t), mb = rankMetric(b.t);
    if (ma && mb) return ma.low ? ma.v - mb.v : mb.v - ma.v;
    if (ma) return -1;
    if (mb) return 1;
    return (a.at || 0) - (b.at || 0);
  }

      // 벽 (트랙 끝)
      const wallX=RX+(TRACK-cam);
      if(state!=='intro'&&wallX>-40&&wallX<440){ ctx.fillStyle='#4a3520'; ctx.fillRect(wallX,GY-130,26,130);
        ctx.fillStyle='#c9a96e'; ctx.fillRect(wallX,GY-130,26,8);
        ctx.font='9px "Press Start 2P"'; ctx.textAlign='center'; ctx.fillStyle='#d9544d';
        if(state==='run') ctx.fillText('WALL!',wallX+13,GY-140); }
      // 러너 (발사 후엔 제자리에 남는다)
      const runnerX=RX+(worldX-cam);
      if(runnerX>-120){
        if(state==='run'||state==='intro'){ const fr=CL.imgs[FRAMES[Math.floor(runPh)%5]];
          if(fr){ const rw2=RH*(fr.width/fr.height);
            const bob=Math.sin(runPh*3.14)*2;
            if(holdA){ const sk=CL.imgs.skid; if(sk){ const sw2=RH*(sk.width/sk.height); ctx.drawImage(sk,runnerX-sw2/2,GY-RH,sw2,RH); } }
            else ctx.drawImage(fr,runnerX-rw2/2,GY-RH+bob,rw2,RH); } }
        else { const sk=CL.imgs.skid;
          if(sk){ const rw2=RH*(sk.width/sk.height); ctx.drawImage(sk,runnerX-rw2/2,GY-RH,rw2,RH); } } }
      // 코르크 (실제 포물선 + 카메라 추적)
      if(state==='fly'||state==='rest'){ const ck=CL.imgs.cork;
        const sx2=RX+(ckX-cam), sy2=GY-(GY-ckY)*VSQ;
        // 원근: 발사 직후 살짝 커졌다가 멀어질수록 작아진다
        const p3=Math.min(1,Math.max(0,(ckX-launchX)/Math.max(1,flyR)));
        const csz=28*(p3<0.15?1+(p3/0.15)*0.45:1.45-((p3-0.15)/0.85)*0.9);
        if(sy2<-6){ ctx.fillStyle='#ffd977'; ctx.beginPath(); // 화면 위로 넘어가면 상단 마커
          ctx.moveTo(sx2,6); ctx.lineTo(sx2-8,20); ctx.lineTo(sx2+8,20); ctx.closePath(); ctx.fill(); }
        else if(ck){ ctx.save(); ctx.translate(sx2,sy2); ctx.rotate(ckRot);
          ctx.drawImage(ck,-csz/2,-csz/2,csz,csz); ctx.restore(); }
        if(state==='fly'&&Math.random()<0.7) parts.push({x:sx2-8,y:Math.max(8,sy2),vx:-70-Math.random()*60,vy:(Math.random()*2-1)*30,gv:120,r:1.5+Math.random()*1.6,c:['#fff','#eef6d8'][rnd(2)],life:0.4});
        const shownM=Math.round((ckX-TRACK)/PXM); // 벽 기준 (벽 전이면 마이너스)
        ctx.font='19px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText(shownM+'m',202,92);
        ctx.fillStyle=shownM<0?'#d9544d':'#ffd977'; ctx.fillText(shownM+'m',200,90); }
      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; const px2=pp2.sx!=null?(pp2.sx+=pp2.vx*dt):(pp2.x+=pp2.vx*dt); const py2=pp2.sy!=null?(pp2.sy+=pp2.vy*dt):(pp2.y+=pp2.vy*dt);
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(px2-pp2.r/2,py2-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD: 진행 바 + 파워 + 각도
      if(state!=='intro'){ const prog=Math.min(1,worldX/TRACK);
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(30,18,340,10);
        ctx.fillStyle=prog>0.85?'#d9544d':'#3a7d4f'; ctx.fillRect(30,18,340*prog,10);
        ctx.fillStyle='#e6b450'; ctx.fillRect(30+340*prog-2,14,4,18);
        // 파워 바 (무제한 누적, 안 누르면 감소)
        const pw2=Math.min(1,power/60);
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(12,40,160,12);
        ctx.fillStyle=power>40?'#e6b450':'#3a7d4f'; ctx.fillRect(12,40,160*pw2,12);
        ctx.font='9px "Press Start 2P"'; ctx.textAlign='left';
        ctx.fillStyle='#000'; ctx.fillText('PWR '+Math.round(power),15,64); ctx.fillStyle='#ffd977'; ctx.fillText('PWR '+Math.round(power),13,62);
        ctx.textAlign='right'; ctx.font='12px "Press Start 2P"';
        const angCol=Math.abs(angle-45)<7?'#6fcf8f':'#e8e6dd';
        ctx.fillStyle='#000'; ctx.fillText(Math.round(angle)+'°',390,52); ctx.fillStyle=angCol; ctx.fillText(Math.round(angle)+'°',388,50);
        // 각도 화살표 (홀드 중에만 상승)
        if(state==='run'){ ctx.save(); ctx.translate(runnerX+62,GY-121); ctx.rotate(-angle*Math.PI/180);
          ctx.strokeStyle=holdA?'rgba(111,207,143,0.95)':'rgba(255,217,119,0.7)'; ctx.lineWidth=3; ctx.setLineDash([4,4]);
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(52,0); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle=holdA?'#6fcf8f':'#ffd977'; ctx.beginPath(); ctx.moveTo(60,0); ctx.lineTo(48,-5); ctx.lineTo(48,5); ctx.closePath(); ctx.fill(); ctx.restore(); } }
      // 미니맵 (발사 후: 어디까지 날아갔는지)
      if(state==='fly'||state==='rest'){ ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(20,434,360,40);
        ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.strokeRect(20,434,360,40);
        const mm0=36, mmW=330, mmStart=Math.min(launchX,TRACK);
        const S=mmW/((TRACK-mmStart)+maxM*PXM);
        const wallMx=mm0+(TRACK-mmStart)*S;
        ctx.fillStyle='rgba(217,84,77,0.4)'; ctx.fillRect(mm0,462,wallMx-mm0,2); // 마이너스 구간
        ctx.fillStyle='#8a8d82'; ctx.fillRect(wallMx,462,mm0+mmW-wallMx,2);
        ctx.font='7px "Press Start 2P"'; ctx.textAlign='center';
        for(let m=0;m<=maxM;m+=25){ const x3=wallMx+m*PXM*S;
          ctx.fillStyle=m===0?'#6fcf8f':'#555'; ctx.fillRect(x3,m===0?452:458,m===0?2:1,m===0?18:8);
          ctx.fillStyle=m===0?'#6fcf8f':'#8a8d82'; ctx.fillText(String(m),x3,450); }
        const mx=Math.max(mm0,Math.min(mm0+mmW,mm0+(ckX-mmStart)*S));
        const my=Math.max(440,462-Math.max(0,(GY-8-ckY))*0.028);
        ctx.fillStyle='#ffd977'; ctx.beginPath(); ctx.arc(mx,my,3.5,0,6.28); ctx.fill();
        if(state==='rest'){ ctx.fillStyle='#d9544d'; ctx.fillRect(mx-1,452,2,14); } }
      // 인트로 로고
      if(state==='intro'){ const al=it<ARM-300?1:1-(it-(ARM-300))/300;
        ctx.globalAlpha=Math.max(0,al); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,400,480);
        const lgi=CL.imgs.logo; if(lgi){ const k=0.55+eob2(Math.min(1,it/280))*0.45, lw=350*k, lh=lw*(lgi.height/lgi.width);
          ctx.drawImage(lgi,200-lw/2,215-lh/2,lw,lh); }
        ctx.globalAlpha=1; }
      // 스탬프
      if(stampObj){ const st2=(t-stampT)/1000;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,210); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-st2*6)*1.4; ctx.scale(k2,k2);
        ctx.font='22px "Press Start 2P"'; ctx.textAlign='center';
        const col=stampObj.cls==='perfect'?'#6fcf8f':(stampObj.cls==='good'?'#e6b450':'#d9544d');
        ctx.fillStyle='#000'; ctx.fillText(stampObj.txt,3,3); ctx.fillStyle=col; ctx.fillText(stampObj.txt,0,0); ctx.restore(); }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== FREE POUR MASTER ====================== */
  // 실사 픽셀아트 캔버스 프리푸어: 병을 완전히 뒤집고 ml 카운터를 보며 정확한 순간에 놓아라
  const FP={ imgs:{}, loading:false };
  function fpKey(img,maxW,thr,killAll){ // 흰 배경 플러드필 제거(+killAll: 갇힌 흰 구멍도 전역 제거 — 로고용)
    const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.drawImage(img,0,0); let d; try{ d=x.getImageData(0,0,w,h); }catch(e){ return c; }
    const p=d.data, seen=new Uint8Array(w*h), q=[];
    const TH=thr||224;
    const isW=i=>p[i*4]>TH&&p[i*4+1]>TH&&p[i*4+2]>TH;
    for(let i=0;i<w;i++){ q.push(i,(h-1)*w+i); } for(let j=1;j<h-1;j++){ q.push(j*w, j*w+w-1); }
    while(q.length){ const i=q.pop(); if(seen[i]) continue; seen[i]=1; if(!isW(i)) continue; p[i*4+3]=0;
      const cx=i%w; if(cx>0&&!seen[i-1]) q.push(i-1); if(cx<w-1&&!seen[i+1]) q.push(i+1);
      if(i>=w&&!seen[i-w]) q.push(i-w); if(i<w*(h-1)&&!seen[i+w]) q.push(i+w); }
    if(killAll){ for(let i=0;i<p.length;i+=4){ if(p[i+3]>0&&p[i]>243&&p[i+1]>243&&p[i+2]>243) p[i+3]=0; } }
    x.putImageData(d,0,0);
    if(maxW&&w>maxW){ const c2=document.createElement('canvas'); c2.width=maxW; c2.height=Math.round(h*maxW/w);
      const x2=c2.getContext('2d'); x2.imageSmoothingQuality='high'; x2.drawImage(c,0,0,c2.width,c2.height); return c2; }
    return c; }
  // 게임별 전용 배경 (50 베스트 바 스타일)
  const GB={ imgs:{}, loading:false };
  function gbLoad(){ if(GB.loading) return; GB.loading=true;
    ['freepour','stir','icecarving','champagne','shake','tipcatch','flyswat','orderup','whereshot','squeeze'].forEach(k=>{
      const im=new Image(); im.onload=()=>{ GB.imgs[k]=im; }; im.src='assets/bg_'+k+'.jpg'; }); }
  function fpKeyUI(img,maxW){ // UI 이미지용: 낮은 임계 키잉 + 가장자리 흰 잔재(halo) 2패스 제거
    const c=fpKey(img,maxW,205);
    try{ const g=c.getContext('2d'); const w=c.width,h=c.height;
      const dd=g.getImageData(0,0,w,h); const p=dd.data;
      for(let pass=0;pass<2;pass++){ const kill=[];
        for(let y=0;y<h;y++) for(let x2=0;x2<w;x2++){ const i=(y*w+x2)*4;
          if(p[i+3]===0) continue;
          if(p[i]>205&&p[i+1]>205&&p[i+2]>205){
            if((x2>0&&p[i-4+3]===0)||(x2<w-1&&p[i+4+3]===0)||(y>0&&p[i-w*4+3]===0)||(y<h-1&&p[i+w*4+3]===0)) kill.push(i); } }
        for(const i of kill) p[i+3]=0; }
      g.putImageData(dd,0,0); }catch(e){}
    return c; }
  function fpLoad(){ if(FP.loading) return; FP.loading=true; gbLoad();
    const srcs={ bg:['fp_bg',0], bottle:['fp_bottle',620], logo:['fp_logo',540], shot:['fp_shot',440], jigger:['fp_jigger',440], rocks:['fp_rocks',440] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ FP.imgs[k]=srcs[k][1]?fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]):im; }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  // 잔 스펙: cap/target = ml (1oz=30ml). in = 잔 내부 영역(그린 크기 대비 비율)
  const FP_GLASS=[
    { key:'shot',   name:'SHOT GLASS / 1oz',  cap:45, target:30, h:146, in:{top:.225,bot:.665,hwT:.245,hwB:.155} },
    { key:'jigger', name:'JIGGER / 1.5oz',    cap:60, target:45, h:164, in:{top:.095,bot:.495,hwT:.205,hwB:.04} },
    { key:'rocks',  name:'ROCKS GLASS / 2oz', cap:90, target:60, h:170, in:{top:.195,bot:.655,hwT:.285,hwB:.245} } ];
  const FP_RATE=10; // ml/초 — 3초=1oz(30ml), 실제 스피드푸어러 카운트 속도
  function fpNoise(){ const a=ac(); if(!a) return null; try{
    const len=Math.floor(a.sampleRate*0.4), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
    const gn=a.createGain(); gn.gain.value=0.0001; src.connect(bp); bp.connect(gn); gn.connect(a.destination); src.start();
    const ret={ set:(on,f)=>{ if(window.__mute) on=false; const t=a.currentTime; gn.gain.setTargetAtTime(on?0.09:0.0001,t,0.05); bp.frequency.setTargetAtTime(650+f*950,t,0.08); },
      kill:()=>{ try{ src.stop(); }catch(e){} } };
    (window.__noises=window.__noises||[]).push(ret); return ret; }catch(e){ return null; } }
  // 한 판 = 3연속 챌린지: 샷 30ml → 지거 45ml → 록스 60ml
  // cfg: { blind:카운터 숨김 } / done(평균점수, txt, cls, 오차합, 오차배열)
  function engFreePour(cfg, done){
    fpLoad();
    const blind=!!cfg.blind;
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="fpb">HOLD TO POUR</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('fpb');
    const GX=200, GBASE=444;
    const BH=280, BW=BH*0.75, GRIPX=0.47, GRIPY=0.31, TIPX=0.415, TIPY=0.05;
    const IDLE={x:312,y:176,a:0.14}, POUR={x:197,y:150,a:-Math.PI}, DUR=9500;
    const LOGO_T=1150, INTRO=1900; // 첫 인트로: 로고 크게(~1.15초) → 병/잔 등장 → 1.9초부터 입력
    const eob=x=>{ const c=1.70158, f=x-1; return 1+f*f*((c+1)*f+c); }; // easeOutBack
    let pourIdx=0, g, GH, GW, gx0, gy0, inTop, inBot, target;
    function setGlass(i){ g=FP_GLASS[i]; target=g.target; GH=g.h; GW=g.h; gx0=GX-GW/2; gy0=GBASE-GH;
      inTop=gy0+g.in.top*GH; inBot=gy0+g.in.bot*GH; }
    setGlass(0);
    const pourErrs=[], pourScores=[];
    let ml=0, hold=false, released=false, finished=false, flip=0, lastTick=0;
    let stampObj=null, stampT=0, shake=0, settleT=0, dribble=0, tailTau=0.2, t0=0, lastT=0, raf=0;
    let armT=INTRO, glassPopT=LOGO_T, bannerUntil=0; // armT: t0 기준 입력 허용 시각
    const parts=[], streamPts=[]; const noise=fpNoise();
    const lvlY=v=>inBot-(inBot-inTop)*Math.min(1,v/g.cap);
    const hwAt=y=>{ const f=(inBot-y)/Math.max(1,inBot-inTop); return (g.in.hwB+(g.in.hwT-g.in.hwB)*f)*GW; };
    function pose(){ const e=flip*flip*(3-2*flip);
      return { x:IDLE.x+(POUR.x-IDLE.x)*e, y:IDLE.y+(POUR.y-IDLE.y)*e, a:IDLE.a+(POUR.a-IDLE.a)*e }; }
    function tip(){ const p=pose(), lx=(TIPX-GRIPX)*BW, ly=(TIPY-GRIPY)*BH, c=Math.cos(p.a), s=Math.sin(p.a);
      return { x:p.x+lx*c-ly*s, y:p.y+lx*s+ly*c }; }
    function burst(x,y,n,cols,pw){ for(let i=0;i<n;i++){ const a2=Math.random()*Math.PI*2, v=(0.4+Math.random())*(pw||1);
      parts.push({x,y,vx:Math.cos(a2)*95*v,vy:Math.sin(a2)*95*v-130*v,gv:430,r:2+Math.random()*3,c:cols[rnd(cols.length)],life:0.5+Math.random()*0.45}); } }
    function judge(){
      const err=ml-target, ae=Math.abs(err); let sc,txt,cls,quip;
      if(ml>=g.cap-0.01){ sc=0; txt='SPILL!'; cls='miss'; quip=['THE BOSS SAW THAT!!','The floor drank more…'][rnd(2)]; burst(GX,inTop,36,['#ffd977','#c87f1e','#d9544d'],1.3); }
      else if(ae<=1.0){ sc=100; txt='PERFECT!'; cls='perfect'; quip=['Godlike wrist!!','A true pro count','Chilling accuracy'][rnd(3)]; }
      else if(ae<=3.0){ sc=Math.round(95-(ae-1)*8); txt='GOOD'; cls='good'; quip=err<0?'Half a beat early':'Half a beat late'; }
      else if(ae<=6.0){ sc=Math.round(72-(ae-3)*7); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?'The guest is glaring…':'Got greedy…'; }
      else { sc=Math.max(0,Math.round(50-(ae-6)*4)); txt=err<0?'TOO SHY':'TOO MUCH'; cls='miss'; quip=err<0?"That's just a mist?":"That's a double!"; }
      stampObj={txt,cls,quip,err}; stampT=lastT;
      pourErrs.push(Math.min(ae,99.99)); pourScores.push(sc);
      if(cls==='perfect'){ flash('#6fcf8f'); sGood(); setTimeout(()=>beep(1320,0.14,'square',0.12),140); burst(GX,lvlY(ml),44,['#ffd977','#6fcf8f','#e6b450','#fff'],1.4); }
      else if(cls==='good') sGood();
      else { sBad(); shake=(txt==='SPILL!')?13:7; }
      setTimeout(()=>{ if(finished) return;
        if(pourIdx<2){ nextPour(); return; }
        finished=true; cleanup();
        const tot=pourErrs.reduce((a,b)=>a+b,0), avg=Math.round(pourScores.reduce((a,b)=>a+b,0)/3);
        let ftxt,fcls; if(tot<=3){ ftxt='MASTER ±'+tot.toFixed(1)+'ml'; fcls='perfect'; }   // 1위도 오차를 남긴다
        else if(tot<=9){ ftxt='±'+tot.toFixed(1)+'ml'; fcls='good'; }
        else { ftxt='±'+tot.toFixed(1)+'ml'; fcls='miss'; }
        done(avg,ftxt,fcls,tot,pourErrs.slice()); },1350);
    }
    function nextPour(){ pourIdx++; setGlass(pourIdx); streamPts.length=0;
      ml=0; lastTick=0; hold=false; released=false; flip=0; stampObj=null; dribble=0;
      t0=lastT; armT=700; glassPopT=0; bannerUntil=lastT+1000; beep(700,0.08); }
    function release(force){ if(released||finished) return; if(!hold&&!force) return;
      // 병이 돌아오는 동안 물줄기가 가늘어지며 잔여분이 더 들어간다 (매번 조금씩 다름, 약 1.7~2.4ml)
      released=true; hold=false; dribble=(flip>0.92)?FP_RATE:flip*3; tailTau=0.17+Math.random()*0.07;
      if(noise) noise.set(false,0); settleT=lastT; }
    function dn(e){ e.preventDefault(); ac(); if(finished||released||stampObj||!t0||now()-t0<armT) return;
      if(!hold){ hold=true; beep(500,0.05,'square',0.08); } }
    function up(e){ if(e&&e.cancelable) e.preventDefault(); release(false); }
    cv.addEventListener('pointerdown',dn); btn.addEventListener('pointerdown',dn);
    ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,up));
    function cleanup(){ cancelAnimationFrame(raf); if(noise) noise.kill();
      ['pointerup','pointercancel'].forEach(ev=>window.removeEventListener(ev,up)); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      flip+=((hold&&!released)?1:-1)*dt/0.28; flip=Math.max(0,Math.min(1,flip));
      const pouring=hold&&!released&&flip>0.92;
      if(pouring){ ml+=FP_RATE*dt; if(noise) noise.set(true,Math.min(1,ml/g.cap));
        if(Math.floor(ml/10)>Math.floor(lastTick/10)) beep(880,0.04,'square',0.1);
        lastTick=ml; if(ml>=g.cap){ ml=g.cap; release(true); } }
      else if(noise&&hold) noise.set(false,0);
      if(released&&!stampObj&&dribble>0.03){ ml+=dribble*dt; dribble*=Math.exp(-dt/tailTau);
        if(ml>=g.cap){ ml=g.cap; dribble=0; } }
      if(released&&!stampObj&&t-settleT>620) judge();
      if(!released&&!stampObj&&t-t0>armT+DUR) release(true);
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.freepour||FP.imgs.bg;

        ctx.drawImage(bgi,(400-bw2)/2,(480-bh2)/2,bw2,bh2); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }

      const gimg=FP.imgs[g.key];

        ctx.save(); ctx.translate(GX,GBASE); ctx.scale(s2,s2); ctx.drawImage(gimg,-GW/2,-GH,GW,GH); ctx.restore(); }
      if(ml>0.05){ const wA=pouring?2.0:(released?Math.max(0.4,2-(t-settleT)/350):0.8);
        const sy2=Math.max(inTop-2,lvlY(ml))+Math.sin(t/60)*wA;
        const hwS=hwAt(sy2), hwB2=g.in.hwB*GW;
        ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.88;
        const lg=ctx.createLinearGradient(0,sy2,0,inBot); lg.addColorStop(0,'#f6c14a'); lg.addColorStop(1,'#b96f14');
        ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(GX-hwS,sy2); ctx.lineTo(GX+hwS,sy2);
        ctx.lineTo(GX+hwB2,inBot); ctx.lineTo(GX-hwB2,inBot); ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.globalAlpha=0.7; ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.ellipse(GX,sy2,hwS,3,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      if(!blind&&!stampObj&&it>glassPopT+340){ const ty2=lvlY(target); ctx.strokeStyle='#e6b450'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
        ctx.beginPath(); ctx.moveTo(gx0-8,ty2); ctx.lineTo(gx0+GW+8,ty2); ctx.stroke(); ctx.setLineDash([]);
        ctx.font='8px "Press Start 2P"'; ctx.textAlign='right'; ctx.fillStyle='#e6b450'; ctx.fillText(target+'ml',gx0-12,ty2+3); }
      // ── 물줄기: 팁에서 방출된 액체 조각이 각자 중력 낙하 (병이 움직여도 이미 나온 액체는 제자리에서 떨어진다) ──
      const flow=pouring?FP_RATE:((released&&!stampObj)?dribble:0);
      const spout=flip>0.55; // 주둥이가 아래를 향할 때만 액체가 나온다 (세워지면 방출 중단, 공중 기둥만 낙하)
      if(spout&&flow>0.35){ const tp=tip(); streamPts.push({x:tp.x,y:tp.y+3,vy:110,w:0.7+flow*0.38}); }
      else if(flip>0.35&&flow>0.08&&Math.random()<0.5){ const tp=tip(); // 기울어진 주둥이 끝의 마지막 방울들
        parts.push({x:tp.x+(Math.random()*3-1.5),y:tp.y+4,vx:(Math.random()*2-1)*8,vy:70+Math.random()*50,gv:1100,r:1.4+Math.random()*1.4,c:'#ffd977',life:0.8}); }
      const surfY=(ml>0.05?lvlY(ml):inBot)-1;
      for(let i=streamPts.length-1;i>=0;i--){ const sp=streamPts[i]; sp.vy+=1500*dt; sp.y+=sp.vy*dt;
        if(sp.y>=surfY){ streamPts.splice(i,1); // 수면 도착 → 스플래시
          if(Math.random()<0.45) parts.push({x:sp.x+(Math.random()*8-4),y:surfY,vx:(Math.random()*2-1)*55,vy:-30-Math.random()*60,gv:520,r:1.4+Math.random()*1.5,c:'#ffd977',life:0.3}); } }
      if(streamPts.length){ const pts=streamPts.slice().sort((a,b)=>a.y-b.y);
        if(spout&&flow>0.35){ const tp=tip(); pts.unshift({x:tp.x,y:tp.y+2,vy:110,w:pts[0].w}); } // 아직 팁에 붙어있음
        pts.push({x:pts[pts.length-1].x,y:Math.min(surfY,pts[pts.length-1].y+pts[pts.length-1].vy*0.03),vy:pts[pts.length-1].vy,w:pts[pts.length-1].w});
        ctx.lineCap='round';
        for(let i=0;i<pts.length-1;i++){ const a2=pts[i], b2=pts[i+1];
          const ww=Math.max(0.8,((a2.w+b2.w)/2)*Math.sqrt(110/Math.max(110,(a2.vy+b2.vy)/2))); // 가속할수록 가늘게 (질량 보존)
          ctx.strokeStyle='#c87f1e'; ctx.lineWidth=ww+1.6; ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke();
          ctx.strokeStyle='#ffd977'; ctx.lineWidth=ww; ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke(); } }
      const bimg=FP.imgs.bottle;
      if(bimg){ const p=pose(); let off=0;
        if(pourIdx===0){ const be=Math.max(0,Math.min(1,(it-LOGO_T)/500)); off=(1-be)*(1-be)*160; }
        ctx.save(); ctx.translate(p.x+off,p.y); ctx.rotate(p.a+(hold?0:Math.sin(t/320)*0.02));
        ctx.drawImage(bimg,-GRIPX*BW,-GRIPY*BH,BW,BH); ctx.restore(); }
      for(let i=parts.length-1;i>=0;i--){ const pp=parts[i]; pp.life-=dt; if(pp.life<=0){ parts.splice(i,1); continue; }
        pp.vy+=pp.gv*dt; pp.x+=pp.vx*dt; pp.y+=pp.vy*dt;
        ctx.globalAlpha=Math.min(1,pp.life*2.5); ctx.fillStyle=pp.c; ctx.fillRect(pp.x-pp.r/2,pp.y-pp.r/2,pp.r,pp.r); }
      ctx.globalAlpha=1;
      // ── 첫 인트로: 로고 크게 → 병/잔 등장 ──
      if(pourIdx===0&&it<INTRO&&!stampObj){
        const lgi=FP.imgs.logo;
        if(it<LOGO_T){ ctx.fillStyle='rgba(0,0,0,0.58)'; ctx.fillRect(0,0,400,480);
          if(lgi){ const k=0.55+eob(Math.min(1,it/280))*0.45, lw=330*k, lh=lw*(lgi.height/lgi.width);
            ctx.drawImage(lgi,200-lw/2,228-lh/2,lw,lh); } }
        else { const f=Math.min(1,(it-LOGO_T)/500);
          ctx.fillStyle='rgba(0,0,0,'+(0.4*(1-f)).toFixed(3)+')'; ctx.fillRect(0,0,400,480);
          if(lgi&&f<1){ ctx.globalAlpha=1-f; const lw=330*(1-0.4*f), lh=lw*(lgi.height/lgi.width);
            ctx.drawImage(lgi,200-lw/2,(228-130*f)-lh/2,lw,lh); ctx.globalAlpha=1; } } }
      // 잔 이름 (등장/교체 직후)
      if(it>glassPopT&&it<glassPopT+1400&&!stampObj){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText(g.name,202,469); ctx.fillStyle='#ffd977'; ctx.fillText(g.name,200,467); }
      // 잔 교체 배너
      if(t<bannerUntil&&!stampObj){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,100,400,42);
        ctx.font='12px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('NEXT > '+g.name,202,127); ctx.fillStyle='#ffd977'; ctx.fillText('NEXT > '+g.name,200,125); }
      // ── ml 카운터 시계 ──
      if(!(pourIdx===0&&it<LOGO_T)){
        const cw=232,chh=62,cx0=200-cw/2,cy0=14;
        ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(cx0,cy0,cw,chh);
        ctx.strokeStyle=pouring?'#6fcf8f':'#333'; ctx.lineWidth=3; ctx.strokeRect(cx0,cy0,cw,chh);
        ctx.textAlign='center'; ctx.font='19px "Press Start 2P"';
        const mlTxt=(blind&&!stampObj)?'??.??':Math.min(ml,99.99).toFixed(2);
        ctx.fillStyle='#000'; ctx.fillText(mlTxt+'ml',202,cy0+32);
        ctx.fillStyle=pouring?'#ffd977':'#e8e6dd'; ctx.fillText(mlTxt+'ml',200,cy0+30);
        ctx.font='9px "Press Start 2P"';
        ctx.fillStyle='#6fcf8f'; ctx.fillText('TARGET '+target+'.00ml',200,cy0+50);
        ctx.textAlign='left'; ctx.fillStyle='#000'; ctx.fillText('POUR '+(pourIdx+1)+'/3',14,cy0+18);
        ctx.fillStyle='#e8e6dd'; ctx.fillText('POUR '+(pourIdx+1)+'/3',12,cy0+16);
        if(!released){ const tlf=Math.max(0,Math.min(1,1-(t-t0-armT)/DUR)); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,86,280,6);
          ctx.fillStyle=tlf<0.25?'#d9544d':'#3a7d4f'; ctx.fillRect(60,86,280*tlf,6); }
        if(pourErrs.length){ const tot=pourErrs.reduce((a,b)=>a+b,0); ctx.font='9px "Press Start 2P"'; ctx.textAlign='left';
          ctx.fillStyle='#000'; ctx.fillText('ERR ±'+tot.toFixed(2)+'ml',14,472);
          ctx.fillStyle='#8fd7a0'; ctx.fillText('ERR ±'+tot.toFixed(2)+'ml',12,470); } }
      if(stampObj){ const st2=(t-stampT)/1000;
        ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,198); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-st2*6)*1.5; ctx.scale(k2,k2);
        ctx.font='24px "Press Start 2P"'; ctx.textAlign='center';
        const col=stampObj.cls==='perfect'?'#6fcf8f':(stampObj.cls==='good'?'#e6b450':'#d9544d');
        ctx.fillStyle='#000'; ctx.fillText(stampObj.txt,3,3); ctx.fillStyle=col; ctx.fillText(stampObj.txt,0,0);
        ctx.restore();
        ctx.font='13px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText(ml.toFixed(2)+' / '+target+'.00ml',202,258);
        ctx.fillStyle='#fff'; ctx.fillText(ml.toFixed(2)+' / '+target+'.00ml',200,256);
        ctx.font='11px "Press Start 2P"'; ctx.fillStyle='#ffd977';
        ctx.fillText('ERROR ±'+Math.abs(stampObj.err).toFixed(2)+'ml',200,284);
        ctx.font='9px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(stampObj.quip,201,314); ctx.fillStyle='#e8e6dd'; ctx.fillText(stampObj.quip,200,313); }
    }
    raf=requestAnimationFrame(draw);
  }
  /* ── FREE POUR CHALLENGE: 30→45→60ml 3연속, 오차 합이 적은 순으로 순위 ── */
  let fpBest=parseFloat(localStorage.getItem('pine_freepour_best')||'NaN'), fpPlayers=[], fpCur=0;
  function fpBestShow(){ const el=$('fpBestVal'); if(el) el.textContent=isNaN(fpBest)?'—':('±'+fpBest.toFixed(2)+'ml'); }
  function startFpChallenge(){ mode='fp'; fpLoad(); fpPlayers=[]; for(let i=0;i<pn;i++) fpPlayers.push({name:'PLAYER '+(i+1),err:0,errs:[]});
    fpCur=0; fpTurn(); }
  function fpTurn(){ const p=fpPlayers[fpCur]; $('turnWho').textContent=p.name;
    $('turnMsg').innerHTML='FREE POUR CHALLENGE<br>30ml → 45ml → 60ml<br>Lowest total error wins'; show('turn'); $('hud').classList.add('hidden'); }
  function fpNext(){ const p=fpPlayers[fpCur];
    $('hudWho').textContent=p.name; $('hudRd').textContent='3 POURS'; $('hudSc').textContent='±0.00'; $('hud').classList.remove('hidden');

  function fpEndTurn(){ $('hud').classList.add('hidden'); fpCur++; if(fpCur<fpPlayers.length) fpTurn(); else fpFinal(); }
  function fpFinal(){
    const ranked=[...fpPlayers].sort((a,b)=>a.err-b.err), top=ranked[0].err;
    if(isNaN(fpBest)||top<fpBest){ fpBest=top; localStorage.setItem('pine_freepour_best',String(fpBest)); fpBestShow(); }

    ranked.forEach((p,i)=>{ const row=document.createElement('div'); row.className='rrow'+(i===0?' win':'');
      row.innerHTML='<span class="nm">'+(i===0?'<span class="crown">👑</span> ':'#'+(i+1)+' ')+p.name
        +'<span style="display:block;font-size:11px;color:var(--dim)">'+p.errs.map(e=>'±'+e.toFixed(1)).join(' · ')+'</span></span>'
        +'<span class="pt">±'+p.err.toFixed(2)+'ml</span>'; list.appendChild(row); });
    show('final'); sGood(); flash('#e6b450'); }

  /* ====================== ICE CARVING ====================== */
  // 연타로 게이지를 올려 얼음을 구로 깎고(안 누르면 빠르게 감소) 완성 존에서 완성! — 15초 동안 최대 개수
  const IC={ imgs:{}, loading:false, stages:null };
  function icLoad(){ if(IC.loading) return; IC.loading=true;
    const srcs={ ice:['ic_ice',900], pick:['ic_pick',520], broke:['ic_broke',420], logo:['ic_logo',560] };
    Object.keys(srcs).forEach(k=>{ const im=new Image();
      im.onload=()=>{ IC.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); if(k==='ice') icSegment(); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function icSegment(){ // 5단계 시트를 알파 열 스캔으로 자동 분리
    const c=IC.imgs.ice, w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data;
    const colHas=new Uint8Array(w);
    for(let cx=0;cx<w;cx++){ for(let cy=0;cy<h;cy++){ if(d[(cy*w+cx)*4+3]>30){ colHas[cx]=1; break; } } }
    const runs=[]; let s=-1;
    for(let cx=0;cx<=w;cx++){ const on=cx<w&&colHas[cx]; if(on&&s<0) s=cx; else if(!on&&s>=0){ if(cx-s>12) runs.push([s,cx]); s=-1; } }
    const rects=(runs.length===5)?runs:[0,1,2,3,4].map(i=>[Math.round(w*i/5),Math.round(w*(i+1)/5)]);
    IC.stages=rects.map(r=>{ let top=h-1,bot=0;
      for(let cy=0;cy<h;cy++){ for(let cx=r[0];cx<r[1];cx++){ if(d[(cy*w+cx)*4+3]>30){ if(cy<top)top=cy; if(cy>bot)bot=cy; break; } } }
      return {sx:r[0],sy:top,sw:r[1]-r[0],sh:Math.max(1,bot-top+1)}; }); }
  function engIceCarve(done){
    fpLoad(); icLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<button class="btn amber" id="icTap" style="width:min(200px,46vw);height:70px;font-size:16px">TAP!</button>'
      +'<button class="btn" id="icDone" style="width:min(140px,32vw);height:70px;font-size:13px">DONE!</button></div>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const ICEX=185, ICEY=392, ZONE=88, TOTAL=15000, ARM=1200, DECAY=38, TAPUP=5.25; // 게이지 40% 완화
    let gauge=0, count=0, stunUntil=0, strikeT=-1e9, brokeT=-1e9, popT=0, finished=false, ended=false;
    let t0=0, lastT=0, raf=0, shake=0, contactX=ICEX+22, contactY=ICEY-120, prevStage=0;
    const parts=[], flyBalls=[], msgs=[];
    const armed=()=>t0&&now()-t0>=ARM;
    function chip(n,px,py){ for(let i=0;i<n;i++) parts.push({x:px+(Math.random()*30-15),y:py+(Math.random()*20-10),
      vx:(Math.random()*2-1)*160,vy:-120-Math.random()*160,gv:900,r:2+Math.random()*2.5,c:['#dff1ff','#9fd2f5','#fff'][rnd(3)],life:0.45+Math.random()*0.3}); }
    function tap(e){ if(e)e.preventDefault(); ac(); if(!armed()||finished||now()<stunUntil||now()-t0-ARM>=TOTAL) return;
      gauge=Math.min(100,gauge+TAPUP); strikeT=now(); sTap(); beep(1450,0.03,'square',0.06);
      shake=Math.max(shake,2.2); chip(5,contactX,contactY); }
    function fin(e){ if(e)e.preventDefault(); ac(); if(!armed()||finished||now()<stunUntil||now()-t0-ARM>=TOTAL) return;
      if(gauge>=ZONE){ count++; gauge=0; popT=now(); sGood(); setTimeout(()=>beep(1400,0.1,'square',0.1),90);
        flyBalls.push({x:ICEX,y:ICEY-60,tx:22+((count-1)%12)*30,ty:66,t:now()});
        msgs.push({txt:'+1 BALL ICE!',t:now()}); flash('#6fcf8f'); }
      else { brokeT=now(); gauge=0; stunUntil=now()+600; shake=10; sBad(); msgs.push({txt:'SHATTERED!!',t:now(),bad:1}); } }
    const bT=$('icTap'), bD=$('icDone');
    bT.addEventListener('pointerdown',tap); bT.addEventListener('touchstart',tap,{passive:false});
    bD.addEventListener('pointerdown',fin); bD.addEventListener('touchstart',fin,{passive:false});
    function cleanup(){ cancelAnimationFrame(raf); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; popT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const it=t-t0, elapsed=Math.max(0,it-ARM), left=Math.max(0,TOTAL-elapsed);
      if(armed()&&!finished&&left>0&&t>=stunUntil) gauge=Math.max(0,gauge-DECAY*dt);
      if(!finished&&armed()&&left<=0){ finished=true;
        const sc=Math.min(100,count*22); const txt=count+' BALLS!';
        const cls=count>=5?'perfect':(count>=3?'good':'miss');
        setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,txt,cls); },1400); }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.icecarving||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,400,480);
      // 완성된 볼 컬렉션
      if(IC.stages){ const s5=IC.stages[4];
        for(let i=0;i<count;i++){ if(flyBalls.some(f=>f.slot===i)) continue;
          ctx.drawImage(IC.imgs.ice,s5.sx,s5.sy,s5.sw,s5.sh,22+(i%12)*30-13,66-13,26,26); }
        for(let i=flyBalls.length-1;i>=0;i--){ const f=flyBalls[i]; const p2=Math.min(1,(t-f.t)/450);
          if(f.slot==null) f.slot=count-1;
          const e2=1-(1-p2)*(1-p2), fx=f.x+(f.tx-f.x)*e2, fy=f.y+(f.ty-f.y)*e2-Math.sin(p2*Math.PI)*60;
          const fs=44-18*e2; ctx.drawImage(IC.imgs.ice,s5.sx,s5.sy,s5.sw,s5.sh,fx-fs/2,fy-fs/2,fs,fs);
          if(p2>=1) flyBalls.splice(i,1); } }
      // 얼음 (게이지에 따라 단계 변화 / 와장창 / 새 블록 팝)
      const stIdx=gauge>=ZONE?4:Math.min(3,Math.floor(gauge/22));
      if(IC.stages&&IC.imgs.ice){
        if(t-brokeT<520){ const bk=IC.imgs.broke; const bw2=170;
          ctx.drawImage(bk,ICEX-bw2/2,ICEY-bw2*0.72,bw2,bw2*(bk.height/bk.width)); prevStage=0; }
        else { const r=IC.stages[stIdx]; const maxH=Math.max(...IC.stages.map(q=>q.sh));
          let ih=150*(r.sh/maxH), iw=ih*(r.sw/r.sh);
          contactX=ICEX+iw*0.16; contactY=ICEY-ih+10; // 픽이 실제로 닿는 접촉점 (얼음 윗면)
          if(stIdx>prevStage&&t-popT>350){ // 단계가 깎여나가는 순간: 큰 조각 버스트
            beep(420,0.09,'square',0.12); shake=Math.max(shake,4);
            for(let j=0;j<14;j++) parts.push({x:ICEX+(Math.random()*iw-iw/2),y:ICEY-ih*Math.random(),
              vx:(Math.random()*2-1)*220,vy:-140-Math.random()*200,gv:900,r:2.5+Math.random()*3.5,
              c:['#dff1ff','#9fd2f5','#fff','#bfe6ff'][rnd(4)],life:0.5+Math.random()*0.4}); }
          if(stIdx!==prevStage) prevStage=stIdx;
          const pp=Math.min(1,(t-popT)/300); let sc2=pp>=1?1:Math.max(0.01,eob2(pp));
          if(t-strikeT<70) sc2*=1-0.07*Math.sin(Math.PI*(t-strikeT)/70); // 타격 스쿼시
          ctx.save(); ctx.translate(ICEX,ICEY); ctx.scale(sc2,sc2);
          ctx.drawImage(IC.imgs.ice,r.sx,r.sy,r.sw,r.sh,-iw/2,-ih,iw,ih); ctx.restore();

      const bgi=QT.imgs.bg||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }

      const rc=QT.imgs.receipt;

        ctx.fillText('PINE & CO - TAB',tx0,y); y+=9;

        const lh=lines.length>7?15:21;
        for(let i=0;i<Math.min(shown,lines.length);i++){ let nm=lines[i][0];
          let f=8; ctx.font=f+'px "Press Start 2P"';
          while(f>6&&ctx.measureText(nm).width>tx1-tx0-40){ f--; ctx.font=f+'px "Press Start 2P"'; }
          while(nm.length>4&&ctx.measureText(nm).width>tx1-tx0-40) nm=nm.slice(0,-1);

      // 정답 연출: CORRECT! 스탬프 + 확장 링

        const rr2=Math.min(1,wk/0.35);

      // 파티클

  /* ====================== SHAKE MASTER ====================== */

  const SM={ imgs:{}, loading:false };

  function engShakeMaster(done){
    fpLoad(); smLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="smStart">START</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('smStart');
    const TOTAL=13000;
    // 상태: title → ice(3프레임) → cap(2프레임+탁) → hold(안내) → cnt(3,2,1) → go → play → end
    let state='title', stT=0, count=0, wob=0, lastShakeT=0, playT0=0, finished=false, ended=false;
    let t0=0, lastT=0, raf=0, shake=0, sloshPh=0;
    const parts=[];
    function addShake(){ if(state!=='play'||finished) return;
      count++; wob=1; lastShakeT=now(); playShakerIce();
      for(let j=0;j<3;j++) parts.push({x:200+(Math.random()*80-40),y:250+(Math.random()*100-50),
        vx:(Math.random()*2-1)*160,vy:(Math.random()*2-1)*160,gv:500,r:1.6+Math.random()*1.8,c:['#bfe6ff','#fff','#dff1ff'][rnd(3)],life:0.35}); }
    let gotMotion=false, permMsg='';
    function onMotion(e){ gotMotion=true; let mag=null;
      const a=e.acceleration;
      if(a&&a.x!=null) mag=Math.hypot(a.x||0,a.y||0,a.z||0);
      else { const g=e.accelerationIncludingGravity; if(g&&g.x!=null) mag=Math.abs(Math.hypot(g.x||0,g.y||0,g.z||0)-9.81); }
      if(mag!=null&&mag>11&&now()-lastShakeT>130) addShake(); }
    function begin(){ btn.style.display='none'; permMsg=''; ac(); loadShaker(); state='ice'; stT=now();
      playFile('assets/sfx_glass_ice.mp3',1);
      try{ window.addEventListener('devicemotion',onMotion); }catch(e){} }
    // iOS는 사용자 제스처(click) 안에서 requestPermission을 불러야 수락 팝업이 뜸
    btn.addEventListener('click',e=>{ e.preventDefault(); if(state!=='title') return; ac();
      try{ if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
        DeviceMotionEvent.requestPermission().then(res=>{
          if(res==='granted') begin();
          else { permMsg='MOTION DENIED! ALLOW IN SETTINGS & RETRY'; sBad(); } })
        .catch(()=>{ permMsg='TAP START AGAIN TO ALLOW MOTION'; }); }
      else begin(); }catch(err){ begin(); } });
    // 탭 폴백 제거 — 실제 폰 흔들기(모션 센서)로만 카운트
    function cleanup(){ cancelAnimationFrame(raf); try{ window.removeEventListener('devicemotion',onMotion); }catch(e){} }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      // 상태 전이
      if(state==='ice'&&el2>=1200){ state='cap'; stT=t; beep(500,0.06,'square',0.1); }
      else if(state==='cap'&&el2>=900){ state='hold'; stT=t; beep(320,0.12,'square',0.12); shake=5; }
      else if(state==='hold'&&el2>=1700){ state='cnt'; stT=t; }
      else if(state==='cnt'&&el2>=1800){ state='go'; stT=t; flash('#6fcf8f');
        try{ const wh=new Audio('assets/sfx_whistle.mp3'); wh.volume=window.__mute?0:1; wh.play().catch(()=>{}); }catch(e){} }
      else if(state==='go'&&el2>=700){ state='play'; stT=t; playT0=t; }
      if(state==='cnt'){ const n=Math.floor(el2/600); if(n!==Math.floor((el2-dt*1000)/600)&&n<3){ beep(880,0.16,'square',0.34); setTimeout(()=>beep(880,0.1,'square',0.2),90); } }
      const left=state==='play'?Math.max(0,TOTAL-(t-playT0)):TOTAL;
      if(state==='play'&&left<=0&&!finished){ finished=true; playWhistle();
        const sc=Math.min(100,Math.round(count*1.6));
        const cls=count>=60?'perfect':(count>=35?'good':'miss');
        setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,count+' SHAKES!',cls); },1600); }
      wob=Math.max(0,wob-dt*3.2); shake=Math.max(0,shake-dt*26); sloshPh+=dt*(6+wob*30);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.shake||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.fillRect(0,0,400,480);
      // 본체 이미지 선택
      let img=null, sq=0;
      if(state==='ice'){ img=SM.imgs['ice'+Math.min(3,1+Math.floor(el2/400))]; }
      else if(state==='cap'){ img=el2<350?SM.imgs.cap1:(el2<700?SM.imgs.cap2:SM.imgs.closed); if(el2>=700) sq=Math.sin(Math.PI*Math.min(1,(el2-700)/200))*0.08; }
      else if(state!=='title'){ img=SM.imgs.closed; }
      if(img){ const ih=250, iw=ih*(img.width/img.height);
        const ox=(state==='play'&&wob>0.02)?Math.sin(t/26)*24*wob:0;
        const oy=(state==='play'&&wob>0.02)?Math.sin(t/19)*10*wob:0;
        const rot=(state==='play'&&wob>0.02)?Math.sin(t/23)*0.38*wob:(state==='play'?Math.sin(t/300)*0.02:0);
        ctx.save(); ctx.translate(200+ox,290+oy); ctx.rotate(rot); ctx.scale(1+sq,1-sq);
        ctx.drawImage(img,-iw/2,-ih*0.55,iw,ih); ctx.restore(); }
      // 파티클
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // 상태별 오버레이
      ctx.textAlign='center';
      if(state==='title'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        const lg2=SM.imgs.logo; if(lg2){ const k=1+Math.sin(t/400)*0.02, lw=360*k, lh=lw*(lg2.height/lg2.width);
          ctx.drawImage(lg2,200-lw/2,190-lh/2,lw,lh); }
        ctx.font='9px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('PRESS START TO ALLOW',201,363); ctx.fillText('THE MOTION SENSOR',201,383);
        ctx.fillStyle='#e8e6dd'; ctx.fillText('PRESS START TO ALLOW',200,362); ctx.fillText('THE MOTION SENSOR',200,382);
        if(permMsg){ ctx.font='8px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText(permMsg,201,411); ctx.fillStyle='#ff7a6a'; ctx.fillText(permMsg,200,410); } }
      if(state==='play'&&!gotMotion&&t-playT0>2500){ ctx.font='8px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('NO MOTION? CHECK SENSOR PERMISSION',201,411);
        ctx.fillStyle='#ff7a6a'; ctx.fillText('NO MOTION? CHECK SENSOR PERMISSION',200,410); }
      if(state==='hold'){ ctx.font='16px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('HOLD YOUR PHONE',203,133); ctx.fillText('WITH BOTH HANDS!',203,163);
        ctx.fillStyle='#ffd977'; ctx.fillText('HOLD YOUR PHONE',200,130); ctx.fillText('WITH BOTH HANDS!',200,160); }
      if(state==='cnt'){ const n=3-Math.floor(el2/600);
        ctx.font='64px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(String(n),205,145); ctx.fillStyle='#e8e6dd'; ctx.fillText(String(n),200,140); }
      if(state==='go'||(state==='play'&&t-playT0<900)){ ctx.font='17px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('SHAKE IT',203,113); ctx.fillText('LIKE CRAZY!!',203,143);
        ctx.fillStyle='#6fcf8f'; ctx.fillText('SHAKE IT',200,110); ctx.fillText('LIKE CRAZY!!',200,140); }
      if(state==='play'){ const secs=(left/1000).toFixed(1);
        ctx.font='26px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(String(count),204,68); ctx.fillStyle='#ffd977'; ctx.fillText(String(count),200,64);
        ctx.font='9px "Press Start 2P"'; ctx.fillStyle='#8a8d82'; ctx.fillText('SHAKES',200,84);
        ctx.font='14px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText(secs+'s',202,455); ctx.fillStyle=left<3500?'#d9544d':'#e8e6dd'; ctx.fillText(secs+'s',200,453);
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,462,280,6);

  /* ====================== STIR STOP ====================== */
  // 원을 그리며 저어라 — 저을수록 온도가 영하로 떨어진다. 목표 온도에 맞춰 SERVE! (멈추면 서서히 데워짐)
  const ST={ imgs:{}, loading:false };
  function stLoad(){ if(ST.loading) return; ST.loading=true;
    const srcs={ glass:['st_glass',420], ice1:['st_ice1',420], ice2:['st_ice2',420],
      top:['st_top',560], spoon:['st_spoon',560], logo:['st_logo',560] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ ST.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function engStirStop(done){
    fpLoad(); stLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>'
      +'<button class="btn amber bigbtn" id="stServe">SERVE!</button>';
    const cv=$('fpcv'), ctx=cv.getContext('2d'), btn=$('stServe');
    const CX=200, CY=272, GR=272, ARM=1100, TOTAL=22000;
    const target=-(15+rnd(26))/10; // -1.5 ~ -4.0
    let state='intro', stT=0, temp=20.0, omega=0, spoonA=Math.random()*6.28, liquidA=0, lastPtrA=null, dragging=false;
    let stampObj=null, stampT=0, t0=0, lastT=0, raf=0, shake=0, ended=false;
    const parts=[]; const noise=fpNoise();
    // 온도 → 음료 색: 상온 크림색 → 0도 근처 옅은 얼음색 → 영하로 갈수록 하늘색이 짙어짐
    function tempColor(tp){ let r,g,b;
      if(tp>=0){ const p=Math.min(1,(20-tp)/20); r=236-26*p; g=226+9*p; b=198+57*p; }
      else { const p=Math.min(1,-tp/8); r=210-140*p; g=235-75*p; b=255; }
      return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')'; }
    function ptrAngle(e){ const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width)-CX, y=(e.clientY-r.top)*(480/r.height)-CY;
      return Math.atan2(y,x); }
    function pdn(e){ e.preventDefault(); ac(); if(state!=='play') return; dragging=true; lastPtrA=ptrAngle(e); }
    function pmv(e){ if(e.cancelable)e.preventDefault(); if(!dragging||state!=='play') return;
      const a2=ptrAngle(e); if(lastPtrA!=null){ let d2=a2-lastPtrA;
        while(d2>Math.PI)d2-=6.283; while(d2<-Math.PI)d2+=6.283;
        omega=Math.max(-14,Math.min(14,omega+d2*4)); spoonA=a2; } lastPtrA=a2; } // 반대로 저으면 소용돌이가 상쇄되어 빨리 멈춤
    function pup(){ dragging=false; lastPtrA=null; }
    cv.addEventListener('pointerdown',pdn); cv.addEventListener('pointermove',pmv);
    window.addEventListener('pointerup',pup);
    function judge(){ if(state!=='play'||stampObj) return;
      const diff=Math.abs(temp-target), el3=(lastT-stT)/1000; let base,txt,cls,quip;
      if(diff<=0.3){ base=114; txt='PERFECT!'; cls='perfect'; quip='Diamond-clear and ice cold'; }
      else if(diff<=0.8){ base=100-diff*20; txt='GOOD'; cls='good'; quip=temp>target?'A touch warm':'A touch overchilled'; }
      else if(diff<=1.8){ base=76-diff*14; txt=temp>target?'TOO WARM':'OVER-CHILLED'; cls='miss'; quip=temp>target?'The guest wanted it colder…':'Watered it down…'; }
      else { base=46-diff*8; txt=temp>target?'TOO WARM':'OVER-DILUTED!'; cls='miss'; quip=temp>target?'That is room temp, chief':'That is meltwater now'; }
      const sc=Math.max(0,Math.min(100,Math.round(base-Math.max(0,el3-5)*3.5))); // 빠를수록 고득점 (5초 이후 초당 -3.5)
      stampObj={txt,cls,quip,el3}; stampT=lastT;
      if(cls==='perfect'){ flash('#6fcf8f'); sGood(); setTimeout(()=>beep(1320,0.14,'square',0.12),140);
        for(let j=0;j<30;j++) parts.push({x:CX+(Math.random()*160-80),y:CY+(Math.random()*160-80),vx:(Math.random()*2-1)*120,vy:-60-Math.random()*120,gv:400,r:1.6+Math.random()*2,c:['#bfe6ff','#fff','#6fcf8f'][rnd(3)],life:0.6}); }

    function draw(t){

        ctx.globalAlpha=Math.min(1,pp2.life*2.2); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // 색 비교 HUD — 숫자 없이 지금 색 vs 목표 색
      if(state==='play'||stampObj){
        const cw=248,chh=66,cx0=200-cw/2,cy0=12;
        ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(cx0,cy0,cw,chh);
        ctx.strokeStyle=omega>0.6?'#6fcf8f':'#333'; ctx.lineWidth=3; ctx.strokeRect(cx0,cy0,cw,chh);
        const near=Math.abs(temp-target)<=0.3;
        ctx.fillStyle=tempColor(temp); ctx.fillRect(cx0+14,cy0+10,100,30);
        ctx.strokeStyle=near?(Math.floor(t/140)%2?'#6fcf8f':'#eaffea'):'#000'; ctx.lineWidth=near?4:2;
        ctx.strokeRect(cx0+14,cy0+10,100,30);
        ctx.fillStyle=tempColor(target); ctx.fillRect(cx0+134,cy0+10,100,30);
        ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(cx0+134,cy0+10,100,30);
        ctx.textAlign='center'; ctx.font='8px "Press Start 2P"';
        ctx.fillStyle='#e8e6dd'; ctx.fillText('NOW',cx0+64,cy0+56);

        if(temp>5){ ctx.font='13px "Press Start 2P"'; ctx.textAlign='center';
          const tt=temp.toFixed(2)+'\u00B0C';
          ctx.fillStyle='#000'; ctx.fillText(tt,cx0+66,cy0+32);
          ctx.fillStyle='#1a1208'; ctx.fillText(tt,cx0+64,cy0+30); }
        if(state==='play'&&!stampObj){ const tl2=Math.max(0,1-(t-stT)/TOTAL);
          ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(60,84,280,6);
          ctx.fillStyle=tl2<0.25?'#d9544d':'#3a7d4f'; ctx.fillRect(60,84,280*tl2,6);
          const el4=((t-stT)/1000).toFixed(1); ctx.font='11px "Press Start 2P"'; ctx.textAlign='right';
          ctx.fillStyle='#000'; ctx.fillText(el4+'s',392,106); ctx.fillStyle='#ffd977'; ctx.fillText(el4+'s',390,104); } }
      if(state==='play'&&!stampObj&&t-stT<2600){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#000'; ctx.fillText('DRAG IN CIRCLES TO STIR!',201,451); ctx.fillStyle='#e8e6dd'; ctx.fillText('DRAG IN CIRCLES TO STIR!',200,450); }
      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,400,480);
        const lgi=ST.imgs.logo; if(lgi){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=340*k, lh=lw*(lgi.height/lgi.width);
          ctx.drawImage(lgi,200-lw/2,215-lh/2,lw,lh); } }
      if(stampObj){ const st2=(t-stampT)/1000;
        ctx.fillStyle='rgba(0,0,0,0.42)'; ctx.fillRect(0,0,400,480);
        ctx.save(); ctx.translate(200,205); ctx.rotate(-0.06);
        const k2=1+Math.max(0,1-st2*6)*1.4; ctx.scale(k2,k2);

        ctx.fillStyle='#000'; ctx.fillText(stampObj.txt,3,3); ctx.fillStyle=col; ctx.fillText(stampObj.txt,0,0); ctx.restore();
        // 결과: 색 비교 칩 (숫자 대신)
        ctx.fillStyle=tempColor(temp); ctx.fillRect(114,238,80,26);
        ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(114,238,80,26);
        ctx.fillStyle=tempColor(target); ctx.fillRect(206,238,80,26); ctx.strokeRect(206,238,80,26);
        ctx.font='8px "Press Start 2P"'; ctx.textAlign='center';
        ctx.fillStyle='#e8e6dd'; ctx.fillText('YOURS',154,280); ctx.fillStyle='#6fcf8f'; ctx.fillText('TARGET',246,280);
        // 저을 때는 가려진 온도를, SERVE 뒤에는 숫자로 보여준다

        ctx.fillStyle='#e8e6dd'; ctx.fillText(temp.toFixed(2)+'\u00B0',154,298);
        ctx.fillStyle='#000'; ctx.fillText(target.toFixed(2)+'\u00B0',247,299);
        ctx.fillStyle='#6fcf8f'; ctx.fillText(target.toFixed(2)+'\u00B0',246,298);

        ctx.fillStyle='#000'; ctx.fillText(_ds,202,322); ctx.fillStyle=_dc; ctx.fillText(_ds,200,320);
        ctx.font='11px "Press Start 2P"';
        ctx.fillStyle='#000'; ctx.fillText('TIME '+stampObj.el3.toFixed(1)+'s',202,344);
        ctx.fillStyle='#ffd977'; ctx.fillText('TIME '+stampObj.el3.toFixed(1)+'s',200,342);
        ctx.font='9px "Press Start 2P"';

  /* ====================== FLY SWAT ====================== */
  // 과일 바구니에 꼬이는 파리들을 탭 사격으로 잡아라 — 인트로: 큰 파리가 윙윙 돌다 바구니에 앉는 순간 펑!
  const FS={ imgs:{}, loading:false };
  function fsLoad(){ if(FS.loading) return; FS.loading=true;
    const srcs={ logo:['fs_logo',600], bigfly:['fs_bigfly',420], fly1:['fs_fly1',260], fly2:['fs_fly2',260],
      basket:['fs_basket',520], basket2:['fs_basket2',520], basket3:['fs_basket3',520] };
    Object.keys(srcs).forEach(k=>{ const im=new Image(); im.onload=()=>{ FS.imgs[k]=fpKey(im,srcs[k][1],srcs[k][2],srcs[k][3]); }; im.src='assets/'+srcs[k][0]+'.png'; }); }
  function fsBuzz(){ const a=ac(); if(!a) return null; try{
    const o=a.createOscillator(), g=a.createGain(); o.type='sawtooth'; o.frequency.value=170;
    g.gain.value=0.0001; o.connect(g); g.connect(a.destination); o.start();
    const ret={ set:(on,f)=>{ if(window.__mute) on=false; const t=a.currentTime; g.gain.setTargetAtTime(on?0.035:0.0001,t,0.06); o.frequency.setTargetAtTime(f,t,0.05); },
      kill:()=>{ try{ o.stop(); }catch(e){} } };
    (window.__noises=window.__noises||[]).push(ret); return ret; }catch(e){ return null; } }
  function engFlySwat(done){
    fpLoad(); fsLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const BX=200, BY=352, TOTAL=25000;
    let state='cine', stT=0, pts=0, nextSpawn=0, finished=false, ended=false;
    let t0=0, lastT=0, raf=0, shake=0, crossT=-1e9, crossX=0, crossY=0, popped=false, fruitHP=100, hpStage=0;
    const flies=[], parts=[], pops=[]; const buzz=fsBuzz();
    function spawnFly(elapsed){ // 전부 날파리 (로고 파리는 인트로 전용)
      const side=rnd(4); let x,y;
      if(side===0){ x=-20; y=100+Math.random()*250; } else if(side===1){ x=420; y=100+Math.random()*250; }
      else if(side===2){ x=Math.random()*400; y=80; } else { x=Math.random()*400; y=470; }
      flies.push({x,y,vx:0,vy:0,tx:BX+(Math.random()*160-80),ty:290+(Math.random()*70-30),
        sit:0,sp:90+Math.random()*55,ph:Math.random()*6.28}); }
    function shoot(e){ e.preventDefault(); ac(); if(state!=='play'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      crossX=x; crossY=y; crossT=now(); shake=Math.max(shake,2.5);
      beep(140,0.07,'sawtooth',0.16); setTimeout(()=>beep(90,0.05,'sawtooth',0.08),40);
      let best=-1, bd=1e9;
      for(let i=0;i<flies.length;i++){ const f=flies[i]; const d2=Math.hypot(f.x-x,f.y-y);
        if(d2<32&&d2<bd){ bd=d2; best=i; } }
      if(best>=0){ const f=flies[best]; flies.splice(best,1);
        pts++; sGood();
        pops.push({txt:'+1',x:f.x,y:f.y,t:now()});
        for(let j=0;j<10;j++) parts.push({x:f.x,y:f.y,vx:(Math.random()*2-1)*180,vy:(Math.random()*2-1)*180,
          gv:400,r:1.8+Math.random()*2.2,c:['#7a9c3a','#4a6b1f','#2a2a2a'][rnd(3)],life:0.4}); }
      else { for(let j=0;j<4;j++) parts.push({x,y,vx:(Math.random()*2-1)*60,vy:-30-Math.random()*50,gv:400,r:1.4+Math.random()*1.4,c:'#8a8d82',life:0.25}); } }
    cv.addEventListener('pointerdown',shoot);
    function cleanup(){ cancelAnimationFrame(raf); if(buzz) buzz.kill(); }
    // 인트로 큰 파리 경로
    let cfx=430, cfy=120, cfr=1.6;
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='cine'){
        if(el2<2600){ // 윙윙 돌아다님 (리사주 경로)
          cfx=200+Math.sin(el2/500)*150+Math.sin(el2/173)*24;
          cfy=175+Math.sin(el2/340+1.3)*90+Math.sin(el2/121)*14;
          cfr=1.55-Math.min(1,el2/2600)*0.75;
          if(buzz) buzz.set(true,150+Math.sin(el2/90)*30); }
        else if(el2<3300){ const p2=(el2-2600)/700; const e2=1-(1-p2)*(1-p2); // 바구니로 착지
          cfx=cfx+((BX+18)-cfx)*e2*0.25; cfy=cfy+((BY-70)-cfy)*e2*0.25; cfr=0.8-0.25*p2;
          if(buzz) buzz.set(true,130-p2*40); }
        else if(!popped){ popped=true; if(buzz) buzz.set(false,100); // 펑!
          flash('#d9544d'); sBad(); beep(60,0.2,'sawtooth',0.2); shake=12;
          for(let j=0;j<30;j++) parts.push({x:cfx,y:cfy,vx:(Math.random()*2-1)*260,vy:(Math.random()*2-1)*260,
            gv:400,r:2+Math.random()*3.5,c:['#7a9c3a','#4a6b1f','#d9544d','#2a2a2a'][rnd(4)],life:0.55}); }
        if(el2>=3900){ state='play'; stT=t; nextSpawn=t+300; } }
      if(state==='play'&&!finished){
        const elapsed=t-stT, left=Math.max(0,TOTAL-elapsed), rush=elapsed>TOTAL-4200;
        if(t>=nextSpawn&&flies.length<(rush?26:Math.min(20,5+Math.floor(elapsed/700)))){ // 어마어마한 물량 습격
          spawnFly(elapsed); if(Math.random()<0.55) spawnFly(elapsed);
          nextSpawn=t+(rush?100:220-elapsed/TOTAL*90)+rnd(50); }
        // 파리 이동
        for(const f of flies){
          if(f.sit>0){ f.sit-=dt; if(f.sit<=0){ f.tx=BX+(Math.random()*240-120); f.ty=140+Math.random()*160; } continue; }
          const dx=f.tx-f.x, dy=f.ty-f.y, d2=Math.hypot(dx,dy);
          if(d2<16){ if(f.ty>250&&Math.random()<0.5){ f.sit=0.7+Math.random(); f.vx=0; f.vy=0; }
            else { f.tx=BX+(Math.random()*220-110); f.ty=150+Math.random()*180; } }
          else { const sp=f.sp; f.vx+=(dx/d2*sp-f.vx)*dt*4; f.vy+=(dy/d2*sp-f.vy)*dt*4;
            f.x+=f.vx*dt+Math.sin(t/60+f.ph)*36*dt; f.y+=f.vy*dt+Math.cos(t/47+f.ph)*30*dt; } }
        if(buzz) buzz.set(flies.length>0,140+flies.length*12+Math.sin(t/90)*20);
        // 과일 HP: 앉아있는 파리가 갉아먹는다
        let sitters=0; for(const f of flies) if(f.sit>0) sitters++;
        fruitHP=Math.max(0,fruitHP-sitters*2.0*dt);
        const stg=fruitHP>60?0:(fruitHP>25?1:2);
        if(stg!==hpStage){ hpStage=stg; beep(180,0.15,'sawtooth',0.12); shake=Math.max(shake,5);
          for(let j=0;j<12;j++) parts.push({x:BX+(Math.random()*160-80),y:280+Math.random()*60,
            vx:(Math.random()*2-1)*50,vy:-30-Math.random()*50,gv:0,r:2+Math.random()*2,c:'#7a9c3a',life:0.7}); }
        if(fruitHP<=0&&left>600){ finished=true; if(buzz) buzz.set(false,100); flash('#d9544d'); sBad(); shake=10; // 시간 종료 직전엔 RUINED 대신 정상 종료
          const sc=Math.min(40,pts);
          setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,'FRUIT RUINED!','miss'); },1500); }
        else if(left<=0){ finished=true; if(buzz) buzz.set(false,100);
          const sc=Math.min(100,Math.round(pts*1.5)), cls=pts>=55?'perfect':(pts>=32?'good':'miss'); // 25초 기준
          setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,pts+' FLIES!',cls); },1500); } }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.flyswat||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.34)'; ctx.fillRect(0,0,400,480);
      // 바 상판 (바구니가 올려진 카운터)
      const ct2=ctx.createLinearGradient(0,376,0,396); ct2.addColorStop(0,'#7a5a34'); ct2.addColorStop(1,'#4e3620');
      ctx.fillStyle=ct2; ctx.fillRect(0,376,400,20);
      ctx.fillStyle='#8a6a40'; ctx.fillRect(0,376,400,3);
      const cf3=ctx.createLinearGradient(0,396,0,480); cf3.addColorStop(0,'#3a2817'); cf3.addColorStop(1,'#1d1206');
      ctx.fillStyle=cf3; ctx.fillRect(0,396,400,84);
      // 과일 바구니 (HP 단계에 따라 상해간다)
      const bk=hpStage===0?FS.imgs.basket:(hpStage===1?FS.imgs.basket2:FS.imgs.basket3)||FS.imgs.basket;
      if(bk){ const bw2=225, bh2=bw2*(bk.height/bk.width); ctx.drawImage(bk,BX-bw2/2,BY-bh2+40,bw2,bh2); }
      // 인트로 큰 파리
      if(state==='cine'&&!popped){ const bf=FS.imgs.bigfly;
        if(bf){ const fw=150*cfr, fh=fw*(bf.height/bf.width);
          ctx.save(); ctx.translate(cfx,cfy); ctx.rotate(Math.sin(t/70)*0.12);

          ctx.drawImage(bf,-fw/2,-fh/2,fw,fh); ctx.restore(); } }
      // 파리들
      for(const f of flies){ const im=f.sit>0?FS.imgs.fly2:(Math.floor(t/60+f.ph*10)%2?FS.imgs.fly1:FS.imgs.fly2);
        if(!im) continue; const fw=34, fh=fw*(im.height/im.width);
        ctx.save(); ctx.translate(f.x,f.y);

        ctx.drawImage(im,-fw/2,-fh/2,fw,fh); ctx.restore(); }
      // 파티클/팝업

  /* ====================== ORDER UP! ====================== */

  function engOrderUp(done){

    const PW=460, PX=-30, PY=22, SFX0=0.118, SFX1=0.772, SFY0=0.262, SFY1=0.832;
    let state='intro', stT=0, round=1, seq=[], showIdx=0, input=[], cleared=0;
    let stampObj=null, stampT=0, wrongCk=-1, t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false;
    let best=parseInt(localStorage.getItem('pine_orderup_best')||'0')||0;
    const parts=[];
    function newRound(){ const n=3+round; seq=[]; for(let i=0;i<n;i++) seq.push(rnd(10));

        const ps=OU.imgs.pos;

  /* ====================== WHERE IS MY SHOT? ====================== */
  // 야바위: 샷잔이 뚜껑에 숨고 섞인다 — 맞히면 다음 라운드(뚜껑 2→5개, 점점 빠름), 틀리면 끝
  const WS={ imgs:{}, loading:false };

  function engWhereShot(done){
    fpLoad(); wsLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const CY=318, ARM=1300;
    let state='intro', stT=0, round=1, nCups=2, shotAt=0, picked=-1, cleared=0;
    let cups=[], swaps=[], swapI=0, swapT=0, swapDur=420, lift=0;
    let t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false;
    let best=parseInt(localStorage.getItem('pine_wis_best')||'0')||0;
    const parts=[];
    function cupX(slot,n){ const sp=Math.min(96,340/Math.max(1,n-1)); return 200+(slot-(n-1)/2)*sp; }
    function cupW(n){ return Math.min(96,340/Math.max(1,n-1))-6<74?68:88; }
    function newRound(){ nCups=Math.min(5,1+round); shotAt=rnd(nCups); picked=-1;
      cups=[]; for(let i=0;i<nCups;i++) cups.push({slot:i});
      const nSw=2+round*2; swaps=[]; swapDur=Math.max(170,460-round*55);
      for(let i=0;i<nSw;i++){ let a=rnd(nCups),b; do{ b=rnd(nCups); }while(b===a); swaps.push([a,b]); }
      swapI=0; state='place'; stT=lastT; lift=1; beep(520,0.08,'square',0.1); }
    function tap(e){ e.preventDefault(); ac(); if(state!=='pick'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      const cw2=cupW(nCups);
      for(let s=0;s<nCups;s++){ const cx2=cupX(s,nCups);
        if(Math.abs(x-cx2)<cw2/2+8&&y>CY-90&&y<CY+30){ picked=s; state='reveal'; stT=lastT;
          if(s===shotAt){ cleared=round; sGood(); flash('#6fcf8f');
            for(let j=0;j<16;j++) parts.push({x:cx2,y:CY-40,vx:(Math.random()*2-1)*130,vy:-70-Math.random()*130,gv:500,r:2+Math.random()*2.4,c:['#ffd977','#6fcf8f','#fff'][rnd(3)],life:0.5}); }
          else { finished=true; sBad(); flash('#d9544d'); shake=9;
            if(cleared>best){ best=cleared; localStorage.setItem('pine_wis_best',String(best)); }
            const sc=Math.min(100,cleared*22), cls=cleared>=4?'perfect':(cleared>=2?'good':'miss');
            setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,'ROUND '+round+' KO',cls); },2300); }
          return; } } }
    cv.addEventListener('pointerdown',tap);
    function cleanup(){ cancelAnimationFrame(raf); }
    function slotNow(i){ // 셔플 애니메이션 중 커버 i의 현재 x (슬롯 교환 보간)
      return cupX(cups[i].slot,nCups); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM) newRound();
      if(state==='place'&&el2>=2100){ state='shuffle'; stT=t; swapT=t; }

        if(t-swapT>=swapDur){ const [a,b]=swaps[swapI]; // 슬롯 교환 확정

          if(shotAt===a) shotAt=b; else if(shotAt===b) shotAt=a;
          swapI++; swapT=t; beep(280+rnd(60),0.04,'square',0.07);
          if(swapI>=swaps.length){ state='pick'; stT=t; beep(900,0.1,'square',0.1); } } }
      if(state==='reveal'&&picked===shotAt&&el2>=1400){ round++; newRound(); }
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.whereshot||FP.imgs.bg;
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.34)'; ctx.fillRect(0,0,400,480);
      // 카운터 상판
      const ct3=ctx.createLinearGradient(0,CY+8,0,CY+30); ct3.addColorStop(0,'#7a5a34'); ct3.addColorStop(1,'#4e3620');
      ctx.fillStyle=ct3; ctx.fillRect(0,CY+8,400,22);
      ctx.fillStyle='#8a6a40'; ctx.fillRect(0,CY+8,400,3);
      const cf4=ctx.createLinearGradient(0,CY+30,0,480); cf4.addColorStop(0,'#3a2817'); cf4.addColorStop(1,'#1a1005');
      ctx.fillStyle=cf4; ctx.fillRect(0,CY+30,400,480-CY-30);
      if(state!=='intro'){
        const cw2=cupW(nCups), sh2=WS.imgs.shot, cvr=WS.imgs.cover;
        // 샷잔 (배치/공개 때 보임)
        const showShot=state==='place'||(state==='reveal');
        if(sh2&&showShot){ const sx2=cupX(shotAt,nCups), ssz=cw2*0.62;
          ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#000';
          ctx.beginPath(); ctx.ellipse(sx2,CY+12,ssz*0.42,7,0,0,6.283); ctx.fill(); ctx.restore();
          ctx.drawImage(sh2,sx2-ssz/2,CY-ssz+12,ssz,ssz*(sh2.height/sh2.width)); }
        // 뚜껑들
        if(cvr){ for(let i=0;i<cups.length;i++){ const c=cups[i]; let cx2=cupX(c.slot,nCups), lY=0, sc3=1;
          // 셔플 이동 보간
          if(state==='shuffle'&&swapI<swaps.length){ const [a,b]=swaps[swapI]; const p2=Math.min(1,(t-swapT)/swapDur);
            const e2=0.5-0.5*Math.cos(p2*Math.PI);
            if(c.slot===a){ cx2=cupX(a,nCups)+(cupX(b,nCups)-cupX(a,nCups))*e2; lY=-Math.sin(p2*Math.PI)*13; }
            else if(c.slot===b){ cx2=cupX(b,nCups)+(cupX(a,nCups)-cupX(b,nCups))*e2; lY=Math.sin(p2*Math.PI)*10; } }
          // 배치 단계: 뚜껑이 내려와 덮음 / 공개: 선택 뚜껑(+정답 뚜껑) 들림
          if(state==='place'){ const p2=Math.min(1,Math.max(0,(el2-600)/500)); lY=-(1-eob2(p2))*140; } // 샷 먼저 보여주고 뚜껑이 내려와 덮음
          if(state==='reveal'){ const p2=Math.min(1,el2/300);
            if(c.slot===picked) lY=-eob2(p2)*95;
            if(finished&&c.slot===shotAt) lY=-eob2(Math.max(0,Math.min(1,(el2-350)/300)))*95; }
          if(state==='pick'){ lY=Math.sin(t/300+i)*2; }
          const ch2=cw2*(cvr.height/cvr.width);
          ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
          ctx.beginPath(); ctx.ellipse(cx2,CY+14,cw2*0.46,8,0,0,6.283); ctx.fill(); ctx.restore();
          ctx.drawImage(cvr,cx2-cw2/2,CY-ch2+16+lY,cw2,ch2); } } }
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD
      if(state!=='intro'){ ctx.font='10px "Press Start 2P"'; ctx.textAlign='left';
        ctx.fillStyle='#000'; ctx.fillText('ROUND '+round,14,30); ctx.fillStyle='#ffd977'; ctx.fillText('ROUND '+round,12,28);
        ctx.textAlign='right';
        ctx.fillStyle='#000'; ctx.fillText('BEST '+best,390,30); ctx.fillStyle='#8a8d82'; ctx.fillText('BEST '+best,388,28);
        ctx.textAlign='center'; ctx.font='11px "Press Start 2P"';
        const msg=(state==='place'&&el2<1100)?'WATCH THE SHOT!':(state==='shuffle'?'FOLLOW IT!':(state==='pick'?'WHERE IS IT? TAP!':''));
        if(msg){ ctx.fillStyle='#000'; ctx.fillText(msg,202,142); ctx.fillStyle='#ffd977'; ctx.fillText(msg,200,140); }
        if(state==='place'&&el2>=1150){ const k2=1+Math.max(0,1-(el2-1150)/180)*1.4; // 뚜껑이 덮이면 FIND IT! 팝
          ctx.save(); ctx.translate(200,150); ctx.rotate(-0.05); ctx.scale(k2,k2);
          ctx.font='24px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText('FIND IT!',3,3); ctx.fillStyle='#ffd977'; ctx.fillText('FIND IT!',0,0); ctx.restore(); } }
      if(state==='intro'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,480);
        const lg2=WS.imgs.logo; if(lg2){ const k=0.55+eob2(Math.min(1,el2/280))*0.45, lw=330*k, lh=lw*(lg2.height/lg2.width);
          ctx.drawImage(lg2,200-lw/2,215-lh/2,lw,lh); } }
      if(state==='reveal'){ ctx.font='18px "Press Start 2P"'; ctx.textAlign='center';
        if(picked===shotAt){ ctx.save(); ctx.translate(200,180); ctx.rotate(-0.05);
          const k2=1+Math.max(0,1-el2/160)*1.3; ctx.scale(k2,k2);
          ctx.fillStyle='#000'; ctx.fillText('FOUND IT!',3,3); ctx.fillStyle='#6fcf8f'; ctx.fillText('FOUND IT!',0,0); ctx.restore(); }
        else { ctx.save(); ctx.translate(200,180); ctx.rotate(-0.06);
          const k2=1+Math.max(0,1-el2/180)*1.4; ctx.scale(k2,k2);
          ctx.fillStyle='#000'; ctx.fillText('NOT THERE!',3,3); ctx.fillStyle='#d9544d'; ctx.fillText('NOT THERE!',0,0); ctx.restore();
          ctx.font='12px "Press Start 2P"';
          ctx.fillStyle='#000'; ctx.fillText('ROUNDS CLEARED: '+cleared,202,432); ctx.fillStyle='#ffd977'; ctx.fillText('ROUNDS CLEARED: '+cleared,200,430); } }
    }
    raf=requestAnimationFrame(draw);
  }

  /* ====================== FRESH SQUEEZE ====================== */
  // 라임을 가져와 썰고, 반쪽을 스퀴저에 넣고 눌러 짜서 계량컵을 채워라 — 30초, 라임 1개=50ml
  const SQ={ imgs:{}, loading:false };
  function sqLoad(){ if(SQ.loading) return; SQ.loading=true;
    const names=['basket','board','closed','cup','half','lime','logo','open','spent','trash'];
    names.forEach(k=>{ const im=new Image(); im.onload=()=>{ SQ.imgs[k]=fpKey(im,k==='logo'?560:400,185,k==='logo'); }; im.src='assets/sq_'+k+'.png'; }); }
  function engSqueeze(done){
    fpLoad(); sqLoad();
    stage.innerHTML='<canvas id="fpcv" width="400" height="480"></canvas>';
    const cv=$('fpcv'), ctx=cv.getContext('2d');
    const ARM=1300, TOTAL=30000;
    // 스테이션 좌표
    const BK={x:58,y:300}, BD={x:175,y:398}, SZ={x:292,y:186}, CUP={x:319,y:306}, TR={x:334,y:492}; // 도마=하단 식탁 위, 바구니=도마 왼쪽, 휴지통=하단에 머리 크게
    let state='intro', stT=0, phase='grab', halves=0, ml=0, shownMl=0, pressT=-1e9, cutT=-1e9;
    let flyObj=null; // {img,from,to,t,cb}
    let t0=0, lastT=0, raf=0, shake=0, finished=false, ended=false, ptr=null;
    const parts=[];
    function fly(img,from,to,cb){ flyObj={img,fx:from.x,fy:from.y,tx:to.x,ty:to.y,t:now(),cb}; beep(500,0.05,'square',0.08); }
    let drag=null; // 드래그 중인 오브젝트 {kind,x,y}
    function dn(e){ e.preventDefault(); ac(); if(state!=='play'||finished) return;
      const r=cv.getBoundingClientRect();
      const x=(e.clientX-r.left)*(400/r.width), y=(e.clientY-r.top)*(480/r.height);
      const near=(p,rad)=>Math.hypot(x-p.x,y-p.y)<rad;
      if(phase==='grab'&&near(BK,80)){ drag={kind:'lime',x,y}; beep(500,0.04,'square',0.07); return; }
      if(phase==='load'&&near(BD,90)){ drag={kind:'half',x,y}; beep(500,0.04,'square',0.07); return; }
      if(phase==='trash'&&near(SZ,100)){ drag={kind:'spent',x,y}; beep(400,0.04,'square',0.07); return; }
      ptr={x,y}; }
    function mv(e){ if(!drag) return; if(e.cancelable) e.preventDefault();
      const r=cv.getBoundingClientRect();
      drag.x=(e.clientX-r.left)*(400/r.width); drag.y=(e.clientY-r.top)*(480/r.height); }
    function up(e){ if(e&&e.cancelable) e.preventDefault();
      if(drag){ const d0=drag; drag=null;
        const near=(p,rad)=>Math.hypot(d0.x-p.x,d0.y-p.y)<rad;
        if(d0.kind==='lime'&&near(BD,90)){ phase='cut'; beep(720,0.06,'square',0.1); }
        else if(d0.kind==='half'&&near(SZ,105)){ phase='press'; beep(720,0.06,'square',0.1); }
        else if(d0.kind==='spent'&&near(TR,85)){ beep(220,0.06,'square',0.1);
          for(let j=0;j<6;j++) parts.push({x:TR.x,y:TR.y-30,vx:(Math.random()*2-1)*60,vy:-40-Math.random()*60,gv:500,r:1.6+Math.random()*1.6,c:'#8a8d82',life:0.35});
          halves--; phase=halves>0?'load':'grab'; }
        return; }
      if(!ptr||state!=='play'||finished){ ptr=null; return; }
      const r=cv.getBoundingClientRect();
      const ex=(e.clientX-r.left)*(400/r.width), ey=(e.clientY-r.top)*(480/r.height);
      const dx=ex-ptr.x, dy=ey-ptr.y, sx=ptr.x, sy=ptr.y; ptr=null;
      const near=(p,rad)=>Math.hypot(sx-p.x,sy-p.y)<rad||Math.hypot(ex-p.x,ey-p.y)<rad;
      if(phase==='cut'&&Math.abs(dx)>36&&near(BD,100)){ cutT=now(); halves=2; phase='load';
        beep(1200,0.05,'square',0.1); setTimeout(()=>beep(700,0.05,'square',0.08),60); shake=Math.max(shake,2.5);
        for(let j=0;j<8;j++) parts.push({x:BD.x,y:BD.y-20,vx:(Math.random()*2-1)*120,vy:-60-Math.random()*100,gv:600,r:1.5+Math.random()*1.8,c:['#cbe36a','#eef6d8'][rnd(2)],life:0.4}); }
      else if(phase==='press'&&dy>36&&near(SZ,115)){ pressT=now(); phase='pressing';
        beep(300,0.1,'sawtooth',0.1); shake=Math.max(shake,3);
        setTimeout(()=>{ if(finished) return; ml+=25; phase='trash'; sGood();
          for(let j=0;j<10;j++) parts.push({x:CUP.x+(Math.random()*24-12),y:CUP.y-46,vx:(Math.random()*2-1)*50,vy:-30-Math.random()*50,gv:400,r:1.5+Math.random()*1.5,c:'#cbe36a',life:0.4}); },420); } }
    cv.addEventListener('pointerdown',dn); cv.addEventListener('pointermove',mv);
    ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,up));
    function cleanup(){ cancelAnimationFrame(raf);
      ['pointerup','pointercancel'].forEach(ev=>window.removeEventListener(ev,up)); }
    function station(img,p,w,shadow){ const im=SQ.imgs[img]; if(!im) return;
      const h2=w*(im.height/im.width);
      if(shadow){ ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(p.x,p.y+h2*0.42,w*0.42,7,0,0,6.283); ctx.fill(); ctx.restore(); }
      ctx.drawImage(im,p.x-w/2,p.y-h2/2,w,h2); }
    function hintAt(p,txt,t){ const bl=Math.floor(t/300)%2===0;
      ctx.save(); ctx.strokeStyle=bl?'#ffd977':'rgba(255,217,119,0.4)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y-8,52+Math.sin(t/200)*4,0,6.283); ctx.stroke();
      ctx.font='9px "Press Start 2P"'; ctx.textAlign='center';
      const tx3=Math.max(84,Math.min(316,p.x)); // 화면 밖 잘림 방지
      ctx.fillStyle='#000'; ctx.fillText(txt,tx3+2,p.y-70); ctx.fillStyle='#ffd977'; ctx.fillText(txt,tx3,p.y-72); ctx.restore(); }
    function draw(t){
      raf=requestAnimationFrame(draw);
      if(!t0){ t0=t; lastT=t; stT=t; }
      const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
      const el2=t-stT;
      if(state==='intro'&&el2>=ARM){ state='play'; stT=t; }
      const left=state==='play'?Math.max(0,TOTAL-(t-stT)):TOTAL;
      if(state==='play'&&left<=0&&!finished){ finished=true;
        const sc=Math.min(100,Math.round(ml/2)), cls=ml>=175?'perfect':(ml>=100?'good':'miss');
        setTimeout(()=>{ if(ended) return; ended=true; cleanup(); done(sc,ml+'ml!',cls); },1500); }
      shownMl+=(ml-shownMl)*Math.min(1,dt*8);
      shake=Math.max(0,shake-dt*26);
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,400,480);
      ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
      const bgi=GB.imgs.squeeze||GB.imgs.tipcatch||FP.imgs.bg; // bg_squeeze.png 넣으면 자동 적용
      if(bgi){ const s=Math.max(400/bgi.width,480/bgi.height); ctx.drawImage(bgi,(400-bgi.width*s)/2,(480-bgi.height*s)/2,bgi.width*s,bgi.height*s); }
      else { ctx.fillStyle='#14170f'; ctx.fillRect(0,0,400,480); }
      ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,400,480);
      if(state!=='intro'){
        // 스테이션
        station('basket',BK,110,true);
        station('board',BD,230,true); // 배경 아일랜드 식탁 위에 크게
        station(phase==='pressing'&&now()-pressT<420?'closed':'open',SZ,204,true);
        station('cup',CUP,96,true);
        station('trash',TR,190,false); // 하단에 뚜껑 머리만 보이게
        // 계량컵 즙 채움 (내부 영역)
        const cim=SQ.imgs.cup;
        if(cim){ const cw3=96, chh3=cw3*(cim.height/cim.width);
          const ix0=CUP.x-cw3/2+cw3*0.20, ix1=CUP.x-cw3/2+cw3*0.72;
          const iy1=CUP.y-chh3/2+chh3*0.86, iy0=CUP.y-chh3/2+chh3*0.28;
          const f=Math.min(1,shownMl/250), fy=iy1-(iy1-iy0)*f;

          ctx.fillStyle='#b8d84e'; ctx.fillRect(ix0,fy,ix1-ix0,iy1-fy); ctx.restore();
          if(shownMl>2){ ctx.globalAlpha=0.7; ctx.fillStyle='#dcef8a';
            ctx.beginPath(); ctx.ellipse((ix0+ix1)/2,fy,(ix1-ix0)/2,2.5,0,0,6.283); ctx.fill(); ctx.globalAlpha=1; } }
        // 도마 위 라임/반쪽 (드래그 중인 것은 제외)
        if(phase==='cut') station('lime',{x:BD.x,y:BD.y-56},58,false);
        let bh3=0;
        if(phase==='load') bh3=halves-((drag&&drag.kind==='half')?1:0);
        else if(phase==='press'||phase==='pressing'||phase==='trash') bh3=halves-1;
        if(bh3>=1) station('half',{x:BD.x-24,y:BD.y-56},52,false);
        if(bh3>=2) station('half',{x:BD.x+26,y:BD.y-52},52,false);
        // 스퀴저 볼 안의 반쪽/찌꺼기 (볼은 이미지 오른쪽)
        if(phase==='press') station('half',{x:SZ.x+27,y:SZ.y+14},58,false);
        if(phase==='trash'&&!(drag&&drag.kind==='spent')) station('spent',{x:SZ.x+27,y:SZ.y+14},58,false);
        // 압착 즙: 스퀴저 볼 바로 아래 계량컵으로 수직 낙하

          ctx.beginPath(); ctx.moveTo(SZ.x+27,SZ.y+54); ctx.lineTo(SZ.x+27,CUP.y-36); ctx.stroke();
          if(Math.random()<0.8) parts.push({x:SZ.x+27+(Math.random()*8-4),y:SZ.y+58,vx:(Math.random()*2-1)*10,vy:120+Math.random()*60,gv:600,r:1.5+Math.random()*1.6,c:'#cbe36a',life:0.4}); }
        // 칼질 플래시
        if(now()-cutT<160){ ctx.strokeStyle='#fff'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.moveTo(BD.x-70,BD.y-82); ctx.lineTo(BD.x+70,BD.y-34); ctx.stroke(); }
        // 드래그 중인 오브젝트
        if(drag) station(drag.kind,{x:drag.x,y:drag.y-10},58,false);
        // 힌트
        if(state==='play'&&!finished&&!drag){
          if(phase==='grab') hintAt(BK,'DRAG TO BOARD!',t);
          else if(phase==='cut') hintAt(BD,'SLIDE = SLICE!',t);
          else if(phase==='load') hintAt(BD,'DRAG TO SQUEEZER!',t);
          else if(phase==='press') hintAt(SZ,'SLIDE DOWN!',t);
          else if(phase==='trash') hintAt({x:300,y:446},'DRAG TO TRASH!',t); }
      }
      for(let i=parts.length-1;i>=0;i--){ const pp2=parts[i]; pp2.life-=dt; if(pp2.life<=0){ parts.splice(i,1); continue; }
        pp2.vy+=pp2.gv*dt; pp2.x+=pp2.vx*dt; pp2.y+=pp2.vy*dt;
        ctx.globalAlpha=Math.min(1,pp2.life*2.5); ctx.fillStyle=pp2.c; ctx.fillRect(pp2.x-pp2.r/2,pp2.y-pp2.r/2,pp2.r,pp2.r); }
      ctx.globalAlpha=1;
      // HUD: ml 카운터 + 타이머
      if(state==='play'||finished){
        const cw4=200,chh4=54,cx4=200-cw4/2,cy4=10;
