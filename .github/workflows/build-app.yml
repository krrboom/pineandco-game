name: Build Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (runner has it; just add platform 34 + build-tools)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | $SDKM --licenses >/dev/null 2>&1 || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Release keystore (from repo secret)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.p12; echo "release key: yes"; else echo "release key: NO (debug key)"; fi
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --warning-mode=none --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk pineandco.apk && ls -l pineandco.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pine & Co app build ${{ github.run_number }}
          body: "RG Rotate 등 안드로이드 손잡이 게임기용. pineandco.online/app.apk 로 내려받기."
          files: android/pineandco.apk
