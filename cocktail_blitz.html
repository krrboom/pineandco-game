<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pine &amp; Co — Cocktail Blitz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{ --pine:#5a8a5e; --gold:#c89a3c; --cream:#f0ebe0; --pine-light:#6fcf8f; --amber:#e6b450; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#05070d; overflow:hidden; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:min(100vw,900px); max-height:100vh; margin:0 auto; }
  canvas{ display:block; width:100%; height:100%; background:radial-gradient(120% 80% at 50% -10%, #16213e 0%, #0a0f1f 55%, #05070d 100%); }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--cream); padding:22px; gap:12px; }
  .hidden{ display:none !important; }
  .brand{ font-size:12px; letter-spacing:4px; color:var(--gold); font-weight:800; }
  h1{ font-size:clamp(28px,9vw,50px); font-weight:900; letter-spacing:1px; line-height:1; text-shadow:0 0 24px rgba(200,154,60,.35); }
  h1 .em{ color:#7ee7a0; }
  .sub{ font-size:clamp(12px,3.5vw,15px); color:#a9b6cf; line-height:1.6; max-width:320px; }
  .btn{ margin-top:6px; padding:14px 40px; font-family:inherit; font-size:clamp(16px,4.8vw,20px); font-weight:800; letter-spacing:1px;
    color:#0a140a; background:var(--pine); border:2px solid #cfeccf; border-radius:30px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.5); }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.5); }
  .hi{ font-size:13px; color:#8ea0c0; } .hi b{ color:var(--gold); }
  .idxbtn{ background:#2c3e2d; color:var(--cream); border-color:#c89a3c; font-size:14px; padding:9px 26px; margin-top:2px; }
  /* 인덱스(도감) */
  #indexScreen{ background:rgba(6,9,18,.96); justify-content:flex-start; padding-top:16px; gap:8px; }
  #idxTabs{ display:flex; gap:8px; }
  .itab{ font-family:inherit; font-size:13px; font-weight:800; padding:7px 16px; border-radius:18px; cursor:pointer;
    background:#182015; color:#a9b6cf; border:2px solid #35513f; }
  .itab.sel{ background:#5a8a5e; color:#0a140a; border-color:#cfeccf; }
  #idxList{ width:100%; max-width:440px; max-height:64vh; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:4px 2px; -webkit-overflow-scrolling:touch; }
  .idxrow{ display:flex; align-items:center; gap:11px; padding:8px 10px; background:rgba(20,28,20,.7); border:1px solid #2b3b2b; border-radius:10px; text-align:left; }
  .idxrow img{ width:44px; height:44px; object-fit:contain; image-rendering:pixelated; flex:0 0 auto; }
  .idxrow .in{ min-width:0; }
  .idxrow .nm{ font-size:13px; font-weight:900; color:var(--cream); }
  .idxrow .nm .tg{ font-size:10px; font-weight:800; color:var(--gold); margin-left:5px; }
  .idxrow .ds{ font-size:11px; line-height:1.45; color:#a9b6cf; margin-top:2px; }
  #charpick{ display:flex; gap:12px; margin:4px 0; }
  .cbtn{ display:flex; flex-direction:column; align-items:center; gap:2px; width:clamp(120px,38vw,150px); padding:8px 6px 10px; cursor:pointer;
    background:linear-gradient(#1a2620,#12190f); border:2px solid #35513f; border-radius:14px; box-shadow:0 4px 0 rgba(0,0,0,.5); transition:transform .07s,border-color .12s,box-shadow .12s; }
  .cbtn:active{ transform:translateY(3px); }
  .cbtn img{ width:84px; height:56px; object-fit:contain; image-rendering:pixelated; }
  .cbtn .cn{ font-size:16px; font-weight:900; color:var(--cream); letter-spacing:1px; }
  .cbtn .cd{ font-size:10.5px; font-weight:700; color:#a9b6cf; }
  .cbtn.sel{ border-color:var(--gold); box-shadow:0 0 14px rgba(200,154,60,.45),0 4px 0 rgba(0,0,0,.5); }
  .cbtn.sel .cn{ color:var(--gold); }
  #overTitle{ font-size:clamp(26px,8vw,40px); font-weight:900; color:#ff5a4d; text-shadow:0 0 20px rgba(255,90,77,.4); }
  .stat{ font-size:clamp(15px,4.4vw,19px); } .stat b{ color:var(--gold); font-size:1.3em; }
  .newrec{ color:var(--gold); font-weight:800; letter-spacing:2px; font-size:13px; animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }
  /* HUD */
  #hud{ position:absolute; top:0; left:0; right:0; padding:10px 14px; pointer-events:none; color:var(--cream); }
  #topRow{ display:flex; justify-content:space-between; align-items:flex-start; }
  #score{ font-size:clamp(22px,7vw,34px); font-weight:900; font-variant-numeric:tabular-nums; text-shadow:0 2px 8px rgba(0,0,0,.6); line-height:1; }
  #score small{ display:block; font-size:10px; letter-spacing:2px; color:#8ea0c0; font-weight:700; }
  #lvBox{ text-align:right; font-size:11px; color:#8ea0c0; font-weight:700; font-family:'Press Start 2P',monospace; }
  #lvBox b{ color:var(--gold); font-size:13px; }
  /* ★Cocktail Defense 동일 HP/XP 바(액자형, 픽셀폰트 라벨) */
  #bars{ margin-top:7px; display:flex; flex-direction:column; }
  .hp-bar{ position:relative; width:clamp(150px,44vw,230px); height:clamp(18px,5vw,26px);
    background:#2a0e0e; border:3px solid #000; box-shadow:0 2px 0 rgba(0,0,0,.5); }
  #hpFill{ height:100%; background:linear-gradient(#ff6b5e,#d9544d); width:100%; transition:width .12s; }
  .bar-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P',monospace; font-size:clamp(8px,2.3vw,12px); color:#fff; text-shadow:1px 1px 0 #000,-1px -1px 0 #000; }
  .xp-bar{ position:relative; width:clamp(150px,44vw,230px); height:clamp(9px,2.6vw,14px);
    background:#0e2a16; border:2px solid #000; margin-top:4px; }
  #xpFill{ height:100%; background:linear-gradient(#aeffbe,#6fcf8f); width:0%; transition:width .12s; box-shadow:0 0 6px rgba(111,207,143,.85); }
  /* ★획득 칵테일/재료 슬롯(CD 동일: wslot 액자칩 + Lv 배지) */
  /* ★발사 버튼(모바일 우하단, 누르는 동안 발사) */
  #fireBtn{ position:absolute; right:20px; bottom:24px; z-index:20; width:clamp(78px,20vw,104px); height:clamp(78px,20vw,104px);
    border-radius:50%; font-family:'Press Start 2P',monospace; font-size:clamp(11px,3vw,15px); font-weight:900; letter-spacing:1px;
    color:#3a1010; background:radial-gradient(circle at 38% 32%, #ff8a6a, #e0483d 70%); border:4px solid #2a0e0e;
    box-shadow:0 6px 0 rgba(0,0,0,.55), inset 0 2px 6px rgba(255,255,255,.35); touch-action:none; -webkit-user-select:none; user-select:none; }
  #fireBtn.on{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.55), inset 0 2px 8px rgba(0,0,0,.35), 0 0 18px rgba(255,120,90,.8); filter:brightness(1.15); }
  #wchips{ position:absolute; bottom:8px; left:0; right:0; display:flex; gap:3px; justify-content:center; pointer-events:none; flex-wrap:wrap; padding:0 8px; }
  .wslot{ width:clamp(26px,7.5vw,34px); height:clamp(26px,7.5vw,34px); border:1.5px solid #555; border-radius:4px;
    background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; position:relative; }
  .wslot.base{ border-color:#c89a3c; }
  .wslot.ing{ border-color:#5a8a5e; background:rgba(20,40,24,.6); }
  .wslot img{ width:76%; height:76%; object-fit:contain; image-rendering:pixelated; }
  .wslot .wic{ font-size:15px; line-height:1; }
  .wslot .wlv{ position:absolute; bottom:-3px; right:-1px; font-family:'Press Start 2P',monospace; font-size:8px; color:var(--amber); font-weight:bold; text-shadow:1px 1px 0 #000; }
  #lvlFlash{ position:absolute; top:28%; left:0; right:0; text-align:center; font-weight:900; font-size:clamp(20px,7vw,34px);
    letter-spacing:3px; opacity:0; pointer-events:none; transition:opacity .2s; color:var(--gold); text-shadow:0 0 18px rgba(200,154,60,.5); }
  #lvlFlash.boss{ color:#ff5a4d; }
  #lvlFlash .wv{ display:block; font-size:.55em; letter-spacing:4px; color:var(--gold); }
  #lvlFlash .bn{ display:block; margin-top:2px; }
  #lvlFlash .bt{ display:block; font-size:.34em; letter-spacing:.5px; font-weight:700; color:#f0d9c0; margin-top:4px; }
  #bossbar{ position:absolute; top:58px; left:12%; right:12%; height:8px; background:rgba(0,0,0,.5); border:1px solid #ff8a7a; border-radius:5px; overflow:hidden; opacity:0; transition:opacity .3s; }
  #bossbar.show{ opacity:1; } #bossfill{ height:100%; width:100%; background:linear-gradient(90deg,#ff5a4d,#ffb14d); }
  /* ★레벨업: Cocktail Defense 동일 — 배너 + 액자(levelup_frame.png) 카드 */
  #levelup{ background:rgba(6,10,20,.92); gap:clamp(8px,2vh,18px); padding:18px 8px; }
  .levelup-banner{ width:clamp(160px,44vw,300px); height:auto; image-rendering:pixelated;
    filter:drop-shadow(2px 2px 0 #000) drop-shadow(0 0 16px rgba(111,207,143,.45)); }
  #cards{ display:flex; flex-wrap:wrap; gap:clamp(6px,1.5vw,14px); align-items:center; justify-content:center; width:100%; max-width:760px; }
  .up-card{ position:relative; cursor:pointer; transition:transform .07s; flex:0 0 auto; font-family:'Press Start 2P',monospace;
    width:clamp(120px, min(40vw,26vh), 180px); aspect-ratio:465/475; }
  .up-card:active{ transform:translateY(3px); }
  .upframe-img{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; z-index:2; pointer-events:none; }
  .up-card.new .upframe-img{ filter:drop-shadow(0 0 11px rgba(230,180,80,.75)); }
  .up-inner{ position:absolute; left:16%; top:15.5%; width:68%; height:69%; z-index:1; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:clamp(1px,0.5vh,3px);
    padding:2px; background:radial-gradient(circle at 50% 32%, rgba(22,32,20,.5), rgba(8,12,8,.8)); }
  .up-card .ic{ line-height:1; display:flex; align-items:center; justify-content:center; font-size:clamp(17px,4.6vw,28px); flex:0 0 auto; }
  .up-card .up-ic{ max-width:82%; max-height:clamp(20px,6vh,34px); width:auto; height:auto; object-fit:contain; image-rendering:pixelated; display:block; }
  .up-card h4{ font-size:clamp(7px,2.1vw,11px); color:var(--pine-light); line-height:1.2; }
  .up-card.new h4{ color:var(--amber); }
  .up-card .lv{ font-size:clamp(6px,1.6vw,9px); color:var(--amber); }
  .up-card p{ font-size:clamp(6px,1.6vw,9px); color:#d2cdbb; line-height:1.22; max-width:100%;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden;
    overflow-wrap:break-word; word-break:break-word; padding:0 1px; font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div id="topRow">
      <div id="score"><small>SCORE</small><span id="scoreVal">0</span></div>
      <div id="lvBox">WAVE <b id="waveVal">1</b> · LV <b id="lvVal">1</b><br>BEST <span id="hiVal">0</span></div>
    </div>
    <div id="bars">
      <div class="hp-bar"><div id="hpFill"></div><span class="bar-label" id="hpText">120/120</span></div>
      <div class="xp-bar"><div id="xpFill"></div></div>
    </div>
  </div>
  <div id="wchips"></div>
  <button id="fireBtn" class="hidden">FIRE</button>
  <div id="bossbar"><div id="bossfill"></div></div>
  <div id="lvlFlash"></div>

  <div id="title" class="overlay">
    <div class="brand">PINE &amp; CO · ARCADE <span style="opacity:.5;font-size:9px">BUILD BOSS-CD</span></div>
    <h1>COCKTAIL<br><span class="em">BLITZ</span></h1>
    <div class="sub">몰려오는 손님을 <b>칵테일로 격추</b>하라.<br>쓰러지면 <b>코인</b>이 떨어지고, 모으면 <b>레벨업</b> → <b>새 칵테일 무기</b>를 고른다.<br>이동: 모바일=드래그 / PC=방향키·WASD. <b>발사: FIRE 버튼</b>(PC=스페이스) 누르는 동안만 발사.</div>
    <div id="charpick">
      <button class="cbtn sel" data-char="pat"><img src="assets/cb_pat.png" alt="PAT"><span class="cn">PAT</span><span class="cd">🍸 쉐이커 · 폭발</span></button>
      <button class="cbtn" data-char="joe"><img src="assets/cb_joe.png" alt="JOE"><span class="cn">JOE</span><span class="cd">🥄 바스푼 · 관통</span></button>
    </div>
    <button class="btn" id="startBtn">START</button>
    <button class="btn idxbtn" id="indexBtn">📖 INDEX</button>
    <div class="hi">BEST · <b id="hiTitle">0</b></div>
  </div>

  <div id="indexScreen" class="overlay hidden">
    <h2 style="color:var(--gold);letter-spacing:1px">📖 INDEX</h2>
    <div id="idxTabs">
      <button class="itab sel" data-tab="cocktails">칵테일</button>
      <button class="itab" data-tab="bosses">보스</button>
      <button class="itab" data-tab="monsters">몬스터</button>
    </div>
    <div id="idxList"></div>
    <button class="btn" id="idxClose" style="background:#2c3e2d;color:var(--cream);border-color:#5a8a5e">✕ 닫기</button>
  </div>

  <div id="levelup" class="overlay hidden">
    <img class="levelup-banner" src="assets/levelup_banner.png" alt="LEVEL UP!"
         onerror="this.outerHTML='<h2 style=&quot;color:var(--gold);font-family:Press Start 2P,monospace&quot;>LEVEL UP!</h2>'">
    <div id="cards"></div>
  </div>

  <div id="over" class="overlay hidden">
    <div id="overTitle">LAST CALL</div>
    <div class="stat">SCORE · <b id="finalScore">0</b></div>
    <div class="stat" style="font-size:.85em">LV <span id="finalLv">1</span> · BEST <span id="finalBest">0</span></div>
    <div class="newrec hidden" id="newRec">★ NEW RECORD ★</div>
    <button class="btn" id="retryBtn">RETRY</button>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
  let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  let LAND=false, FWD=-Math.PI/2;   // ★방향 인식: 가로화면=옆으로(오른쪽 발사), 세로화면=위로 발사
  function computeOrient(){ LAND = true; FWD = 0; }   // ★항상 횡(가로) 플레이 — 적 우→좌, 발사 오른쪽
  function resize(){ const r=wrap.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); computeOrient(); }
  window.addEventListener('resize',resize); resize();

  // ── audio ──
  let AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function beep(f,d,t,v){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=t||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(v||0.1,a.currentTime+0.008); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }catch(e){} }
  function boom(big){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(big?200:150,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(30,a.currentTime+(big?0.6:0.3)); g.gain.setValueAtTime(big?0.6:0.35,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(big?0.7:0.35));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.7);
    const dur=big?0.5:0.3,sr=a.sampleRate,b=a.createBuffer(1,Math.floor(sr*dur),sr),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    const s=a.createBufferSource(); s.buffer=b; const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=big?700:1100; const g2=a.createGain();
    g2.gain.setValueAtTime(big?0.5:0.35,a.currentTime); g2.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); s.connect(lp); lp.connect(g2); g2.connect(a.destination); s.start(); s.stop(a.currentTime+dur); }catch(e){} }
  function coinSfx(){ sfx('sfx_coin',0.4); }

  // ── 이미지(캐릭터 pat/joe + 슈퍼맨 포즈 + 던지는 피사체) ──
  const IMG={}; function loadImg(k,src){ const i=new Image(); i.onload=()=>{ IMG[k]=i; }; i.src=src; }
  ['cb_pat','cb_pat_straight','cb_pat_rear','cb_joe','cb_joe_straight','cb_joe_rear','proj_shaker','proj_barspoon','proj_mixglass'].forEach(k=>loadImg(k,'assets/'+k+'.png'));
  loadImg('bg_gangnam','assets/bg_gangnam.png');   // ★가로 스크롤 강남 배경(뒤)
  loadImg('fg_gangnam','assets/fg_gangnam.png');   // ★앞쪽 배경 레이어(더 빠르게)
  // ★Cocktail Defense 몬스터 + 보스 스프라이트(걷기 A/B) + thrower 토하기
  const BOSSES=['boss_karaoke','boss_couple','boss_woman','boss_ladies','boss_amaro'];   // 보스 순환
  const BOSS_INFO={   // ★Cocktail Defense 보스 이름·특성
    boss_karaoke:{ name:'THE HUMAN MEGAPHONE', trait:'실내 목소리 불가. 무지개 소음 + 음표 탄막을 쏜다.' },
    boss_couple:{ name:'GET-A-ROOM GANG',      trait:'스툴 하나로 신혼여행. 붙어서 안 떨어진다.' },
    boss_woman:{ name:'MADAME SEND-IT-BACK',   trait:'칵테일도 얼음도 물도 다 반품하는 진상.' },
    boss_ladies:{ name:'FOUR-HOUR TWO-TOP',    trait:'물 한 잔에 네 시간 수다. 자리를 안 뺀다.' },
    boss_amaro:{ name:'THE AMARO NERD',        trait:'페르넷·캄파리만. 팁은 팔레트 잔소리로.' },
  };
  ['enemy_drunk','enemy_drunk2','enemy_genzm','enemy_genzf','enemy_runner','enemy_bomber','enemy_thrower'].concat(BOSSES)
    .forEach(t=>{ loadImg(t+'_walkA','assets/'+t+'_walkA.png'); loadImg(t+'_walkB','assets/'+t+'_walkB.png'); });
  loadImg('enemy_thrower_vomit','assets/enemy_thrower_vomit.png');
  // ★보스 피사체(CD 동일): 하트/아마로 5종/무지개/음표 2종
  ['icon_heart','amaro_0','amaro_1','amaro_2','amaro_3','amaro_4','eproj_rainbow','eproj_note1','eproj_note2'].forEach(k=>loadImg(k,'assets/'+k+'.png'));
  // ★칵테일 피사체 이미지
  ['gintonic','margarita','whiskysour','bloodymary','negroni','espressomartini','mojito','cosmopolitan','manhattan','oldfashioned','moscowmule','vodkatonic','sidecar','southside','drymartini','highball','vodkacranberry','corpsereviver'].forEach(k=>loadImg('cocktail_'+k,'assets/cocktail_'+k+'.png'));
  let selectedChar='pat';
  // ── CD 음악 + 효과음(mp3 그대로) ──
  const bgm=new Audio(); bgm.loop=true; bgm.volume=0.42; let curMusic='';
  function playMusic(name){ if(curMusic===name){ if(bgm.paused) bgm.play().catch(()=>{}); return; } curMusic=name; try{ bgm.src='assets/'+name+'.mp3'; bgm.play().catch(()=>{}); }catch(e){} }

    const spd=(0.95+t*0.02)*ETYPE[type].spdm*1.55;                 // ★초반 느리게→시간 갈수록 빠르게
    const baseY=H*0.28 + Math.random()*H*0.44;
    const s={ members:[], hist:[], type, spd, kind, phase:Math.random()*6.28, baseY, gap:14, f:0, leadX:W+46, dir:(Math.random()<0.5?1:-1) };
    for(let i=0;i<n;i++){ const e=spawnEnemy({ type, x:W+46, y:baseY, pat:'snake', vx:0, vy:0, snake:s, idx:i }); s.members.push(e); }
    snakes.push(s); }
  function updateSnakes(){
    for(let si=snakes.length-1;si>=0;si--){ const s=snakes[si]; s.f++; s.leadX-=s.spd;
      let dy;   // 리드 y경로 — kind별로 요리조리
      if(s.kind==='wave')      dy = Math.sin(s.f*0.06+s.phase)*H*0.17 + Math.sin(s.f*0.021)*H*0.09;
      else if(s.kind==='zigzag'){ const tri=Math.asin(Math.sin(s.f*0.055+s.phase))*(2/Math.PI); dy=tri*H*0.22; }
      else if(s.kind==='swoop') dy = Math.sin(s.f*0.032+s.phase)*H*0.30;
      else /*sweep*/            dy = s.dir*Math.sin(s.f*0.045+s.phase)*H*0.24 + Math.sin(s.f*0.09)*H*0.05;
      const leadY=Math.max(24, Math.min(H-24, s.baseY+dy));
      s.hist.unshift({x:s.leadX, y:leadY}); if(s.hist.length>170) s.hist.pop();
      let alive=false;
      for(const e of s.members){ if(e.dead || enemies.indexOf(e)<0) continue; alive=true;
        const h=s.hist[Math.min(s.hist.length-1, e.idx*s.gap)]; if(h){ e.x=h.x; e.y=h.y; } }
      if(!alive || s.leadX<-4000) snakes.splice(si,1); } }   // ★전원이 사라질 때만 제거(꼬리 얼어붙는 버그 수정)

  function explodeBomber(e){ const R=60; explo(e.x,e.y,'#ff7a2a',26,7); explo(e.x,e.y,'#ffd28a',14,5); boom(false); shake=Math.max(shake,9);
    if(Math.hypot(e.x-player.x,e.y-player.y)<R+player.r) hurt(22);   // 반경 안이면 플레이어 피해
    for(let m=enemies.length-1;m>=0;m--){ const o=enemies[m]; if(o===e) continue; if(Math.hypot(o.x-e.x,o.y-e.y)<R){ o.hp-=enemyHpBase()*2.2; if(o.hp<=0){ score+=8; for(let k=0;k<o.coin;k++) dropCoin(o.x,o.y); enemies.splice(m,1); } } }
    score+=15; for(let k=0;k<e.coin;k++) dropCoin(e.x,e.y); }

  function spawnBoss(){ bossCount++; const hp=Math.round(95*Math.pow(1.4,bossCount-1));   // ★보스 체력 완화
    const sprite=BOSSES[(bossCount-1)%BOSSES.length];
    boss = LAND
      ? { x:W+90, y:H/2, ex:W*0.83, ey:H/2, r:44, hp, maxHp:hp, fireT:50, burstT:160, dir:1, enter:true, sprite }
      : { x:W/2, y:-90, ex:W/2, ey:H*0.16, r:44, hp, maxHp:hp, fireT:50, burstT:160, dir:1, enter:true, sprite };
    bossbar.classList.add('show'); bossfill.style.width='100%';
    const info=BOSS_INFO[sprite]||{name:'RIVAL',trait:''};
    lvlFlashEl.innerHTML='<span class="wv">WAVE '+bossCount+'</span><span class="bn">'+info.name+'</span><span class="bt">'+info.trait+'</span>';

  function explo(x,y,col,n,sp){ for(let i=0;i<(n||14);i++){ const a=Math.random()*6.28,s=1+Math.random()*(sp||4); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:1+Math.random()*3,col}); } }
  function nearestEnemy(x,y){ let n=null,nd=1e9; for(const e of enemies){ const d=(e.x-x)**2+(e.y-y)**2; if(d<nd){nd=d;n=e;} } if(boss&&!boss.enter){ const d=(boss.x-x)**2+(boss.y-y)**2; if(d<nd){nd=d;n=boss;} } return n; }

  function dropCoin(x,y){ const c={x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*14,r:6,val:1};
    if(LAND){ c.vx=-(1.0+Math.random()); c.vy=(Math.random()-0.5)*1.2; } else { c.vx=(Math.random()-0.5)*1.4; c.vy=1.2+Math.random(); } coinDrops.push(c); }
  function dropBill(x,y){ const c={x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*14,r:9,val:5,bill:true};   // ★지폐: 코인 5개 값
    if(LAND){ c.vx=-(0.8+Math.random()); c.vy=(Math.random()-0.5)*1.0; } else { c.vx=(Math.random()-0.5)*1.2; c.vy=1.0+Math.random(); } coinDrops.push(c); }
  function killEnemy(e,i){ e.dead=true; enemies.splice(i,1);
    if(e.type==='bomber'){ explodeBomber(e); return; }   // 폭발몹은 죽어도 폭발
    explo(e.x,e.y,'#ffcf8a',12,4); score+=e.type==='thrower'?20:(e.type==='runner'?12:10); sfx('hit',0.4);
    for(let k=0;k<e.coin;k++) dropCoin(e.x,e.y); }

  function gainCoin(v){ const g=Math.max(1,Math.round((v||1)*(player.coinMul||1))); coins+=g; score+=2*g; coinSfx(); if(coins>=coinNeed) levelUp(); }
  function levelUp(){ level++; coins-=coinNeed; coinNeed=5+level*3; document.getElementById('lvVal').textContent=level;

  function showCards(){ const pool=[];
    // ★칵테일: 슬롯 4칸 상한(새 칵테일은 4개 미만일 때만, 기존 건 업그레이드)
    const cocktailCount = Object.keys(player.weapons).filter(k=>!WEAPONS[k].sig).length;
    for(const k in WEAPONS){ const w=WEAPONS[k]; if(w.sig) continue;   // 시그니처(기본무기)는 카드에 안 나옴
      const lv=player.weapons[k]||0; if(lv>=w.max) continue;
      if(lv===0 && cocktailCount>=4) continue; pool.push({kind:'cocktail', k, upgrade:lv>0}); }

    const ingCount = Object.keys(player.passives).length;
    for(const k in INGREDIENTS){ const g=INGREDIENTS[k]; const lv=player.passives[k]||0; if(lv>=g.max) continue;
      if(lv===0 && ingCount>=6) continue; pool.push({kind:'ing', k, upgrade:lv>0}); }
    // 셔플
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const pick=pool.slice(0,3); if(Math.random()<0.3 || pick.length<3) pick.push({heal:true});
    const cards=pick.slice(0,3);
    const el=document.getElementById('cards'); el.innerHTML='';
    const frame='<img class="upframe-img" src="assets/levelup_frame.png" alt="" onerror="this.style.display=\'none\'">';
    cards.forEach(c=>{ const d=document.createElement('div');
      if(c.heal){ d.className='up-card new';
        d.innerHTML=`<div class="up-inner"><div class="ic"><span>${HEAL.ic}</span></div><h4>${HEAL.name}</h4><div class="lv">RECOVER</div><p>${HEAL.desc}</p></div>`+frame;
        d.onclick=()=>{ player.baseMaxHp+=20; recalcPassives(); player.hp=Math.min(player.maxHp,player.hp+60); pickDone(); }; }
      else if(c.kind==='ing'){ const g=INGREDIENTS[c.k], lv=player.passives[c.k]||0; d.className='up-card'+(c.upgrade?'':' new');
        d.innerHTML=`<div class="up-inner"><div class="ic"><img class="up-ic" src="assets/${c.k}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🧪'}))"></div><h4>${g.name}</h4><div class="lv">${c.upgrade?('Lv '+lv+'→'+(lv+1)+'/'+g.max):'NEW 재료'}</div><p>${g.desc}</p></div>`+frame;
        d.onclick=()=>{ player.passives[c.k]=(player.passives[c.k]||0)+1; recalcPassives(); pickDone(); }; }
      else { const w=WEAPONS[c.k], lv=player.weapons[c.k]||0; d.className='up-card'+(c.upgrade?'':' new');
        d.innerHTML=`<div class="up-inner"><div class="ic"><img class="up-ic" src="assets/${wImg(c.k)}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${w.ic||'🍸'}'}))"></div><h4>${w.name}</h4><div class="lv">${c.upgrade?('Lv '+lv+'→'+(lv+1)+'/'+w.max):'NEW · Lv 1'}</div><p>${w.desc}</p></div>`+frame;
        d.onclick=()=>{ player.weapons[c.k]=(player.weapons[c.k]||0)+1; pickDone(); }; }
      el.appendChild(d); });
  }
  function pickDone(){ sfx('sfx_select',0.6); document.getElementById('levelup').classList.add('hidden'); fireBtn.classList.remove('hidden'); updWchips(); state='play'; }

  function hurt(dmg){ if(player.invuln>0) return; player.hp-=dmg; player.invuln=45; flashHit=0.8; shake=Math.max(shake,10); sfx('sfx_hurt',0.6);
    if(player.hp<=0){ die(); } }
  function die(){ state='over'; boom(true); playMusic('music_title'); explo(player.x,player.y,'#ff6a4d',40,6); explo(player.x,player.y,'#ffd24a',24,5); shake=22; flashHit=1;
    const rec=score>best; if(rec){ best=score; localStorage.setItem('pine_blitz_best',String(best)); }

    document.getElementById('finalBest').textContent=best.toLocaleString(); document.getElementById('newRec').classList.toggle('hidden',!rec);
    document.getElementById('hud').classList.add('hidden'); fireBtn.classList.add('hidden'); fireOff(); bossbar.classList.remove('show');
    setTimeout(()=>document.getElementById('over').classList.remove('hidden'),650); }

  function update(){
    frame++;
    if(state==='play'){
      t+=1/60;
      // 스폰
      spawnT--; const rate=Math.max(24, 58 - t*0.4)*(boss?2.0:1); if(spawnT<=0){
        if(t>5 && !boss){ if(Math.random()<0.5) spawnSnake(); else spawnEnemy(); }   // ★편대/단발 반반
        else spawnEnemy();
        spawnT=rate*(1.3+Math.random()*0.9); }   // ★스폰 더 완만(난이도↓)
      if(!boss){ bossTimer--; if(bossTimer<=0) spawnBoss(); }
      // 이동
      const slowF=(player.slowT>0)?0.5:1; if(player.slowT>0) player.slowT--;   // ★빙결 아우라 둔화
      const kb=6.5*(player.moveMul||1)*slowF; if(keys['ArrowLeft']||keys['a']) player.tx-=kb; if(keys['ArrowRight']||keys['d']) player.tx+=kb; if(keys['ArrowUp']||keys['w']) player.ty-=kb; if(keys['ArrowDown']||keys['s']) player.ty+=kb;
      player.tx=Math.max(player.r,Math.min(W-player.r,player.tx)); player.ty=Math.max(player.r,Math.min(H-player.r,player.ty));
      // ★이동 방향으로 포즈: 앞(오른쪽)=straight, 뒤(왼쪽)/위=rear, 그 외=stay
      const pdx=player.tx-player.x, pdy=player.ty-player.y;
      player.pose = (pdx>3) ? 'straight' : (pdx<-3||pdy<-3) ? 'rear' : 'stay';
      const ease=Math.min(0.6,0.35*(player.moveMul||1))*slowF; player.x+=(player.tx-player.x)*ease; player.y+=(player.ty-player.y)*ease;
      player.trail.push({x:player.x,y:player.y}); if(player.trail.length>8) player.trail.shift();
      if(player.invuln>0) player.invuln--; if(player.throwTimer>0) player.throwTimer--;
      // 무기 발사 — ★고전 슈팅게임처럼 발사 버튼(또는 스페이스)을 누르고 있을 때만 발사
      // ★칵테일은 회전 없이 캐릭터 위/아래/뒷대각선 2개(총 4칸) 고정 위치에서 발사
      const orb=Object.keys(player.weapons).filter(k=>!WEAPONS[k].sig); orbitPos={};
      const SD=player.r*2.5, SLOTS=[[0,-SD],[0,SD],[-SD*0.72,-SD*0.72],[-SD*0.72,SD*0.72]];   // 위·아래·뒤위·뒤아래
      orb.slice(0,4).forEach((k,i)=>{ orbitPos[k]={x:player.x+SLOTS[i][0], y:player.y+SLOTS[i][1]}; });
      const shooting = firing || keys[' '] || keys['j'] || keys['k'];
      for(const k in player.weapons){ player.wcd[k]=(player.wcd[k]||0)-1;
        if(shooting && player.wcd[k]<=0){ const lv=player.weapons[k]; const op=(WEAPONS[k].sig||!orbitPos[k])?player:orbitPos[k]; fireOX=op.x; fireOY=op.y;   // 시그니처=플레이어, 칵테일=4칸 슬롯에서 발사
          WEAPONS[k].fire(lv); player.wcd[k]=Math.round(WEAPONS[k].cd(lv)*(player.cdMul||1)); if(WEAPONS[k].sig) player.throwTimer=9; }
        if(player.wcd[k]<0) player.wcd[k]=0; }
      // 총알
      for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.life--;
        if(b.homing){ const tg=nearestEnemy(b.x,b.y); if(tg){ const a=Math.atan2(tg.y-b.y,tg.x-b.x); b.vx+=(Math.cos(a)*8-b.vx)*0.12; b.vy+=(Math.sin(a)*8-b.vy)*0.12; } }
        b.x+=b.vx; b.y+=b.vy; if(b.life<=0||b.y<-30||b.x<-30||b.x>W+30){ bullets.splice(i,1); continue; }
        let gone=false;
        for(let j=enemies.length-1;j>=0;j--){ const e=enemies[j]; if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
          if(b.splash){ explo(b.x,b.y,'#ffb14d',18,5); boom(false);   // ★쉐이커 폭발: 반경 안 전부 타격
            for(let mm=enemies.length-1;mm>=0;mm--){ const e2=enemies[mm]; if(Math.hypot(e2.x-b.x,e2.y-b.y)<b.splash+e2.r){ e2.hp-=b.dmg*player.dmgMul; if(e2.hp<=0) killEnemy(e2,mm); } }
            if(boss&&!boss.enter&&Math.hypot(boss.x-b.x,boss.y-b.y)<b.splash+boss.r){ boss.hp-=b.dmg*player.dmgMul; score+=1; }
            gone=true; break; }
          e.hp-=b.dmg*player.dmgMul; explo(b.x,b.y,'#ffe08a',3,2);
          if(b.knock){ if(LAND) e.x+=b.knock; else e.y+=b.knock; }   // ★넉백(진행 반대로 밀어냄)
          if(b.slow) e.slowUntil=frame+b.slow;                        // ★빙결/둔화
          if(b.lifesteal && player.hp<player.maxHp){ player.hp=Math.min(player.maxHp,player.hp+b.lifesteal); if(frame%3===0) explo(player.x,player.y,'#ff5a7a',2,1); }  // ★흡혈
          if(e.hp<=0) killEnemy(e,j); if(b.pierce>0){ b.pierce--; } else { gone=true; } break; } }
        if(gone){ bullets.splice(i,1); continue; }
        if(boss&&!boss.enter&&Math.hypot(boss.x-b.x,boss.y-b.y)<boss.r){ boss.hp-=b.dmg*player.dmgMul; explo(b.x,b.y,'#ffd24a',2,2); score+=1;
          if(boss.hp<=0){ explo(boss.x,boss.y,'#ff6a4d',50,7); explo(boss.x,boss.y,'#ffd24a',30,6); boom(true); shake=18; score+=400*bossCount;
            for(let k=0;k<12;k++) dropCoin(boss.x+(Math.random()-0.5)*40, boss.y+(Math.random()-0.5)*40);
            for(let k=0;k<4+bossCount;k++) dropBill(boss.x+(Math.random()-0.5)*50, boss.y+(Math.random()-0.5)*50);   // ★보스는 지폐도 드롭
            boss=null; bossbar.classList.remove('show'); bossTimer=22*60; lvlFlashEl.classList.remove('boss'); lvlFlashEl.textContent='RIVAL DOWN!'; lvlFlashEl.style.opacity='1'; setTimeout(()=>lvlFlashEl.style.opacity='0',900); }
          if(b.pierce>0) b.pierce--; else bullets.splice(i,1); continue; }
      }
      // ★뱀 편대 경로 갱신(멤버 위치는 여기서 결정)
      updateSnakes();
      // 적 (CD 능력 반영)
      for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i]; e.wob+=0.12; if(e.vomit>0) e.vomit--;
        const sm=(frame<(e.slowUntil||0))?0.4:1;   // ★빙결/둔화 시 40% 속도
        if(e.type==='thrower'){
          if(!e.snake){ e.x+=e.vx*sm; e.y+=e.vy*sm; }   // ★편대(뱀)면 이동은 경로가 담당
          e.fireT--; if(e.fireT<=0){ e.fireT=Math.max(70,120-t); e.vomit=16;   // ★스로워 특성: 편대에서도 침 뱉기
            const a=Math.atan2(player.y-e.y,player.x-e.x);
            const sp=2.6+Math.random()*0.6; ebullets.push({x:e.x,y:e.y+e.r*0.3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:11,col:'#9ad14f',vomit:true,wob:Math.random()*6.28});
            sfx('sfx_hurt',0.22); }
        } else if(e.snake){ /* 위치는 updateSnakes 담당 → 일반 이동 스킵 */ }
        else {
          e.x+=e.vx*sm; e.y+=e.vy*sm;
          // ★이동 패턴: sine=파도, dive=플레이어 y로 서서히 추적, diag/straight=vx/vy 그대로
          if(e.pat==='sine'){ e.y+=Math.sin(e.wob*2)*2.4*sm; }
          else if(e.pat==='dive'){ e.y+=Math.max(-1.1,Math.min(1.1,(player.y-e.y)*0.02))*sm; }
        }
        if(e.pat!=='diag' && !e.snake){ if(LAND){ if(e.y<e.r)e.y=e.r; if(e.y>H-e.r)e.y=H-e.r; } else { if(e.x<e.r)e.x=e.r; if(e.x>W-e.r)e.x=W-e.r; } }   // ★diag/뱀 편대는 화면 밖으로 통과
        if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r-2){ enemies.splice(i,1);
          if(e.type==='bomber') explodeBomber(e); else { hurt(16); explo(e.x,e.y,'#c96b6b',8,3); } continue; }
        if(e.y>H+50||e.y<-80||e.x<-80||e.x>W+80) enemies.splice(i,1); }
      // 보스
      if(boss){ if(boss.enter){ boss.x+=(boss.ex-boss.x)*0.06; boss.y+=(boss.ey-boss.y)*0.06; if(Math.hypot(boss.x-boss.ex,boss.y-boss.ey)<2){ boss.x=boss.ex; boss.y=boss.ey; boss.enter=false; } }
        else { const bs=(1.1+bossCount*0.2)*(boss.kstop>0?0:1);   // karaoke는 멈췄을 때 정지
          if(boss.kstop>0) boss.kstop--;
          if(LAND){ boss.y+=boss.dir*bs; if(boss.y<boss.r+10){boss.y=boss.r+10;boss.dir=1;} if(boss.y>H-boss.r-10){boss.y=H-boss.r-10;boss.dir=-1;} }
          else { boss.x+=boss.dir*bs; if(boss.x<boss.r+10){boss.x=boss.r+10;boss.dir=1;} if(boss.x>W-boss.r-10){boss.x=W-boss.r-10;boss.dir=-1;} }
          // ★보스별 CD 고유 공격 + 피사체
          const aim=Math.atan2(player.y-boss.y,player.x-boss.x), sp0=2.5+bossCount*0.18; boss.fireT--;
          if(boss.sprite==='boss_couple'){        // GET-A-ROOM GANG: 하트 1~4발 스프레드
            if(boss.fireT<=0){ boss.fireT=Math.max(34,66-bossCount*4); const n=1+Math.floor(Math.random()*4);
              for(let i=0;i<n;i++){ const off=(n>1?(i-(n-1)/2)*0.22:0), a=aim+off; ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp0,vy:Math.sin(a)*sp0,r:12,img:'icon_heart',spin:Math.random()*6.28}); }
              sfx('sfx_select',0.35); }
          } else if(boss.sprite==='boss_amaro'){  // THE AMARO NERD: 아마로 5병 부채꼴
            if(boss.fireT<=0){ boss.fireT=Math.max(46,92-bossCount*5); for(let i=0;i<5;i++){ const a=aim+(i-2)*0.24; ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp0,vy:Math.sin(a)*sp0,r:16,img:'amaro_'+i,spin:(Math.random()-0.5)*0.1}); }
              sfx('sfx_select',0.4); }
          } else if(boss.sprite==='boss_karaoke'){ // THE HUMAN MEGAPHONE: 멈춰서 무지개1 + 음표2
            if(boss.fireT<=0){ boss.fireT=Math.max(44,84-bossCount*5); boss.kstop=22;
              ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(aim)*sp0*0.85,vy:Math.sin(aim)*sp0*0.85,r:17,img:'eproj_rainbow'});
              for(const o of [-0.4,0.4]){ const a=aim+o; ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp0*0.85,vy:Math.sin(a)*sp0*0.85,r:12,img:(o<0?'eproj_note1':'eproj_note2'),bob:Math.random()*6.28}); }
              sfx('sfx_select',0.5); }
          } else if(boss.sprite==='boss_woman'){  // MADAME SEND-IT-BACK: "Again!" 낙하 예고 원 → 폭발
            if(boss.fireT<=0){ boss.fireT=Math.max(78,150-bossCount*8); const n=3+Math.min(2,Math.floor(bossCount/2));
              for(let k=0;k<n;k++) dropMarks.push({x:60+Math.random()*(W-120),y:40+Math.random()*(H-80),r:48,life:44,max:44}); sfx('sfx_boss',0.3); }
          } else {  // FOUR-HOUR TWO-TOP(boss_ladies): 빙결 아우라(가까이 오면 둔화) + 조준탄
            boss.aura=boss.r*3.6; if(Math.hypot(player.x-boss.x,player.y-boss.y)<boss.aura) player.slowT=6;
            if(boss.fireT<=0){ boss.fireT=Math.max(46,86-bossCount*5); const sh=1+Math.min(2,Math.floor(bossCount/2));
              for(let k=-sh;k<=sh;k++){ const a=aim+k*0.18; ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*sp0,vy:Math.sin(a)*sp0,r:10,col:'#7fd4ff'}); } sfx('hit',0.3); } } }
        bossfill.style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%';
        if(!boss.enter&&Math.hypot(boss.x-player.x,boss.y-player.y)<boss.r+player.r-4) hurt(40); }
      // ★Madame "Again!" 낙하: 예고 원 → 착지 시 반경 안이면 큰 피해
      for(let i=dropMarks.length-1;i>=0;i--){ const m=dropMarks[i]; m.life--;
        if(m.life<=0){ explo(m.x,m.y,'#ff7ab0',24,6); boom(false); shake=Math.max(shake,8);
          if(Math.hypot(player.x-m.x,player.y-m.y)<m.r) hurt(30);
          dropMarks.splice(i,1); } }
      // 적 탄
      for(let i=ebullets.length-1;i>=0;i--){ const e=ebullets[i]; e.x+=e.vx; e.y+=e.vy; if(e.x<-20||e.x>W+20||e.y<-20||e.y>H+20){ ebullets.splice(i,1); continue; }
        if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r-3){ hurt(13); ebullets.splice(i,1); } }
      // 코인
      for(let i=coinDrops.length-1;i>=0;i--){ const c=coinDrops[i]; const d=Math.hypot(c.x-player.x,c.y-player.y);
        if(d<player.magnet){ const a=Math.atan2(player.y-c.y,player.x-c.x); c.vx+=(Math.cos(a)*7-c.vx)*0.2; c.vy+=(Math.sin(a)*7-c.vy)*0.2; }
        else { if(LAND) c.vx-=0.03; else c.vy+=0.03; }
        c.x+=c.vx; c.y+=c.vy;
        if(d<player.r+c.r){ coinDrops.splice(i,1); gainCoin(c.val); continue; }
        if(c.y>H+40||c.y<-40||c.x<-40||c.x>W+40) coinDrops.splice(i,1); }
    }
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.life-=(p.fade||0.03); if(p.life<=0) parts.splice(i,1); }
    if(shake>0){ shake*=0.86; if(shake<0.4) shake=0; } if(flashHit>0) flashHit-=0.05;
    for(const s of stars){ s.y+=0.0006*(state==='play'?(1+t*0.02):0.5); if(s.y>1) s.y-=1; }
  }

  function drawSprite(key,x,y,rad,flip){ const im=IMG[key]; if(!im){ ctx.fillStyle='#c96b6b'; ctx.beginPath(); ctx.arc(x,y,rad,0,6.28); ctx.fill(); return; }
    const h=rad*2.9, w=h*im.width/im.height; ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1); ctx.imageSmoothingEnabled=false; ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); }
  function drawEnemy(e){ const walk=(Math.floor((frame+e.wob*10)/9)%2===0);
    const key = e.type==='thrower' ? (e.vomit>0?'enemy_thrower_vomit':(walk?'enemy_thrower_walkA':'enemy_thrower_walkB')) : (e.sprite+(walk?'_walkA':'_walkB'));
    if(e.type==='bomber' && Math.floor(frame/6)%2===0){ ctx.save(); ctx.globalAlpha=0.5; const g=ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,e.r*1.5); g.addColorStop(0,'rgba(255,90,60,.6)'); g.addColorStop(1,'rgba(255,90,60,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*1.5,0,6.28); ctx.fill(); ctx.restore(); }
    drawSprite(key, e.x, e.y, e.r, LAND);   // 가로: 좌우반전(플레이어=왼쪽 향함)
    if(frame<(e.slowUntil||0)){ ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle='#7fd4ff'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*1.05,0,6.28); ctx.fill(); ctx.restore(); }   // ★빙결 틴트
    if(e.hp<e.maxHp){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3); ctx.fillStyle='#7ee7a0'; ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),3); } }
  function drawBoss(){ if(!boss) return; const r=boss.r;
    const g=ctx.createRadialGradient(boss.x,boss.y,4,boss.x,boss.y,r*1.7); g.addColorStop(0,'rgba(255,90,77,.35)'); g.addColorStop(1,'rgba(255,90,77,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(boss.x,boss.y,r*1.7,0,6.28); ctx.fill();
    const walk=(Math.floor(frame/10)%2===0);
    drawSprite(boss.sprite+(walk?'_walkA':'_walkB'), boss.x, boss.y, r, LAND); }
  function drawOrbit(){ for(const k in orbitPos){ const p=orbitPos[k], im=IMG['cocktail_'+k];
    ctx.save(); ctx.globalAlpha=0.55; const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,player.r*1.35); g.addColorStop(0,(WEAPONS[k]&&WEAPONS[k].col)||'#fff'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,player.r*1.35,0,6.28); ctx.fill(); ctx.restore();
    if(im){ const h=player.r*1.8, w=h*im.width/im.height; ctx.save(); ctx.imageSmoothingEnabled=false; ctx.drawImage(im,p.x-w/2,p.y-h/2,w,h); ctx.restore(); }
    else { ctx.fillStyle=(WEAPONS[k]&&WEAPONS[k].col)||'#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,player.r*0.5,0,6.28); ctx.fill(); } } }
  function drawPlayer(){ if(player.invuln>0 && frame%6<3) return;
    for(let i=0;i<player.trail.length;i++){ const p=player.trail[i],a=i/player.trail.length; ctx.globalAlpha=a*0.22; ctx.fillStyle='#8fe0c4'; ctx.beginPath(); ctx.arc(p.x,p.y,player.r*a,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
    const g=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.r*2.4); g.addColorStop(0,'rgba(120,230,200,.4)'); g.addColorStop(1,'rgba(120,230,200,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(player.x,player.y,player.r*2.4,0,6.28); ctx.fill();
    // ★이동 상태에 따른 포즈: 정지=stay, 앞(오른쪽)=straight, 뒤/위=rear. 세로로 서있는 스프라이트(회전 없음).
    const suf = player.pose==='straight' ? '_straight' : player.pose==='rear' ? '_rear' : '';
    const im=IMG['cb_'+player.char+suf];
    if(im){ const h=player.r*4.32, w=h*im.width/im.height; ctx.save(); ctx.translate(player.x,player.y); ctx.imageSmoothingEnabled=false; ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); }
    else { ctx.fillStyle='rgba(90,138,94,.9)'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,6.28); ctx.fill(); } }

  // ★타일 한 겹: '디바이스 픽셀' 정수 좌표로 직접 타일 → 배율(DPR)이 소수여도 타일 경계가
  //   실제 픽셀 격자에 딱 맞아 실금(1px 경계선)이 절대 안 생김. 타일폭·간격 모두 정수라 딱 붙음.
  function tileMirror(im, y, h, speed, offFrac){
    const hDev=Math.round(h*DPR), yDev=Math.round(y*DPR);
    const twDev=Math.max(1, Math.round(im.width*hDev/im.height));   // 정수 디바이스 타일폭
    const s=frame*speed*DPR + (offFrac||0)*twDev;
    const off=((s%twDev)+twDev)%twDev;
    const wDev=W*DPR;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;   // 디바이스 픽셀 공간
    for(let x=-off; x<wDev+twDev; x+=twDev){ ctx.drawImage(im, Math.round(x), yDev, twDev, hDev); }
    ctx.restore(); }
  function draw(){ ctx.clearRect(0,0,W,H); ctx.save(); if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    // ★강남 배경 — 원본 패턴 그대로 타일(좌우끝 색차 0 → 이음새 없음, 가공 흔적 없음).
    //   뒤 1겹(스카이라인, 이미지 자체가 25% 어두움) + 앞 3겹(하단정렬, 높이·속도 다르게).
    const bgi=IMG.bg_gangnam, fgi=IMG.fg_gangnam;
    if(bgi){
      tileMirror(bgi, 0, H, 0.18, 0);                             // 뒤: 스카이라인(느리게)
      ctx.fillStyle='rgba(3,5,12,0.72)'; ctx.fillRect(0,0,W,H);   // 어둠막(이미지+막 = 더 어둡게)
    }
    if(fgi){                                                      // 앞 3겹(뒤→앞: 느리고 높음 → 빠르고 낮음), 하단정렬
      tileMirror(fgi, H-H*0.60, H*0.60, 0.40, 0.15);
      tileMirror(fgi, H-H*0.50, H*0.50, 0.62, 0.55);
      tileMirror(fgi, H-H*0.40, H*0.40, 0.88, 0.80);
    }
    else { for(const s of stars){ ctx.globalAlpha=s.z*0.8; ctx.fillStyle='#cdd7ef'; ctx.fillRect(s.x*W,s.y*H,s.z*1.8,s.z*1.8); } ctx.globalAlpha=1; }
    for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
    if(state!=='title'){
      // coins
      for(const c of coinDrops){
        const pulse=0.6+0.4*Math.sin(frame*0.18+(c.x+c.y)*0.05);                          // ★반짝이는 맥동
        if(c.bill){   // ★지폐(초록 지폐, 발광)
          const gr=ctx.createRadialGradient(c.x,c.y,1,c.x,c.y,c.r*3);
          gr.addColorStop(0,'rgba(120,240,150,'+(0.5*pulse)+')'); gr.addColorStop(1,'rgba(90,200,120,0)');
          ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(c.x,c.y,c.r*3,0,6.28); ctx.fill();
          ctx.save(); ctx.shadowColor='#8bf5a8'; ctx.shadowBlur=12+6*pulse;
          ctx.fillStyle='#4caf6a'; ctx.strokeStyle='#1e5b32'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.rect(c.x-c.r*1.4,c.y-c.r*0.9,c.r*2.8,c.r*1.8); ctx.fill(); ctx.stroke(); ctx.restore();
          ctx.fillStyle='#eafff0'; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('₩5',c.x,c.y+1); ctx.textBaseline='alphabetic'; continue;
        }
        const gr=ctx.createRadialGradient(c.x,c.y,1,c.x,c.y,c.r*3.2);                       // 금빛 후광
        gr.addColorStop(0,'rgba(255,230,130,'+(0.55*pulse)+')'); gr.addColorStop(1,'rgba(255,210,74,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(c.x,c.y,c.r*3.2,0,6.28); ctx.fill();
        ctx.save(); ctx.shadowColor='#ffdf6e'; ctx.shadowBlur=10+6*pulse;                   // 발광
        ctx.fillStyle='#ffe66a'; ctx.strokeStyle='#a5771a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,6.28); ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.fillStyle='#fff'; ctx.globalAlpha=0.85*pulse; ctx.beginPath(); ctx.arc(c.x-c.r*0.3,c.y-c.r*0.3,c.r*0.32,0,6.28); ctx.fill(); ctx.globalAlpha=1;  // 하이라이트 광점
        ctx.fillStyle='#a5771a'; ctx.font='bold 8px monospace'; ctx.textAlign='center'; ctx.fillText('₩',c.x,c.y+3); }
      // player bullets
      for(const b of bullets){
        if(b.img && IMG[b.img]){ const im=IMG[b.img], h=b.r*2.8, w=h*im.width/im.height; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.spin?frame*0.32:(b.upright?0:((b.ang||-Math.PI/2)+Math.PI/2))); ctx.imageSmoothingEnabled=false; ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); continue; }
        ctx.fillStyle=b.col; ctx.shadowColor=b.col; ctx.shadowBlur=8;
        if(b.beam){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate((b.ang||-Math.PI/2)+Math.PI/2); ctx.fillRect(-b.r/2,-b.r*1.6,b.r,b.r*3.2); ctx.restore(); }
        else { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill(); } ctx.shadowBlur=0; } ctx.shadowBlur=0;
      // ★Madame 낙하 예고 원(수축)
      for(const m of dropMarks){ const p=1-m.life/m.max; ctx.save(); ctx.globalAlpha=0.5+0.4*Math.sin(frame*0.4);
        ctx.strokeStyle='#ff6ab0'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.28); ctx.stroke();
        ctx.fillStyle='rgba(255,120,170,'+(0.12+0.2*p)+')'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r*(0.3+0.7*p),0,6.28); ctx.fill();
        ctx.fillStyle='#ffd9ea'; ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Again!',m.x,m.y); ctx.textBaseline='alphabetic'; ctx.restore(); }
      for(const e of ebullets){ const col=e.col||'#ff6a5a';
        if(e.img && IMG[e.img]){ const im=IMG[e.img]; const h=e.r*2.4, w=h*im.width/im.height;   // ★CD 피사체 이미지(하트/아마로/무지개/음표)
          ctx.save(); ctx.translate(e.x, e.y + (e.bob!=null?Math.sin(frame*0.15+e.bob)*3:0));
          if(e.bob==null) ctx.rotate(Math.atan2(e.vy,e.vx));   // 진행 방향(음표는 회전 안 함)
          ctx.imageSmoothingEnabled=false; ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); continue; }
        ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
        if(e.vomit){ const w=(e.wob||0)+frame*0.2;   // 울퉁불퉁한 침 덩어리
          ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.28); ctx.arc(e.x+Math.cos(w)*e.r*0.6,e.y+Math.sin(w)*e.r*0.5,e.r*0.7,0,6.28); ctx.arc(e.x-Math.cos(w)*e.r*0.5,e.y+e.r*0.4,e.r*0.55,0,6.28); ctx.fill();
          ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(e.x-e.r*0.3,e.y-e.r*0.3,e.r*0.25,0,6.28); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.28); ctx.fill(); } ctx.shadowBlur=0; } ctx.shadowBlur=0;
      for(const e of enemies) drawEnemy(e); drawBoss();
      if(state==='play'||state==='levelup'){ drawPlayer(); drawOrbit(); }
    }
    ctx.restore();
    if(flashHit>0){ ctx.globalAlpha=flashHit*0.55; ctx.fillStyle='#ff5a4d'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(state==='play'||state==='levelup'){ document.getElementById('scoreVal').textContent=Math.floor(score).toLocaleString();
      document.getElementById('hiVal').textContent=best.toLocaleString(); document.getElementById('hpFill').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
      document.getElementById('hpText').textContent=Math.max(0,Math.ceil(player.hp))+'/'+Math.round(player.maxHp);
      document.getElementById('xpFill').style.width=(coins/coinNeed*100)+'%'; }
  }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  document.getElementById('hiTitle').textContent=best.toLocaleString(); loop();
})();
</script>
</body>
