<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pine &amp; Co — Missile Dodge</title>
<style>
  :root{ --pine:#5a8a5e; --gold:#c89a3c; --cream:#f0ebe0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#05070d; overflow:hidden; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:520px; max-height:100vh; margin:0 auto; }
  canvas{ display:block; width:100%; height:100%; background:radial-gradient(120% 80% at 50% -10%, #16213e 0%, #0a0f1f 55%, #05070d 100%); }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--cream); padding:24px; gap:14px; }
  .hidden{ display:none !important; }
  .brand{ font-size:12px; letter-spacing:4px; color:var(--gold); font-weight:800; }
  h1{ font-size:clamp(30px,10vw,52px); font-weight:900; letter-spacing:1px; line-height:1;
    text-shadow:0 0 24px rgba(200,154,60,.35); }
  h1 .em{ color:#ff5a4d; }
  .sub{ font-size:clamp(12px,3.6vw,15px); color:#a9b6cf; line-height:1.6; max-width:300px; }
  .btn{ margin-top:6px; padding:14px 40px; font-family:inherit; font-size:clamp(16px,4.8vw,20px); font-weight:800; letter-spacing:1px;
    color:#0a140a; background:var(--pine); border:2px solid #cfeccf; border-radius:30px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.5); }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.5); }
  .hi{ font-size:13px; color:#8ea0c0; }
  .hi b{ color:var(--gold); }
  #overTitle{ font-size:clamp(26px,8vw,40px); font-weight:900; color:#ff5a4d; text-shadow:0 0 20px rgba(255,90,77,.4); }
  .stat{ font-size:clamp(15px,4.4vw,19px); color:var(--cream); }
  .stat b{ color:var(--gold); font-size:1.35em; }
  .newrec{ color:var(--gold); font-weight:800; letter-spacing:2px; font-size:13px; animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }
  /* HUD */
  #hud{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px; pointer-events:none; color:var(--cream); }
  #score{ font-size:clamp(30px,9vw,46px); font-weight:900; font-variant-numeric:tabular-nums; text-shadow:0 2px 8px rgba(0,0,0,.6); line-height:1; }
  #score small{ display:block; font-size:11px; letter-spacing:2px; color:#8ea0c0; font-weight:700; margin-bottom:2px; }
  #hiHud{ text-align:right; font-size:12px; color:#8ea0c0; font-weight:700; }
  #hiHud b{ color:var(--gold); font-size:15px; display:block; }
  #lvlFlash{ position:absolute; top:34%; left:0; right:0; text-align:center; color:var(--gold); font-weight:900;
    font-size:clamp(20px,7vw,34px); letter-spacing:3px; opacity:0; text-shadow:0 0 18px rgba(200,154,60,.5); pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div id="score"><small>SURVIVED</small><span id="scoreVal">0.0</span></div>
    <div id="hiHud">BEST<b id="hiVal">0.0</b></div>
  </div>
  <div id="lvlFlash"></div>

  <div id="title" class="overlay">
    <div class="brand">PINE &amp; CO · ARCADE</div>
    <h1>MISSILE<br><span class="em">DODGE</span></h1>
    <div class="sub">하늘에서 미사일이 쏟아진다.<br>드래그(모바일)나 마우스로 잔을 움직여 최대한 오래 살아남아라.</div>
    <button class="btn" id="startBtn">START</button>
    <div class="hi">BEST · <b id="hiTitle">0.0</b>s</div>
  </div>

  <div id="over" class="overlay hidden">
    <div id="overTitle">DIRECT HIT</div>
    <div class="stat">SURVIVED · <b id="finalScore">0.0</b>s</div>
    <div class="stat" style="font-size:.85em">BEST · <span id="finalBest">0.0</span>s</div>
    <div class="newrec hidden" id="newRec">★ NEW RECORD ★</div>
    <button class="btn" id="retryBtn">RETRY</button>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const wrap=document.getElementById('wrap');
  let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){ const r=wrap.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();

  // ── state ──
  let state='title', frame=0, t=0, best=parseFloat(localStorage.getItem('pine_missile_hi')||'0')||0;
  const player={ x:0,y:0, tx:0,ty:0, r:13, trail:[] };
  let missiles=[], parts=[], stars=[], shake=0, level=1, spawnT=0, flashHit=0;
  const lvlFlashEl=document.getElementById('lvlFlash');

  // ── audio (synth, no assets) ──
  let AC=null;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function beep(freq,dur,type,vol){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime((vol||0.14),a.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02); }catch(e){} }
  function boom(){ const a=ac(); if(!a) return; try{
    const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(30,a.currentTime+0.5);
    g.gain.setValueAtTime(0.6,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.6);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.65);
    const dur=0.5,sr=a.sampleRate,b=a.createBuffer(1,Math.floor(sr*dur),sr),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    const s=a.createBufferSource(); s.buffer=b; const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g2=a.createGain(); g2.gain.setValueAtTime(0.5,a.currentTime); g2.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    s.connect(lp); lp.connect(g2); g2.connect(a.destination); s.start(); s.stop(a.currentTime+dur);
  }catch(e){} }

  // ── stars ──
  function initStars(){ stars=[]; for(let i=0;i<70;i++) stars.push({ x:Math.random(), y:Math.random(), z:Math.random()*0.8+0.2 }); }
  initStars();

  // ── input ──
  let pointerActive=false;
  function setTarget(cx,cy){ const r=cv.getBoundingClientRect(); player.tx=Math.max(player.r, Math.min(W-player.r, cx-r.left)); player.ty=Math.max(player.r, Math.min(H-player.r, cy-r.top)); }
  cv.addEventListener('pointerdown',e=>{ pointerActive=true; setTarget(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('pointermove',e=>{ if(state==='play'&&(pointerActive||e.pointerType==='mouse')) setTarget(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('pointerup',()=>{ pointerActive=false; },{passive:true});
  // keyboard
  const keys={};
  window.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' '){ if(state!=='play') start(); } });
  window.addEventListener('keyup',e=>{ keys[e.key]=false; });

  document.getElementById('startBtn').onclick=start;
  document.getElementById('retryBtn').onclick=start;

  function start(){
    ac(); state='play'; t=0; frame=0; level=1; spawnT=0; shake=0; flashHit=0;
    missiles=[]; parts=[];
    player.x=W/2; player.y=H*0.78; player.tx=player.x; player.ty=player.y; player.trail=[];
    document.getElementById('title').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  }

  function spawnMissile(){
    const homing = Math.random() < Math.min(0.4, 0.08+level*0.03);
    const speed = (2.2 + level*0.42 + Math.random()*1.4);
    missiles.push({ x:Math.random()*(W-40)+20, y:-30, vx:(Math.random()-0.5)*1.2, vy:speed,
      r:9, homing, hue: homing?18:0, wob:Math.random()*6.28 });
  }

  function addExplosion(x,y,col,n){ for(let i=0;i<(n||18);i++){ const a=Math.random()*6.28, s=1+Math.random()*4;
    parts.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, r:1+Math.random()*3, col }); } }

  function die(){
    state='over'; boom(); addExplosion(player.x,player.y,'#ff6a4d',40); addExplosion(player.x,player.y,'#ffd24a',24);
    shake=22; flashHit=1;
    const sc=t; const isRec=sc>best; if(isRec){ best=sc; localStorage.setItem('pine_missile_hi',best.toFixed(1)); }
    document.getElementById('finalScore').textContent=sc.toFixed(1);
    document.getElementById('finalBest').textContent=best.toFixed(1);
    document.getElementById('newRec').classList.toggle('hidden',!isRec);
    document.getElementById('hud').classList.add('hidden');
    setTimeout(()=>document.getElementById('over').classList.remove('hidden'),650);
  }

  function update(){
    frame++;
    if(state==='play'){
      t+=1/60;
      // 난이도(레벨) 상승: 12초마다
      const nl=1+Math.floor(t/12);
      if(nl>level){ level=nl; lvlFlashEl.textContent='WAVE '+level; lvlFlashEl.style.opacity='1';
        setTimeout(()=>lvlFlashEl.style.opacity='0',700); beep(660,0.12,'square',0.1); beep(990,0.12,'square',0.08); }
      // 스폰
      spawnT--; const rate=Math.max(9, 40 - level*3.5);
      if(spawnT<=0){ spawnMissile(); if(level>=4 && Math.random()<0.5) spawnMissile(); spawnT=rate*(0.6+Math.random()*0.8); }
      // 플레이어: 포인터 추적 + 키보드
      const kb=6.5; if(keys['ArrowLeft']||keys['a']) player.tx-=kb; if(keys['ArrowRight']||keys['d']) player.tx+=kb;
      if(keys['ArrowUp']||keys['w']) player.ty-=kb; if(keys['ArrowDown']||keys['s']) player.ty+=kb;
      player.tx=Math.max(player.r,Math.min(W-player.r,player.tx)); player.ty=Math.max(player.r,Math.min(H-player.r,player.ty));
      player.x+=(player.tx-player.x)*0.35; player.y+=(player.ty-player.y)*0.35;
      player.trail.push({x:player.x,y:player.y}); if(player.trail.length>10) player.trail.shift();
      // 미사일 이동 + 충돌
      for(let i=missiles.length-1;i>=0;i--){ const m=missiles[i];
        if(m.homing){ const dx=player.x-m.x; m.vx+=Math.max(-0.09,Math.min(0.09,dx*0.006)); m.vx*=0.98; }
        m.wob+=0.3; m.x+=m.vx+Math.sin(m.wob)*0.3; m.y+=m.vy;
        // 화염 트레일
        if(frame%2===0) parts.push({ x:m.x+(Math.random()-0.5)*4, y:m.y-8, vx:(Math.random()-0.5)*0.6, vy:1+Math.random(), life:1, r:2+Math.random()*2, col:m.homing?'#ff9a3c':'#ff5a3c', fade:0.06 });
        // 충돌
        const dd=Math.hypot(m.x-player.x,m.y-player.y);
        if(dd < m.r+player.r-2){ addExplosion(m.x,m.y,'#ff8a3c',12); missiles.splice(i,1); die(); break; }
        if(m.y>H+40) missiles.splice(i,1);
      }
    }
    // 파티클
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.life-=(p.fade||0.03); if(p.life<=0) parts.splice(i,1); }
    if(shake>0) shake*=0.86; if(shake<0.4) shake=0;
    if(flashHit>0) flashHit-=0.05;
    // stars drift
    for(const s of stars){ s.y+=0.0004*(state==='play'?(1+level*0.3):0.5); if(s.y>1) s.y-=1; }
  }

  function drawMissile(m){ ctx.save(); ctx.translate(m.x,m.y); const ang=Math.atan2(m.vy,m.vx)-Math.PI/2; ctx.rotate(ang);
    // body
    ctx.fillStyle=m.homing?'#ffb14d':'#e0e6ef'; ctx.strokeStyle='#20242e'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,-m.r*1.7); ctx.lineTo(m.r*0.7,-m.r*0.2); ctx.lineTo(m.r*0.7,m.r*1.1); ctx.lineTo(-m.r*0.7,m.r*1.1); ctx.lineTo(-m.r*0.7,-m.r*0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // nose
    ctx.fillStyle=m.homing?'#ff5a4d':'#ff4d4d'; ctx.beginPath(); ctx.moveTo(0,-m.r*1.7); ctx.lineTo(m.r*0.7,-m.r*0.2); ctx.lineTo(-m.r*0.7,-m.r*0.2); ctx.closePath(); ctx.fill();
    // fins
    ctx.fillStyle=m.homing?'#c9791f':'#9aa3b2'; ctx.beginPath(); ctx.moveTo(-m.r*0.7,m.r*0.5); ctx.lineTo(-m.r*1.4,m.r*1.3); ctx.lineTo(-m.r*0.7,m.r*1.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(m.r*0.7,m.r*0.5); ctx.lineTo(m.r*1.4,m.r*1.3); ctx.lineTo(m.r*0.7,m.r*1.1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawPlayer(){
    // trail
    for(let i=0;i<player.trail.length;i++){ const p=player.trail[i], a=i/player.trail.length;
      ctx.globalAlpha=a*0.28; ctx.fillStyle='#8fe0c4'; ctx.beginPath(); ctx.arc(p.x,p.y,player.r*a,0,6.28); ctx.fill(); }
    ctx.globalAlpha=1;
    // glow
    const g=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.r*2.6);
    g.addColorStop(0,'rgba(120,230,200,.5)'); g.addColorStop(1,'rgba(120,230,200,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(player.x,player.y,player.r*2.6,0,6.28); ctx.fill();
    // martini glass
    const x=player.x, y=player.y, s=player.r;
    ctx.strokeStyle='#eafff6'; ctx.fillStyle='rgba(90,138,94,.85)'; ctx.lineWidth=2.4; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(x-s,y-s*0.7); ctx.lineTo(x+s,y-s*0.7); ctx.lineTo(x,y+s*0.15); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y+s*0.15); ctx.lineTo(x,y+s*0.95); ctx.moveTo(x-s*0.55,y+s*0.95); ctx.lineTo(x+s*0.55,y+s*0.95); ctx.stroke();
    // olive
    ctx.fillStyle='#ff5a6a'; ctx.beginPath(); ctx.arc(x+s*0.28,y-s*0.42,s*0.2,0,6.28); ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    // stars
    for(const s of stars){ ctx.globalAlpha=s.z*0.8; ctx.fillStyle='#cdd7ef'; const px=s.x*W, py=s.y*H; ctx.fillRect(px,py,s.z*1.8,s.z*1.8); }
    ctx.globalAlpha=1;
    // ground glow (bar counter line)
    const gg=ctx.createLinearGradient(0,H*0.86,0,H); gg.addColorStop(0,'rgba(90,138,94,0)'); gg.addColorStop(1,'rgba(90,138,94,.18)');
    ctx.fillStyle=gg; ctx.fillRect(0,H*0.86,W,H*0.14);
    // particles (behind)
    for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
    ctx.globalAlpha=1;
    if(state==='play'||state==='over'){ for(const m of missiles) drawMissile(m); if(state==='play') drawPlayer(); }
    ctx.restore();
    // hit flash
    if(flashHit>0){ ctx.globalAlpha=flashHit*0.6; ctx.fillStyle='#ff5a4d'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    // hud score
    if(state==='play'){ document.getElementById('scoreVal').textContent=t.toFixed(1);
      document.getElementById('hiVal').textContent=best.toFixed(1); }
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  // init labels
  document.getElementById('hiTitle').textContent=best.toFixed(1);
  loop();
})();
</script>
</body>
</html>
