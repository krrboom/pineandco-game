<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PINE &amp; CO · MENU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{ --red:#bd1a26; --cream:#efe9dc; --ink:#20232b; --wine:#8f1f22; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#111; }
  body{ font-family:'Press Start 2P', monospace; color:var(--cream); display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  .kr{ font-family:'DungGeunMo','Malgun Gothic',system-ui,sans-serif; }
  #wrap{ position:relative; width:100vw; height:100vh; max-width:520px; margin:0 auto; overflow:hidden; background:#0d0f0c; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px 16px; text-align:center; }
  .hidden{ display:none !important; }
  /* 홈(카테고리) */
  #home{ background:radial-gradient(120% 90% at 50% -10%, #2a0d10 0%, #0d0f0c 60%); }
  .brand{ font-size:10px; letter-spacing:3px; color:#c98; }
  h1{ font-size:clamp(18px,6vw,28px); color:var(--cream); line-height:1.4; text-shadow:2px 2px 0 #000; }
  .cats{ display:flex; flex-direction:column; gap:12px; width:min(360px,88vw); margin-top:10px; }
  .cat{ font-family:'Press Start 2P',monospace; font-size:clamp(10px,3vw,13px); line-height:1.4; color:#0d140a; background:var(--red); color:#fff;
    border:3px solid #000; box-shadow:0 5px 0 #000; padding:18px 14px; cursor:pointer; letter-spacing:1px; }
  .cat:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .cat small{ display:block; font-size:.6em; color:#f3c9cb; margin-top:8px; letter-spacing:2px; }
  .cat.soon{ background:#2a2d2a; color:#777; box-shadow:0 5px 0 #000; }
  /* 메뉴 이미지 + 오버레이 */
  #menu{ justify-content:flex-start; padding:0; background:#0d0f0c; }
  .menuwrap{ position:relative; width:100%; max-width:520px; aspect-ratio:1191/1684; background:#bd1a26 center/contain no-repeat; margin:auto; }
  /* 각 컬럼 = 하나의 세로 흐름(이름→재료→가격) → 서로 안 겹침. 좌우 대칭(중심 26% / 74%) */
  .mcol{ position:absolute; top:26.5%; width:42%; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .mcol.left{ left:5%; } .mcol.right{ left:53%; }
  .cname{ font-family:'Press Start 2P',monospace; font-size:clamp(8px,2.5vw,11px); line-height:1.55; color:var(--ink); background:none; border:none; cursor:pointer; padding:2px 0; letter-spacing:.2px; }
  .cname:active{ transform:scale(.95); }
  .cname .dot{ display:block; margin-top:4px; font-size:.7em; color:var(--wine); }
  .ckr{ font-size:clamp(8px,2.7vw,11px); font-weight:700; color:#3a3d45; margin-top:4px; margin-bottom:10px; }
  .ings{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .ing{ font-family:'Press Start 2P',monospace; font-size:clamp(5px,1.8vw,7.5px); line-height:1.5; color:#2a2d34; }
  .mprice{ margin-top:12px; font-family:'Press Start 2P',monospace; font-size:clamp(7px,2.2vw,10px); color:var(--red); letter-spacing:.5px; }
  .backbtn{ position:fixed; top:10px; left:10px; z-index:20; font-family:'Press Start 2P',monospace; font-size:10px; color:#fff; background:rgba(0,0,0,.55); border:2px solid #fff; padding:8px 12px; cursor:pointer; }
  .tap-hint{ position:absolute; bottom:2%; left:0; right:0; text-align:center; font-family:-apple-system,"Malgun Gothic",sans-serif; font-size:10px; color:rgba(255,255,255,.7); }
  /* 칵테일 모달 */
  #modal{ position:fixed; inset:0; z-index:40; background:rgba(8,6,6,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
  #modalImg{ max-width:74%; max-height:56vh; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
  #modalName{ font-size:clamp(12px,4vw,18px); color:var(--cream); text-shadow:2px 2px 0 #000; line-height:1.5; }
  #modalKr{ font-size:12px; color:#e6b; }
  #modalClose{ font-family:'Press Start 2P',monospace; font-size:11px; color:#0d140a; background:var(--cream); border:3px solid #000; box-shadow:0 4px 0 #000; padding:12px 22px; cursor:pointer; margin-top:6px; }
  #modalClose:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; }
</style>
</head>
<body>
<div id="wrap">
  <!-- 홈: 카테고리 -->
  <div id="home" class="screen">
    <div class="brand">PINE &amp; CO · SEOUL</div>
    <h1>MENU</h1>
    <div class="cats">
      <button class="cat" id="catRedHands">CAMPARI RED HANDS<small>APAC 2026 · COMPETITION</small></button>
      <button class="cat soon">SIGNATURE<small>COMING SOON</small></button>
      <button class="cat soon">CLASSIC<small>COMING SOON</small></button>
    </div>
  </div>

  <!-- 메뉴: Red Hands 이미지 + 픽셀 텍스트 오버레이 -->
  <div id="menu" class="screen hidden">
    <button class="backbtn" id="backBtn">← BACK</button>
    <div class="menuwrap" id="menuwrap">
      <!-- 왼쪽 -->
      <div class="mcol left">
        <button class="cname" data-ck="americano">Twilling<br>Americano<span class="dot">▸ TAP</span></button>
        <div class="ckr kr">아메리카노</div>
        <div class="ings">
          <div class="ing">Campari</div>
          <div class="ing">Sweet Vermouth</div>
          <div class="ing">Cacao &amp; Coffee<br>Infuse Skyy Vodka</div>
          <div class="ing">Distilled Coffee Soda</div>
          <div class="ing">Yakgwa &amp; Toffee<br>Espuma</div>
        </div>
        <div class="mprice">26,000 KRW</div>
      </div>
      <!-- 오른쪽 -->
      <div class="mcol right">
        <button class="cname" data-ck="italyjuice">Italy<br>Juice<span class="dot">▸ TAP</span></button>
        <div class="ckr kr">이태리</div>
        <div class="ings">
          <div class="ing">Campari</div>
          <div class="ing">Tomato Juice</div>
          <div class="ing">Fresh Pineapple<br>Puree</div>
          <div class="ing">Basil Vermouth</div>
          <div class="ing">Olive &amp; Savory<br>Cream Cheese</div>
        </div>
        <div class="mprice">26,000 KRW</div>
      </div>
    </div>
    <div class="tap-hint kr">칵테일 이름을 누르면 이미지가 나와요</div>
  </div>

  <!-- 칵테일 이미지 모달 -->
  <div id="modal" class="hidden">
    <img id="modalImg" src="" alt="">
    <div id="modalName">—</div>
    <div id="modalKr" class="kr">—</div>
    <button id="modalClose">✕ CLOSE</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const CK={ americano:{ img:'assets/cocktail_americano.png', name:'Twilling Americano', kr:'아메리카노' },
             italyjuice:{ img:'assets/cocktail_italyjuice.png', name:'Italy Juice', kr:'이태리' } };
  // 메뉴 배경 이미지
  $('menuwrap').style.backgroundImage="url('assets/campari_menu.png')";
  // 카테고리 → 메뉴
  $('catRedHands').onclick=()=>{ $('home').classList.add('hidden'); $('menu').classList.remove('hidden'); };
  $('backBtn').onclick=()=>{ $('menu').classList.add('hidden'); $('home').classList.remove('hidden'); };
  // 칵테일 이름 → 이미지 모달
  document.querySelectorAll('.cname').forEach(b=>{ b.onclick=()=>{ const c=CK[b.getAttribute('data-ck')]; if(!c) return;
    $('modalImg').src=c.img; $('modalName').textContent=c.name; $('modalKr').textContent=c.kr; $('modal').classList.remove('hidden'); }; });
  $('modalClose').onclick=()=>$('modal').classList.add('hidden');
  $('modal').onclick=e=>{ if(e.target===$('modal')) $('modal').classList.add('hidden'); };
  // 이미지 프리로드
  ['assets/campari_menu.png','assets/cocktail_americano.png','assets/cocktail_italyjuice.png'].forEach(s=>{ const i=new Image(); i.src=s; });
})();
</script>
</body>
</html>
